  transition: opacity .2s ease, -webkit-backdrop-filter .3s ease, backdrop-filter .3s ease; }

/* 统一的圆角图标按钮底座：背景/描边/按下反馈只在这里定义一次，

/* 分类页头 */
/* 分类页头：原来写死纯黑（#000000），跟首页/详情页现在都跟着海报自动变色的暖色调背景放一起，
   顶上突兀地卡一条黑条，很显眼很尴尬。改成跟 --dyn-bg-rgb 同色系的半透明磨砂条——颜色跟着
   当前页面的主题色走，同时留一点模糊（backdrop-filter）方便下面滚动的内容衬着文字看得清，

.cat-head { display: flex; align-items: center; gap: 8px; padding: calc(var(--safe-top) + 8px) var(--gut) 8px;
  position: sticky; top: 0; z-index: 20;

  backdrop-filter: blur(20px) saturate(1.15); }
/* 返回按钮：原来直接吃 .icon-btn 的通用方形底座（10px 圆角、纯色板 + 细描边），
   跟其它功能性图标按钮长一个样，放在页头左上角显得很"工具栏"，不够精致。
   改成苹果系统里常见的圆形毛玻璃返回键：正圆形、更强的模糊透光、外投影给一点浮起的
   厚度感，再叠一条极淡的内上高光模拟玻璃球面反光。按压时用回弹曲线代替瞬间跳变的
   scale，松手时的手感更软。箭头本身在 24 视口里其实比几何中心略靠右一点点，
   这里用 svg 自身的 translateX 往左挪 1px，视觉上更居中。 */
.cat-back {

  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  backdrop-filter: blur(16px) saturate(1.4);
  transition: transform .38s cubic-bezier(.34, 1.56, .64, 1), background .2s ease, box-shadow .2s ease, border-color .2s ease;

}
.tv-mode .cat-back.focus, .tv-mode .cat-back:focus {
  transform: scale(1.14);
  box-shadow: 0 0 0 3px var(--accent-line), 0 3px 12px rgba(0, 0, 0, .22);
}
.cat-title { font-size: 18px; font-weight: 800; flex: 0 0 auto; max-width: 40%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 搜索结果页头：把"搜索：关键词"这行纯文字标题换成一个"搜索框"样式的按钮——

  -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; transition: background .18s ease, border-color .18s ease; }
.cat-searchbar .csb-ico { flex: 0 0 auto; display: flex; color: var(--ink-faint); }
.cat-searchbar .csb-kw { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; text-align: left; }
.cat-searchbar:active { background: var(--accent-soft); border-color: var(--accent-line); }
#catView.searching .cat-title { display: none; }

/* 胶囊掉到第二行、整行左对齐；order 拉大保证它排在这一行所有元素最后（即换行到下一行） */
#catView.searching #genreChips { order: 99; flex: 0 0 100%; max-width: 100%; width: 100%; margin: 0; justify-content: flex-start; }
.hero-wrap { position: relative; }
.hero-wrap[hidden] { display: none; }
.hero { position: relative; width: 100%; height: 58vh; min-height: 340px; max-height: 560px; overflow: hidden; margin: 0 0 6px; background: var(--sheet-bg); }
.hero:empty { display: none; }
@media (orientation: landscape) { .hero { height: 85vh; min-height: 280px; } }
/* 平板竖屏（宽度够大且竖屏）：轮播海报加高 8vh，画面更饱满。max-height 也放宽以免被 560px 卡住 */
@media (min-width: 600px) and (orientation: portrait) { .hero { height: 66vh; max-height: 720px; } }
/* 图片层：不参与左右翻页位移，只在当前帧/目标帧之间做透明度交叉渐隐渐显，
   叠色（hero-shade/hero-blend）跟着 --dyn-bg-rgb 同步瞬时变化，观感上颜色融合和图片过渡完全同步。 */
.hero-imgs { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; }
.hero-track { position: relative; z-index: 1; display: flex; height: 100%; transition: transform .5s cubic-bezier(.4, 0, .2, 1); will-change: transform; }
.hero-slide { position: relative; flex: 0 0 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; opacity: 0; transition: opacity .5s cubic-bezier(.4, 0, .2, 1); }
.hero-bg.active { opacity: 1; }
/* 顶部渐变原来用 --dyn-bg-rgb（全图众数主色）去染顶部/次顶部区域，
   问题：主色是"整张海报"的投票结果，跟顶部那一小条局部像素的真实颜色（比如深色头发/五官）
   完全没有对应关系，容易出现"局部本来是黑的，却被强行染成主色（红/蓝等）"的违和感。
   改成不跟随主色、只用于状态栏文字可读性的极淡中性色，不再随海报变色。 */
.hero-shade { position: absolute; inset: 0; background:
  linear-gradient(to bottom, rgba(0,0,0,.28) 0%, transparent 22%); }
/* 底部融合层：不是拿一块纯色硬盖上去（那样不管颜色多准，照片的清晰细节和纯色之间还是有一条能看出来的边），
   而是用 backdrop-filter 把这块区域"背后的图"本身模糊掉，再叠一层从透明到接近实色的动态色渐变——
   越往下越糊、越往下颜色越重，模糊+调色是同步渐进的，所以看不出"从这里开始模糊/从这里开始变色"的分界线。
   最底部渐变到 .94 的不透明度，正好接近下方页面 --dyn-bg 的实色，和页面背景连成一片。
   自身再用 mask-image 做一次由上到下的显现渐变，让这层"变糊变色"的过渡本身也是渐进出现的，不是一整块突然出现。 */
/* 底部融合：主页轮播跟着视差滚动，用【单层】backdrop-filter（滚动流畅，不闪）。
   关键是 mask 的透明度要【全程平缓爬升】——之前 62% 就到全黑(#000)，导致下半截是一整块满模糊、
   和上面渐变段之间有明显硬分界。这里改成从顶部一路多档缓升，直到贴底才接近全实，
   模糊强度全程渐进，看不出"分界带"。 */
.hero-blend {
  position: absolute; left: 0; right: 0; bottom: -2px; height: calc(56% + 2px); pointer-events: none;
  -webkit-backdrop-filter: blur(22px) saturate(1.12); backdrop-filter: blur(22px) saturate(1.12);
  background: linear-gradient(to bottom, rgba(var(--dyn-bg-rgb), 0) 0%, rgba(var(--dyn-bg-rgb), .22) 34%, rgba(var(--dyn-bg-rgb), .6) 58%, rgba(var(--dyn-bg-rgb), .9) 80%, rgba(var(--dyn-bg-rgb), 1) 92%, rgba(var(--dyn-bg-rgb), 1) 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.04) 12%, rgba(0,0,0,.12) 26%, rgba(0,0,0,.26) 40%, rgba(0,0,0,.45) 54%, rgba(0,0,0,.66) 68%, rgba(0,0,0,.85) 82%, #000 96%);
  mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.04) 12%, rgba(0,0,0,.12) 26%, rgba(0,0,0,.26) 40%, rgba(0,0,0,.45) 54%, rgba(0,0,0,.66) 68%, rgba(0,0,0,.85) 82%, #000 96%);
}
/* 横屏（平板/手机横放）：屏幕更矮更宽，56% 高度占比过大会糊到海报主体。调矮到 44%，
   模糊区更靠下，不遮画面。渐变/mask 比例是跟着高度百分比自动收缩的，只是整体下移。 */
@media (orientation: landscape) { .hero-blend { height: calc(44% + 2px); -webkit-backdrop-filter: blur(18px) saturate(1.12); backdrop-filter: blur(18px) saturate(1.12); } }
.hero-info { position: relative; z-index: 1; padding: 0 20px 36px; text-align: center; }

/* ============================================================
   首页轮播「异步滑动」视差（自 emby 首页移植）
   目标：下滑时只有海报图(.hero-bg)慢半拍上移，.hero-shade / .hero-blend / .hero-info
   全部保持页面常速、和下面的内容行一起走 —— 融合渐变便会自下而上把慢下来的海报逐渐"淹没"，
   出现景深分层感；而信息文字始终贴着内容，不会脱节割裂。

   为什么用滚动驱动动画(animation-timeline)而不是 JS 监听 scroll 写 transform：
   滚动本身跑在合成器线程，JS 改 transform 跑在主线程，海报位置永远比内容慢一帧 → 肉眼可见抖动，
   这是原理性的，调参数消不掉。绑到滚动时间轴上则整条动画由浏览器在合成器线程驱动，与滚动同帧。

   ⚠ 两个坑（都已避开）：
   1) 时间轴用 scroll(root block) —— 本页是「整个窗口」在滚（window.scrollTo/pageYOffset），
      根滚动器就是文档。这里绝不能用 scroll(nearest)：.hero 和 .hero-slide 都带 overflow:hidden，
      它们本身就算"滚动容器"，nearest 会命中它们，而它们根本不滚 → 进度恒为 0 → 完全没效果。
   2) 位移只加在 .hero-bg 上，绝不碰 .hero-track —— 那一层的 transform 是轮播左右翻页在用的，
      动它会把轮播搞坏。
   ============================================================ */
@supports (animation-timeline: scroll()) {
  /* 动画区间要知道 hero 实际高度：用与 .hero 完全相同的算式复刻（含 min/max-height → clamp） */
  .hero { --hero-h: clamp(340px, 58vh, 560px); }
  @media (orientation: landscape) { .hero { --hero-h: clamp(280px, 85vh, 560px); } }
  @media (min-width: 600px) and (orientation: portrait) { .hero { --hero-h: clamp(340px, 66vh, 720px); } }

  /* 海报：慢速下压(视差) + 极轻微推近(景深)。整条动画在合成器上跑，带 scale 也依然丝滑 */
  @keyframes heroParallax {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(0, calc(var(--hero-h, 58vh) * .42), 0) scale(1.06); }
  }
  /* 信息层：前 30% 完全不动、保持清晰，之后随滚动优雅淡出（只改透明度、不改位移，
     所以依旧与内容同速，不会重现"脱节"的割裂感） */
  @keyframes heroInfoFade {
    0%, 30% { opacity: 1; }
    100%    { opacity: 0; }
  }
  /* 注意声明顺序：animation 简写会把 animation-timeline 重置为 auto，
     所以 animation-timeline / animation-range 必须写在简写「之后」，否则又变成不动。 */
  .hero-bg {
    animation: heroParallax linear both;
    animation-timeline: scroll(root block);
    animation-range: 0px var(--hero-h, 58vh);
    will-change: transform; backface-visibility: hidden;
  }
  .hero-info {
    animation: heroInfoFade linear both;
    animation-timeline: scroll(root block);
    animation-range: 0px calc(var(--hero-h, 58vh) * .78);
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-bg { animation: none; }
    .hero-info { animation: none; opacity: 1; }
  }
}
.hero-title-wrap { display: flex; justify-content: center; }
.hero-title { font-size: 30px; font-weight: 900; letter-spacing: -.02em; line-height: 1.08; text-shadow: 0 2px 18px rgba(0,0,0,.55); max-width: 90%; margin: 0 auto 10px; }
.hero-logo { display: block; max-width: 74%; max-height: 84px; width: auto; height: auto; margin: 0 auto 12px; object-fit: contain; filter: drop-shadow(0 4px 16px rgba(0,0,0,.6)); }
.hero-meta { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink-dim); text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.hero-meta { color: #d8def0; }
.hero-ov { margin: 9px auto 0; font-size: 13px; color: #c7cddf; line-height: 1.55; max-width: 94%; text-shadow: 0 1px 6px rgba(0,0,0,.6); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
/* 横版（手机横屏）时轮播信息改左对齐：标题、徽标、元信息、简介都靠左，不再居中，
   跟竖版是两套独立的对齐方式，互不影响。 */

}
/* 轮播指示器（圆点） */
.hero-dots { position: absolute; left: 0; right: 0; bottom: 13px; z-index: 4; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; }
.hero-dots:empty { display: none; }

.hero-dot.on { width: 16px; background: #fff; }

  width: auto; max-width: 94%; display: inline-flex; align-items: center; gap: 2px; justify-content: center; z-index: 45;
  background: rgba(18, 26, 54, 0.62); -webkit-backdrop-filter: blur(24px) saturate(1.7); backdrop-filter: blur(24px) saturate(1.7);
  border: 1px solid rgba(160, 190, 255, 0.16); border-radius: 999px; padding: 5px 7px; overflow: visible;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.10);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.chip { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  padding: 7px 22px; border-radius: 999px; background: none; border: 0; color: var(--ink-dim); font-size: 10px; font-weight: 700; white-space: nowrap; transition: color .16s, background .16s;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.chip .chip-ico { width: 23px; height: 23px; display: block; }
.chip[data-nav="settings"] .chip-ico { width: 22px; height: 22px; }
.chip.active { background: var(--accent-soft); color: var(--accent); }
.chip:active { transform: scale(.94); }
.tv-mode .chip.focus, .tv-mode .chip:focus { transform: scale(1.08); }
/* 给内容留出底栏空间；详情/设置打开时隐藏底栏 */
main { padding-bottom: calc(78px + var(--safe-bottom)); }
body.detail-active .chips { display: none; }
.chips::-webkit-scrollbar { display: none; }
/* 二级类型筛选 chips：横向滑动这里不再自己用 JS 接管 touchmove 手搓惯性/橡皮筋——
   之前 touch-action: none 会把这块区域的滚动完全交给 JS 主线程处理，每一帧 touchmove
   都要走一遍 JS（还强制 preventDefault），走不了浏览器/系统那条硬件加速的合成线程滚动
   通道，参数调得再准也比不过原生滚动的跟手度，低端设备上还会明显掉帧、延迟，这才是
   "不灵敏"的根子，不是触摸区域大小的问题。
   改成 touch-action: pan-x：告诉浏览器"这个元素只接管横向平移手势"，横向滑动直接走原生
   滚动（自带真实的惯性衰减和越界橡皮筋回弹，观感就是 iOS 原生的样子），竖直方向的手势
   不被这里拦截，会正常冒泡去滚整个页面，不会出现"划到这排标签就滑不动整页"的问题。 */
.genre-chips { display: flex; flex: 1 1 auto; min-width: 0; justify-content: safe center; overflow-x: auto; white-space: nowrap; margin-left: 0; padding: 2px 0; -webkit-overflow-scrolling: touch; scrollbar-width: none; touch-action: pan-x; overscroll-behavior-x: contain; }
.genre-chips::-webkit-scrollbar { display: none; }
.genre-chips:empty { display: none; margin: 0; }
.genre-chip { flex: 0 0 auto; margin-right: 6px; padding: 4px 11px; border-radius: 8px; font-size: 12px; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--ink-dim); }
.genre-chip.active { background: var(--accent-soft); border-color: var(--accent-line); color: var(--ink); font-weight: 600; }
/* 搜索结果站源筛选栏复用 .genre-chip，额外挂一个计数徽标（如截图里"全部 75"那种圆角数字）。
   分组标题 .search-group-title 直接放进 #grid 里，用 grid-column:1/-1 撑满整行，
   不需要另起一个网格容器——分组之间共用同一个网格的列宽/间距，视觉上更连贯。 */
.genre-chip .chip-count { margin-left: 5px; font-size: 10.5px; font-weight: 700; line-height: 15px; min-width: 15px;
  display: inline-block; text-align: center; padding: 0 5px; border-radius: 999px; background: rgba(255,255,255,.12); color: inherit; }
.genre-chip.active .chip-count { background: rgba(0,0,0,.18); }
.search-group-title { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 8px;
  font-size: 15px; font-weight: 700; color: var(--ink); margin: 18px 0 2px; }
.search-group-title:first-child { margin-top: 2px; }
.search-group-title .cnt { font-size: 12px; font-weight: 500; color: var(--ink-dim); }

/* 区块 */
.section { padding: 12px 0 0; }
.section-head { display: flex; align-items: center; margin-bottom: 10px; padding: 0 var(--gut); }
.section-title { display: none; }
.section-sub { display: none; }
.clear-search { flex: 0 0 auto; width: 26px; height: 26px; margin-left: 2px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  background: var(--panel); border: 1px solid var(--line); color: var(--ink-faint);
  -webkit-tap-highlight-color: transparent; transition: background .15s ease, border-color .15s ease, color .15s ease; }
.clear-search:active { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }

.rail { display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.rail .card { flex: 0 0 auto; width: 132px; margin-right: 0; white-space: normal; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--card-gut); margin: 0; padding: 0 var(--card-gut); align-items: start; width: 100%; min-width: 0; overflow: hidden; }
/* 左右滑动切换分类/筛选标签时，新内容的方向性动画（见 gridSwipeAnim）。
   之前用多阶段关键帧模拟"弹簧回弹"，位移会先冲过头再往回缩一点，视觉上是内容在原地
   小幅度弹跳/抖动，不是真的"流动过来"的感觉，观感反而更别扭。
   现在改回最直接的思路：内容整体从滑动方向的那一侧，用单段纯位移 + 减速缓动
   （不过冲、不回弹）滑到位——手指往左划，新内容就从右边平滑流进来；往右划，
   就从左边流进来。没有缩放、没有透明度变化，只有一次干净利落的横向位移，
   最贴近"内容左右流动过来"这种直观的滑动手感。 */
@keyframes gridSwipeInL { from { transform: translateX(64px); } to { transform: translateX(0); } }
@keyframes gridSwipeInR { from { transform: translateX(-64px); } to { transform: translateX(0); } }
.grid.grid-swipe-l { animation: gridSwipeInL .36s cubic-bezier(.22, 1, .36, 1); will-change: transform; }
.grid.grid-swipe-r { animation: gridSwipeInR .36s cubic-bezier(.22, 1, .36, 1); will-change: transform; }
@media (prefers-reduced-motion: reduce) { .grid.grid-swipe-l, .grid.grid-swipe-r { animation: none; } }
.grid .card { width: auto; max-width: none; min-width: 0; margin: 0; box-sizing: border-box; }

.badge { position: absolute; top: 7px; left: 7px; padding: 2px 7px; border-radius: 6px; background: var(--badge-bg); border: 1px solid var(--badge-border); color: var(--accent-ink); font-size: 9.5px; font-weight: 800; letter-spacing: .02em; box-shadow: 0 2px 8px var(--badge-shadow); }
.card-title { margin-top: 8px; font-size: 14px; font-weight: 700; letter-spacing: -.2px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 详情 / 资源浮层 —— 满幅海报英雄区（参考 HBO/Emby）
   打开/关闭走苹果风格的弹性过渡：sheet 本身只负责整体淡入淡出 + 可见性开关
  （不能给 .sheet 自己加 transform，它内部 .ed-hero 是 position:fixed 贴合视口的背景层，
   一旦祖先元素有了 transform 就会变成新的包含块，.ed-hero 会跟着祖先一起动而不是贴着视口，
   动画过程中背景会明显错位跳动）；.ed-hero 自己也只淡入淡出（opacity），不能再给它加
   transform —— 它的子层 .ed-hero-blend 用了 backdrop-filter 模糊，只要“背景模糊层的祖先”
   在做 transform 动画，模糊层的合成边界每帧都要重新采样，很容易撑不住，表现为开合时闪几下
   白块、甚至整个过渡看着像被跳过、瞬间完成。真正需要放大回弹手感的，放到 .ed-hero-imgs
  （纯图片层，没有 backdrop-filter 后代）上就安全了；.ed-body 同理没有 fixed/模糊后代，
   可以放心加 transform。 */
.sheet { position: fixed; top: 0; right: 0; bottom: 0; left: 0; inset: 0; z-index: 60; background: transparent; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  visibility: hidden; opacity: 0; pointer-events: none;
  transition: opacity .22s ease, visibility 0s linear .3s; }
.sheet.active { visibility: visible; opacity: 1; pointer-events: auto; transition: opacity .26s ease; }
.sheet .ed-hero { opacity: 0; transition: opacity .3s ease; }
.sheet.active .ed-hero { opacity: 1; transition: opacity .34s ease; }
.sheet .ed-hero-imgs { transform: scale(1.05); transition: transform .3s ease; }
.sheet.active .ed-hero-imgs { transform: scale(1); transition: transform .5s cubic-bezier(.22, 1, .36, 1); }
.sheet .ed-body { transform: translateY(26px); transition: transform .26s ease; }
.sheet.active .ed-body { transform: translateY(0); transition: transform .48s cubic-bezier(.34, 1.56, .64, 1); }
body.detail-active .app { visibility: hidden; pointer-events: none; }
body.detail-active { background: var(--ed-bg, var(--sheet-bg)); transition: background-color 1.1s ease; }

.ed-hero { position: fixed; inset: 0; z-index: -2; overflow: hidden; background: var(--ed-bg, #070b1a); transform: translateZ(0); backface-visibility: hidden; }
.ed-hero-imgs { position: absolute; inset: 0; }
.ed-hero-imgs img { position: absolute; inset: -1px; width: calc(100% + 2px); height: calc(100% + 2px); object-fit: cover; object-position: center 18%;
  transform: scale(1.06) translateZ(0); backface-visibility: hidden; opacity: 0; transition: opacity 1.1s ease, filter .2s linear; }
.ed-hero-imgs img.active { opacity: 1; }
.ed-hero-imgs img.active.first-in { animation: heroIn 1.1s cubic-bezier(.2,.7,.2,1) forwards, heroBreathe 11s ease-in-out 1.1s infinite; }
.ed-hero-imgs img.active:not(.first-in) { animation: heroBreathe 11s ease-in-out infinite; }
@keyframes heroIn { from { transform: scale(1.14); opacity: 0; } to { transform: scale(1.06); opacity: 1; } }
@keyframes heroBreathe { 0%, 100% { transform: scale(1.06); } 50% { transform: scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .ed-hero-imgs img.active, .ed-hero-imgs img.active.first-in { animation: none; } }
.ed-hero.contain .ed-hero-imgs img { object-fit: contain; object-position: center top; }
/* 贴底那截跟首页轮播同一套思路：颜色不再写死 rgba(6,5,10,.85)，改用当前海报自动取色算出来的
   --ed-bg-rgb / --ed-bg，让详情页背景也跟着每张海报的主色走，不再是固定藏青色兜底。
   没算出颜色前用 6,5,10 / var(--sheet-bg) 兜底，跟改之前效果一致，不会有空档。
   之前这里用 radial-gradient（椭圆，中心在顶部）来同时兼顾顶部轻微压暗和底部融合，
   代价是椭圆形状离中心越远（也就是画面两侧靠下的角落）衰减越快，中间又相对"漏"得更久，
   肉眼看上去底部是一个"U 型"的糊/暗区，跟首页轮播那种不分左右、只看高度的"平行"糊
   完全是两套观感，而且这一层本身根本没用 backdrop-filter，只是纯色渐变压暗，压根没有模糊。
   这里拆成两层，跟首页 .hero-shade / .hero-blend 的结构一一对应：
   ed-hero-shade 只负责顶部一丝丝压暗（不模糊，纯黑到透明，跟首页 hero-shade 的顶部渐变同理），
   ed-hero-blend 负责底部——真正用 backdrop-filter 把背后的海报本身模糊掉，再叠一层从透明到
   实色的动态色渐变，且渐变方向是 to bottom（水平等高线，不分左右），这样详情页底部就和
   首页轮播的底部融合是同一种"平行模糊"，不再是圆形衰减出来的 U 型效果。 */
.ed-hero-shade { position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(to bottom, rgba(0,0,0,.32) 0%, rgba(0,0,0,.08) 18%, transparent 30%); }
/* 底部融合改成"渐变模糊"：单层 backdrop-filter 的模糊强度是均匀的，看着就是一整块糊。
   这里叠 3 层，每层模糊强度不同、且用 mask 限制在不同高度带——顶部只有最轻的一层生效，
   越往下越重的层依次叠加，于是模糊从上到下由轻到重平滑过渡（顶部几乎不糊、贴底最糊）。
   色彩渐变（把底部染成背景色、和下方页面连成一片）单独放在 .ed-hero-blend 自己身上。 */
.ed-hero-blend {
  position: absolute; left: -1px; right: -1px; bottom: -1px; height: 72%; z-index: 1; pointer-events: none;
  transform: translateZ(0); backface-visibility: hidden;
  background: linear-gradient(to bottom,
    rgba(var(--ed-bg-rgb, 6,5,10), 0) 0%,
    rgba(var(--ed-bg-rgb, 6,5,10), .18) 22%,
    rgba(var(--ed-bg-rgb, 6,5,10), .5) 40%,
    rgba(var(--ed-bg-rgb, 6,5,10), .84) 56%,
    rgba(var(--ed-bg-rgb, 6,5,10), 1) 70%,
    rgba(var(--ed-bg-rgb, 6,5,10), 1) 100%);
}
/* 三层模糊：轻(顶)、中、重(底)，各自 mask 到不同区间 */
.ed-hero-blend::before, .ed-hero-blend::after, .ed-blur-mid {
  content: ""; position: absolute; inset: 0; pointer-events: none; transform: translateZ(0); backface-visibility: hidden;
}
.ed-hero-blend::before {   /* 轻模糊，覆盖上半段，从顶部淡入 */
  -webkit-backdrop-filter: blur(8px) saturate(1.08); backdrop-filter: blur(8px) saturate(1.08);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.5) 20%, #000 45%, #000 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.5) 20%, #000 45%, #000 100%);
}
.ed-blur-mid {             /* 中模糊，覆盖中下段 */
  -webkit-backdrop-filter: blur(20px) saturate(1.1); backdrop-filter: blur(20px) saturate(1.1);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 32%, rgba(0,0,0,.6) 50%, #000 66%, #000 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, transparent 32%, rgba(0,0,0,.6) 50%, #000 66%, #000 100%);
}
.ed-hero-blend::after {    /* 重模糊，只在贴底那段 */
  -webkit-backdrop-filter: blur(44px) saturate(1.14); backdrop-filter: blur(44px) saturate(1.14);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 55%, rgba(0,0,0,.6) 72%, #000 85%);
  mask-image: linear-gradient(to bottom, transparent 0%, transparent 55%, rgba(0,0,0,.6) 72%, #000 85%);
}
.ed-hero-spacer { width: 100%; height: 62vh; min-height: 380px; }
@media (orientation: landscape) { .ed-hero-spacer { height: 75vh; min-height: 320px; } }
/* 横屏时屏幕更矮更宽，原来 72% 高度的模糊区域相对占比更大，容易糊到人脸。
   这里单独把横屏下的模糊层调矮一些、往下移，渐变/遮罩的比例是跟着这个高度百分比自动收缩的，
   所以只是模糊起始的位置下移了，不影响下面页面信息（spacer 高度没变，内容位置不动）。 */
@media (orientation: landscape) { .ed-hero-blend { height: 55%; } }

/* 搜索联想下拉 */

  background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--ink-dim); }

.pan-head { display: flex; align-items: center; align-self: stretch; margin: 14px 0 8px; }

.pan-list { align-self: stretch; min-height: 40px; }
.btn { padding: 11px 24px; border-radius: 11px; font-size: 14px; font-weight: 700; background: var(--panel-soft); border: 1px solid var(--line); color: var(--ink); text-align: center; }
.btn.primary { background: var(--grad); border-color: transparent; color: var(--accent-ink); box-shadow: 0 4px 16px var(--btn-shadow); }
.btn.danger { background: var(--bad, #ff5c66); border-color: transparent; color: #fff; }
.confirm-sheet { max-width: 320px; text-align: center; }

.confirm-text { color: var(--ink-dim); font-size: 14px; line-height: 1.6; margin: 8px 0 0; }
.btn:active { transform: scale(.985); }
.tv-mode .btn.focus, .tv-mode .btn:focus { transform: scale(1.05); }

.pan-head { display: flex; align-items: center; margin: 14px 0 8px; }
.pan-head .title { font-size: 15px; font-weight: 700; flex: 0 0 auto; }
.pan-head .sub { margin-left: 8px; font-size: 11px; color: var(--ink-faint); }
.pan-list { min-height: 60px; max-height: 480px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px 8px 8px; background: rgba(255,255,255,.02); }
.pan-list::-webkit-scrollbar { width: 4px; }
.pan-list::-webkit-scrollbar-track { background: transparent; }
.pan-list::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
.pan-item { display: flex; align-items: center; padding: 11px 12px; margin-bottom: 8px; background: rgba(var(--panel-rgb), .13); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }

.pan-dot.locked { background: var(--lock); } .pan-dot.uncertain, .pan-dot.unsupported { background: var(--gray); }
.pan-dot.checking { background: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:.45} 50%{opacity:.9} }
.pan-body { flex: 1 1 auto; min-width: 0; }
.pan-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pan-sub { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

.pan-sub .site-tag { display: inline-block; padding: 0 6px; margin-right: 6px; border-radius: 5px; border: 1px solid; font-size: 10px; font-weight: 800; line-height: 16px; vertical-align: 1px; }
.pan-sub .q-tag { display: inline-block; padding: 0 5px; margin-right: 4px; border-radius: 5px; border: 1px solid; font-size: 10px; line-height: 15px; vertical-align: 1px; font-weight: 700; }

/* 详情页骨架屏：概览 / 演员 / 网盘资源在数据到手前先铺占位条 + 流光动效，避免长时间空白或干等文案。
   三处都直接把骨架节点塞进真实容器里（#detailOverview / #edCast / #panList），容器本身没有独立文本节点，
   等真实内容用 textContent= 或 replaceChildren(...) 覆盖时，骨架节点自然被替换掉，不用额外维护显隐状态。 */
.detail-skel-bar { border-radius: 5px; background: rgba(255,255,255,.07);
  background-image: linear-gradient(100deg, rgba(255,255,255,.05) 30%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.05) 70%);
  background-size: 420px 100%; animation: skelShimmer 1.3s linear infinite; }
.ov-skel { display: flex; flex-direction: column; gap: 8px; padding: 2px 0 4px; }
.ov-skel .detail-skel-bar { height: 13px; }
.ov-skel .detail-skel-bar:nth-child(1) { width: 97%; }
.ov-skel .detail-skel-bar:nth-child(2) { width: 89%; }
.ov-skel .detail-skel-bar:nth-child(3) { width: 58%; }
.cast-skel { display: flex; gap: 14px; overflow: hidden; padding: 4px 18px; margin: 0 -18px; }
.cast-skel-item { flex: 0 0 auto; width: 54px; display: flex; flex-direction: column; align-items: center; gap: 7px; }
.cast-skel-item .detail-skel-bar.av { width: 52px; height: 52px; border-radius: 50%; }
.cast-skel-item .detail-skel-bar.nm { width: 40px; height: 9px; }
.pan-skel { display: flex; flex-direction: column; gap: 12px; padding: 14px 2px; }
.pan-skel-item { display: flex; align-items: center; gap: 11px; }
.pan-skel-item .detail-skel-bar.ic { width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto; }
.pan-skel-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.pan-skel-body .detail-skel-bar.t1 { width: 76%; height: 12px; }
.pan-skel-body .detail-skel-bar.t2 { width: 42%; height: 10px; }
/* 详情页大海报：图还没到手时（站内无海报 / TMDB 图集没回来）铺一块流光占位，不留纯黑/纯色空屏 */
.ed-hero-skel { position: absolute; inset: 0;
  background-image: linear-gradient(100deg, rgba(255,255,255,.03) 30%, rgba(255,255,255,.09) 50%, rgba(255,255,255,.03) 70%);
  background-size: 420px 100%; animation: skelShimmer 1.3s linear infinite; }
/* 「剧集」单集卡骨架：跟 .ep-tcard 同款尺寸（148px 宽 + 16:9 缩略图 + 两行标题），分季/翻季时先垫上 */
.ep-skel-rail { display: flex; gap: 12px; overflow: hidden; padding: 4px 18px 6px; margin: 0 -18px; }
.ep-skel-card { flex: 0 0 auto; width: 176px; }
.ep-skel-card .detail-skel-bar.thumb { width: 176px; aspect-ratio: 16/9; border-radius: 10px; }
.ep-skel-card .detail-skel-bar.line1 { width: 92%; height: 11px; margin-top: 8px; }
.ep-skel-card .detail-skel-bar.line2 { width: 58%; height: 11px; margin-top: 6px; }
.pan-item.pan-hit { animation: panHitFlash 1.6s ease; }
@keyframes panHitFlash {
  0% { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent) inset; }
  70% { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent) inset; }
  100% { background: rgba(var(--panel-rgb), .13); box-shadow: none; }
}

/* 集数网格（日历式格子）：枫叶这类"第N集"线路用它，方便快速点选 */
.ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; padding: 2px; }
.ep-cell { position: relative; display: flex; align-items: center; justify-content: center; min-height: 46px; padding: 8px 6px; border-radius: 10px; background: rgba(var(--panel-rgb), .16); border: 1px solid var(--line); color: var(--ink); font-size: 14px; font-weight: 600; text-align: center; line-height: 1.15; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .06s ease; }
.ep-cell:active { transform: scale(.94); }
.ep-cell.playing { background: var(--grad); color: var(--accent-ink); border-color: transparent; }
.ep-cell.resolving { color: var(--accent); border-color: var(--accent); }
.ep-cell.bad { opacity: .45; }
.ep-cell .ep-dot { position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.ep-cell .ep-dot.ok { background: var(--ok); } .ep-cell .ep-dot.bad { background: var(--bad); } .ep-cell .ep-dot.checking { background: var(--accent); animation: pulse 1s infinite; }
.tv-mode .ep-cell.focus, .tv-mode .ep-cell:focus { transform: scale(1.08); }

/* 详情页「剧集」区：TMDB 分季 + 单集卡（类似 Emby），放在简介和演职人员之间 */
.ed-episodes { align-self: stretch; margin-top: 4px; }
.ed-episodes:empty { display: none; }
.ed-episodes-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0 9px; }
.ed-episodes-head .ed-works-head { margin: 0; flex: 0 0 auto; font-size: 15px; color: var(--ink); }
.ep-season-tabs { display: flex; flex: 1 1 auto; min-width: 0; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; justify-content: flex-start; }
.ep-season-tabs::-webkit-scrollbar { display: none; }
.ep-season-chip { flex: 0 0 auto; white-space: nowrap; padding: 5px 13px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--ink-dim); }
.ep-season-chip.active { background: var(--grad); color: var(--accent-ink); border-color: transparent; }
.tv-mode .ep-season-chip.focus, .tv-mode .ep-season-chip:focus { transform: scale(1.08); }
.ep-rail { display: flex; align-items: flex-start; gap: 12px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 4px 18px 6px; margin: 0 -18px; }
.ep-rail::-webkit-scrollbar { display: none; }
.ep-tcard { flex: 0 0 auto; width: 176px; white-space: normal; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ep-tcard:active { transform: scale(.98); }
.ep-tcard-img { position: relative; width: 176px; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: var(--panel-soft); border: 1px solid var(--line); }
.no-aspect-ratio .ep-tcard-img { height: 83px; }
.ep-tcard-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ep-tcard-num { position: absolute; left: 6px; bottom: 6px; padding: 1px 7px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 10.5px; font-weight: 700; }
.ep-tcard-title { margin-top: 6px; font-size: 12px; line-height: 1.35; color: var(--ink-dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tv-mode .ep-tcard.focus .ep-tcard-img, .tv-mode .ep-tcard:focus .ep-tcard-img { transform: scale(1.06); }
.ep-loading { padding: 14px 4px; color: var(--ink-faint); font-size: 13px; white-space: normal; }

/* 设置 —— 居中独立弹出卡片 */
/* 弹窗打开/关闭改成苹果风格的弹性缩放：遮罩只做淡入淡出，.panel-sheet 本身带一点
   过冲的回弹（cubic-bezier 峰值超过 1 再回落），比原来的 display none/flex 硬切换更跟手。 */
.panel-overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 24px calc(16px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left)); background: rgba(8,11,15,.6);
  visibility: hidden; opacity: 0; pointer-events: none;
  transition: opacity .2s ease, visibility 0s linear .26s; }
.panel-overlay.active { visibility: visible; opacity: 1; pointer-events: auto; transition: opacity .22s ease; }
.panel-sheet { position: relative; width: 100%; max-width: 460px; max-height: 100%; background: var(--panel-strong); border: 1px solid var(--line); border-radius: 18px; overflow-y: auto; padding: 18px 16px calc(var(--safe-bottom) + 14px); box-shadow: 0 24px 64px rgba(0,0,0,.5);
  transform: translateY(18px) scale(.94); transition: transform .24s ease; }
.panel-overlay.active .panel-sheet { transform: translateY(0) scale(1); transition: transform .46s cubic-bezier(.34, 1.56, .64, 1); }
.panel-close { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: var(--ink-dim); font-size: 16px; line-height: 1; background: rgba(255,255,255,.06); }
.panel-close:active { transform: scale(.88); }
.tv-mode .panel-close.focus, .tv-mode .panel-close:focus { transform: scale(1.15); }
.set-hd { display: flex; align-items: center; margin-bottom: 12px; padding-right: 30px; }
.set-hd h3 { margin: 0; font-size: 17px; color: var(--ink); }
.set-group { background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 13px; padding: 12px 12px 4px; margin-bottom: 10px; }
.set-group-title { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; }
.set-2col { display: flex; margin: 0 -5px; }
.set-2col .field { flex: 1 1 0; min-width: 0; margin: 0 5px 10px; }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12px; color: var(--ink-dim); margin-bottom: 5px; }
.field label .hint { color: var(--ink-faint); font-size: 10.5px; font-weight: 400; }
.field input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 9px; background: rgba(0,0,0,.28); border: 1px solid var(--line); outline: none; color: var(--ink); font-size: 13px; }
.field input:focus, .field input.focus { border-color: var(--accent); }
.pan-type-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.pan-type-chip { flex: 0 0 auto; padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--ink-faint); }
.pan-type-chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--ink); }
.tv-mode .pan-type-chip.focus, .tv-mode .pan-type-chip:focus { transform: scale(1.08); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 8px; }
.toggle-row .lbl { font-size: 13.5px; }
.toggle-row .lbl small { display: block; font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
.login-row { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; }
.btn.small { flex: 0 0 auto; padding: 8px 16px; font-size: 13px; border-radius: 9px; }
.login-state { font-size: 11.5px; color: var(--ink-faint); min-width: 0; }
.login-state.ok { color: var(--ok); }
.login-state.bad { color: var(--bad); }
.login-state.busy { color: var(--accent); }
.switch { width: 46px; height: 26px; border-radius: 999px; background: rgba(255,255,255,.16); position: relative; flex: 0 0 auto; }
.switch.on { background: var(--grad); }
/* 动态流光：主色渐变缓慢流动（约 8s 一轮，蓝调） */
@keyframes gradFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.ed-play, .ed-qtab.active, .btn.primary, .switch.on {
  background-size: 220% 220%;
  animation: gradFlow 8s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  .ed-play, .ed-qtab.active, .btn.primary, .switch.on { animation: none; }
}
.switch .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch.on .knob { left: 23px; }
.panel-actions { display: flex; justify-content: center; margin-top: 16px; }
.panel-actions .btn { min-width: 116px; }
.panel-actions .btn + .btn { margin-left: 12px; }
/* ===== 设置页改为「正常页面」而非弹窗：铺满整个视口、顶部对齐、不带半透明遮罩，
   跟 .sheet（详情页）观感一致，而不是浮在中间的对话框卡片。confirmOverlay 仍保留
   原来居中弹窗的样式，这里只单独覆盖 #settingsOverlay。 ===== */
#settingsOverlay { padding: 0; align-items: stretch; justify-content: stretch; background: var(--sheet-bg); }
/* 设置页是"整页"而不是居中卡片，弹入方式跟 .panel-sheet 默认的缩放不一样：
   改成从底部带过冲地滑上来，跟详情页 sheet 的滑入手感统一。 */
#settingsOverlay .panel-sheet { width: 100%; max-width: none; height: 100%; max-height: none; border-radius: 0; border: none; box-shadow: none; background: var(--panel-strong); padding: calc(var(--safe-top) + 18px) calc(16px + var(--safe-right)) calc(var(--safe-bottom) + 18px) calc(16px + var(--safe-left));
  transform: translateY(5%); }
#settingsOverlay.active .panel-sheet { transform: translateY(0); transition: transform .48s cubic-bezier(.34, 1.56, .64, 1); }
#settingsOverlay .panel-close { top: calc(var(--safe-top) + 14px); right: calc(var(--safe-right) + 14px); }
.set-status { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; padding: 10px 0; }
.status-line { font-size: 11.5px; color: var(--ink-faint); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-line b { color: var(--ink-dim); font-weight: 600; }
.status-line .on { color: var(--ok); } .status-line .off { color: var(--bad); }
.divider { height: 1px; background: var(--line); margin: 16px 0; }

.toast { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 22px); transform: translateX(-50%); z-index: 90; max-width: 84%; padding: 10px 16px; border-radius: 999px; background: var(--panel-strong); border: 1px solid var(--line-strong); color: var(--ink); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.top { top: calc(var(--safe-top) + 12px); bottom: auto; }
.toast.show { opacity: 1; }

/* 下拉刷新 */
.ptr { position: fixed; left: 0; right: 0; top: 0; z-index: 25; height: 54px; display: flex; align-items: center; justify-content: center;
  margin-top: var(--safe-top); color: var(--ink-dim); font-size: 13px; opacity: 0; pointer-events: none;
  transform: translateY(-10px); transition: opacity .15s; }
.ptr .ptr-ico { display: inline-block; margin-right: 8px; transition: transform .2s; }
.ptr.ready .ptr-ico { transform: rotate(180deg); }
.ptr.spin .ptr-ico { animation: ptrspin .8s linear infinite; }
@keyframes ptrspin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

/* 自适应 */
@media (min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); } }
@media (min-width: 1180px) { .grid { grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); } }
.tv-mode .grid .card { width: calc(16.666% - var(--card-gut)); max-width: calc(16.666% - var(--card-gut)); }
@media (min-width: 1600px) { .tv-mode .grid .card { width: calc(12.5% - var(--card-gut)); max-width: calc(12.5% - var(--card-gut)); } }
.tv-mode .rail .card { width: 150px; }
.tv-mode body, .tv-mode .app { font-size: 17px; }
.tv-mode .card-title { font-size: 15px; }
.tv-mode .section { padding: 20px 40px 0; }
.tv-mode .header-row, .tv-mode .chips { padding-left: 40px; padding-right: 40px; }
@supports (height: 100dvh) { .app { min-height: 100dvh; min-height: var(--fm-web-height, 100dvh); } }

/* ===== 主页整页骨架屏（首次加载遮罩，中央显示"宝宝巴士"）===== */
@keyframes skelShimmer { 0% { background-position: -420px 0; } 100% { background-position: 420px 0; } }
@keyframes skelFade { to { opacity: 0; visibility: hidden; } }
.home-skeleton { position: absolute; inset: 0; z-index: 30; background: var(--dyn-bg, #0c0b12); padding: 0 var(--gut); overflow: hidden; }
.home-skeleton.hiding { animation: skelFade .45s ease forwards; pointer-events: none; }
.home-skeleton .sk-hero { width: 100%; height: 46vh; min-height: 260px; max-height: 460px; border-radius: 16px; margin: 8px 0 22px; }
.home-skeleton .sk-rowtitle { width: 120px; height: 18px; border-radius: 6px; margin: 18px 0 12px; }
.home-skeleton .sk-cards { display: flex; gap: var(--card-gut, 10px); }
.home-skeleton .sk-card { flex: 0 0 auto; width: 30vw; max-width: 128px; }
.home-skeleton .sk-poster { width: 100%; aspect-ratio: 2/3; border-radius: 12px; }
.home-skeleton .sk-line { height: 12px; border-radius: 5px; margin-top: 8px; }
.home-skeleton .sk-line.w70 { width: 70%; } .home-skeleton .sk-line.w45 { width: 45%; }
.home-skeleton .sk-shimmer { background: linear-gradient(100deg, rgba(255,255,255,.05) 30%, rgba(255,255,255,.12) 50%, rgba(255,255,255,.05) 70%); background-size: 840px 100%; animation: skelShimmer 1.3s linear infinite; }
.home-skeleton .sk-brand { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.home-skeleton .sk-brand-text { font-size: 30px; font-weight: 900; letter-spacing: 4px; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; background-size: 220% 220%; animation: gradFlow 5s ease-in-out infinite; text-shadow: 0 2px 20px rgba(0,0,0,.3); }
.home-skeleton .sk-brand-sub { margin-top: 10px; font-size: 12px; color: var(--ink-faint); letter-spacing: 2px; }
.home-skeleton .sk-brand-dots { margin-top: 14px; display: flex; gap: 6px; }
.home-skeleton .sk-brand-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent, #6ea8fe); opacity: .35; animation: skelDotPulse 1.1s ease-in-out infinite; }
.home-skeleton .sk-brand-dots span:nth-child(2) { animation-delay: .18s; } .home-skeleton .sk-brand-dots span:nth-child(3) { animation-delay: .36s; }
@keyframes skelDotPulse { 0%,100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
/* ===== 轮播图骨架屏 ===== */
.hero-skeleton { position: relative; width: 100%; height: 58vh; min-height: 340px; max-height: 560px;
  background: linear-gradient(135deg, rgba(46,166,255,.04) 0%, rgba(22,32,66,.55) 60%, rgba(7,11,26,.7) 100%);
  overflow: hidden; margin: 0 0 6px; }
@media (orientation: landscape) { .hero-skeleton { height: 85vh; min-height: 280px; } }
.hero-skeleton::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.07) 50%, transparent 100%);
  -webkit-animation: heroSkelShimmer 1.8s ease-in-out infinite;
  animation: heroSkelShimmer 1.8s ease-in-out infinite; }
@-webkit-keyframes heroSkelShimmer { 0%{-webkit-transform:translateX(-100%);transform:translateX(-100%)} 100%{-webkit-transform:translateX(100%);transform:translateX(100%)} }
@keyframes heroSkelShimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
.hero-skel-body { position: absolute; bottom: 40px; left: 0; right: 0;
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
  -webkit-align-items: center; align-items: center; gap: 10px; padding: 0 20px; z-index: 1; }
.hero-skel-title { width: 52%; height: 26px; border-radius: 7px; background: rgba(255,255,255,.09); }
.hero-skel-meta { width: 36%; height: 12px; border-radius: 5px; background: rgba(255,255,255,.06); }
.hero-skel-dots { position: absolute; bottom: 13px; left: 0; right: 0; z-index: 1;
  display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center; gap: 6px; }
.hero-skel-d { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.18); }
.hero-skel-d.a { width: 16px; background: rgba(255,255,255,.35); border-radius: 3px; }
</style>

<body>

          <span class="csb-kw" id="searchBarKw"></span>
          <button id="clearSearch" class="clear-search focusable" type="button" aria-label="清空搜索词" style="display:none">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="genre-chips" id="genreChips"></div>
        <span class="section-sub" id="browseSub"></span>
        <button id="clearRecent" class="icon-btn recent-clear-btn focusable" type="button" aria-label="清空全部记录" style="display:none">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>

</div>

<div class="panel-overlay" id="settingsOverlay" aria-hidden="true">

    <button id="cfgCloseX" class="panel-close focusable" type="button" aria-label="关闭">&#10005;</button>

      </div>
      <div class="field">

      <div class="field">

      </div>
      <div class="field">
        <label>蜗牛站点 <span class="hint">网盘资源站（115/夸克等）</span></label>
        <input id="cfgWn" class="focusable" type="text" placeholder="https://zmi.kdns.fr">
      </div>

        <input id="cfgSh" class="focusable" type="text" placeholder="https://sidhub.cc">
      </div>
      <div class="field">
        <label>玩偶站点 <span class="hint">网盘资源站</span></label>
        <input id="cfgWo" class="focusable" type="text" placeholder="https://wogg.xxooo.cf">
      </div>
      <div class="field">
        <label>木偶站点 <span class="hint">网盘资源站</span></label>
        <input id="cfgMo" class="focusable" type="text" placeholder="https://666.666291.xyz">
      </div>
      <div class="field">
        <label>pomo 站点 <span class="hint">网盘资源站</span></label>
        <input id="cfgPm" class="focusable" type="text" placeholder="https://pomo.mom">
      </div>
    </div>

    <div class="set-group">
      <div class="set-group-title">网盘类别</div>
      <div class="field">
        <label>选择要显示的网盘类别 <span class="hint">默认全部显示；取消的类别不会出现在网盘资源里（某类别最终没有资源时也会自动隐藏）</span></label>
        <div class="pan-type-wrap" id="cfgPanTypes"></div>

    </div>

    <div class="set-group">
      <div class="set-group-title">详情页</div>
      <div class="toggle-row">
        <div class="lbl">剧集单集列表<small>剧/综艺/动漫详情页里的分季单集卡片；关闭后不显示该区块，只保留网盘资源</small></div>
        <button id="cfgShowEpisodes" type="button" class="switch focusable" role="switch" aria-checked="true"><span class="knob"></span></button>
      </div>
    </div>

    <div class="set-group set-status">
      <div id="statusBlock"></div>
    </div>

    <div class="panel-actions">
      <button id="cfgSave" class="btn primary focusable" type="button">保存</button>

    </div>

</div>

<div class="panel-overlay" id="confirmOverlay" aria-hidden="true">

      <button id="confirmOk" class="btn danger focusable" type="button">确定</button>
      <button id="confirmCancel" class="btn focusable" type="button">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   业务代码：语法基线 ES2017（async/await 及以下）。
   不使用 ?. / ?? / 逻辑赋值 / .replaceAll / Promise.allSettled /
   可选 catch 绑定 / 私有字段（语法错误无法 try/catch，一处即白屏）。
   ============================================================ */
var $ = function (id) { return document.getElementById(id); };
var root = document.documentElement;

var DEFAULT_BASE = "https://pinglian.lol";
var BROWSER_UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36 Edg/149.0.0.0";
/* 内置登录态（Cookie）。session_token 为长期令牌，PHPSESSID 可能轮换，服务器会通过 Set-Cookie 刷新 */
var AUTH_COOKIE = ""; /* 不再内置真实登录态，请在“设置”页填入你自己的 Cookie（含 session_token/PHPSESSID） */

/* 盘链分类：t=1电影 2剧集 3综艺 4动漫；空=全部 */
var CAT_ICONS = {
  "1": '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16M16 4v16"/>',
  "2": '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
  "3": '<path d="M12 3l2.3 5.3L20 9l-4 3.6L17 19l-5-3-5 3 1-6.4L4 9l5.7-.7z"/>',
  "4": '<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8.5 15a4 4 0 007 0"/>',
  "__recent__": '<path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l3 3"/>'
};
var CATEGORIES = [
  { slug: "1", name: "电影" },
  { slug: "2", name: "剧集" },
  { slug: "3", name: "综艺" },
  { slug: "4", name: "动漫" },
  { slug: "__recent__", name: "历史" }
];

/* 网盘 host -> type（用于 fm.pan.play / fm.pan.check） */
var HOSTMAP = [
  [/pan\.quark\.cn/, "quark"],
  [/drive\.uc\.cn|fast\.uc\.cn/, "uc"],
  [/alipan\.com|aliyundrive\.com/, "aliyun"],
  [/pan\.baidu\.com|yun\.baidu\.com/, "baidu"],
  [/cloud\.189\.cn/, "tianyi"],
  [/pan\.xunlei\.com/, "xunlei"],
  [/115\.com|115cdn\.com|anxia\.com/, "115"],
  [/123[0-9a-z]*\.com|123pan\.cn/, "123"],
  [/caiyun\.139\.com|yun\.139\.com|caiyun\.feixin\.10086\.cn/, "mobile"]
];
var CHECKABLE = ["quark", "aliyun", "baidu", "uc", "tianyi", "xunlei", "123", "115", "mobile"];
/* 盘链网盘类型 -> 显示名 + fm.pan.play 的 type */
var PAN_META = {
  quark:   { label: "夸克",  play: "quark" },
  baidu:   { label: "百度",  play: "baidu" },
  xunlei:  { label: "迅雷",  play: "xunlei" },
  uc:      { label: "UC",    play: "uc" },
  aliyun:  { label: "阿里",  play: "aliyun" },
  "123":   { label: "123",   play: "123" },
  "115":   { label: "115",   play: "115" },
  tianyi:  { label: "天翼",  play: "tianyi" },
  mobile:  { label: "移动云", play: "mobile" },
  guangya: { label: "光鸭盘", play: "http" }, // 新出的小众网盘：不在 App 检测支持表内(不检测)；可走 fm.pan.play(type=http) 尝试播放，盘搜也常返回它
  pikpak:  { label: "PikPak", play: "pikpak" },
  magnet:  { label: "磁力",  play: "magnet" },
  fy:      { label: "枫叶",  play: "" },   // 在线点播（m3u8 直链），不走网盘解析，播放走 fyPlayDirect

};
var TYPE_LABEL = { quark: "夸克", uc: "UC", aliyun: "阿里", baidu: "百度", tianyi: "天翼", xunlei: "迅雷", "115": "115", "123": "123", mobile: "移动云", magnet: "磁力", http: "网页" };
/* 网盘 tab 固定顺序：显式写死，不依赖 PAN_META 对象的声明顺序。

/* 指南列表页/合集页 -> [{id,title,poster,meta}] */
function zn4kParseList(html) {

/* 指南详情页 -> { title, poster, overview, resources:[{url,label,quality,type}] } */

/* 指南解析出的资源 -> 盘链网盘条目（只保留 App 能处理的网盘类型 + 磁力） */

/* 把一批指南资源合并进当前详情页网盘列表（去重 + 重建 tab） */
function zn4kMerge(pans, token) {

/* 指南站搜索：/?post_type=book&s=关键词 -> 列表 */

/* 从指南搜索结果里挑与本片最匹配的一条（标题相关度优先，年份加权） */
function zn4kPickBest(list, rawTitle, year) {
  var key = cleanTitle(rawTitle);
  var best = null, bestScore = 99;
  (list || []).forEach(function (it) {
    var ts = titleScore(it.title, key);
    if (ts > 3) return;                     // 完全不含关键词的丢掉
    var s = ts;
    if (year && ((it.title || "").indexOf(year) >= 0 || (it.meta || "").indexOf(year) >= 0)) s -= 0.3;
    if (s < bestScore) { bestScore = s; best = it; }
  });
  return best;
}
/* 详情页（盘链原生条目）：按标题去指南搜同名，把站内网盘资源并进来 */

    return zn4kHttpText(zn4kBase() + "/book/" + best.id + ".html").then(function (html) {

    });

/* 指南来源条目：顺便按标题反查盘链本站，命中就升级成原生条目（走完整资源+反向补指南） */

/* 抓指南列表页某一页 -> 成员数组（带 _zn4k 标记，点开走指南详情逻辑） */
function zn4kFetchPage(slug, page) {

/* 封面懒加载：用该合集/榜单第一页里首个有海报的成员当封面；第一页结果缓存，点进去时秒开 */
function zn4kCollectionCover(slug, posterEl, phEl) {
  function setCover(members) {
    var first = (members || []).filter(function (m) { return m.poster; })[0];
    if (!first || !posterEl) return;
    var img = document.createElement("img");
    img.alt = ""; img.loading = "lazy"; img.setAttribute("decoding", "async");

  }
  var cached = state.zn4kColCache[slug];
  if (cached && cached.length) { setCover(cached); return null; }
  return zn4kFetchPage(slug, 1).then(function (members) {
    state.zn4kColCache[slug] = members;
    saveHomeDisk();
    setCover(members);
