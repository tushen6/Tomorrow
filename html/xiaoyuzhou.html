<!DOCTYPE html>
<html lang="zh-CN" data-theme="xyz" data-mode="light" data-bg="solid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>小宇宙</title>
<style>
/* =========================================================================
   设计变量：整套沿用喜马拉雅版（同样的圆角 / 缓动 / 玻璃层 / 安全区处理），
   只把主色从橘红换成小宇宙那种偏冷的星际紫，底色也跟着往蓝紫偏一点。
   ---------------------------------------------------------------------
   兼容底线还是 minSdk 24 = Chromium 51：
   - env() 要 69+，所以 --safe-* 先给 0px，再在 @supports 里覆盖；
   - backdrop-filter 同样靠 @supports 兜，检测不到就用实色；
   - 不用 :is() / :where() / aspect-ratio / gap 在旧 flex 上的坑位。
   ========================================================================= */
:root{
  --bg-0:#08070e;
  --bg-1:#0d0b16;
  --bg-2:#15121f;
  --bg-elevated:#1d1929;
  --glass:rgba(255,255,255,0.07);
  --glass-strong:rgba(24,20,34,0.74);
  --glass-border:rgba(255,255,255,0.12);
  --line:rgba(255,255,255,0.11);

  --accent:#7b61ff;
  --accent-dim:#5f47e0;
  --accent-glow:rgba(123,97,255,0.32);
  --accent-rgb:123,97,255;
  --gold:#ffb020;
  --cyan:#39d0d8;
  --pick:#ff5f9e;

  --text-0:#ffffff;
  --text-1:rgba(236,234,245,0.72);
  --text-2:rgba(236,234,245,0.42);
  --danger:#ff453a;
  --ok:#31c27c;

  --radius-s:12px;
  --radius-m:14px;
  --radius-l:20px;
  --radius-xl:26px;

  --blur-1:20px;
  --blur-2:40px;
  --blur-3:60px;

  --ease:cubic-bezier(0.25,0.1,0.25,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --ease-smooth:cubic-bezier(0.22,1,0.36,1);
  --ease-out:cubic-bezier(0.16,1,0.3,1);

  --font-display:-apple-system,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;
  --font-body:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --font-num:"SF Pro Rounded","SF Pro Text",-apple-system,var(--font-body);
  --font-mono:ui-monospace,"SF Mono","Menlo","Consolas",monospace;

  /* 宿主变量这一级不能省：Chromium < 69 不认 env()，整条声明会被丢掉，
     顶栏会顶进状态栏。--safe-t-eff 是脚本按 chromeMode 算出来的最高优先级覆盖。 */
  --safe-t:var(--safe-t-eff, var(--fm-safe-top, 0px));
  --safe-b:var(--fm-safe-bottom, 0px);
  --head-h:52px;
  --tab-h:54px;
  --mini-h:60px;
}
@supports (padding: env(safe-area-inset-top)){
  :root{ --safe-t:var(--safe-t-eff, env(safe-area-inset-top,0px));
         --safe-b:env(safe-area-inset-bottom,0px); }
}
/* 两个来源都在时取大的那个，千万不能相加 —— 宿主已经把状态栏
   高度算进 --fm-safe-top 了。max() 比 env() 晚一截才有，单独 @supports。 */
@supports (top: max(0px,1px)){
  :root{ --safe-t:var(--safe-t-eff, max(var(--fm-safe-top,0px), env(safe-area-inset-top,0px)));
         --safe-b:max(var(--fm-safe-bottom,0px), env(safe-area-inset-bottom,0px)); }
}

html[data-theme="nebula"]{ --accent:#ff5f9e; --accent-dim:#e0407f; --accent-glow:rgba(255,95,158,.30); --accent-rgb:255,95,158; }
html[data-theme="aurora"]{ --accent:#22c1a4; --accent-dim:#17a38a; --accent-glow:rgba(34,193,164,.30); --accent-rgb:34,193,164; }
html[data-theme="sunset"]{ --accent:#ff8f3f; --accent-dim:#e2762a; --accent-glow:rgba(255,143,63,.30); --accent-rgb:255,143,63; }
html[data-theme="deep"]  { --accent:#3a8bff; --accent-dim:#2b6ed6; --accent-glow:rgba(58,139,255,.30); --accent-rgb:58,139,255; }

html[data-mode="dark"]{
  --bg-0:#000;--bg-1:#000;--bg-2:#0f0f12;--bg-elevated:#18181d;
  --glass:rgba(255,255,255,0.06);--glass-strong:rgba(22,22,26,0.88);
  --glass-border:rgba(255,255,255,0.10);--line:rgba(255,255,255,0.10);
}
html[data-mode="light"]{
  --bg-0:#f5f4fa;--bg-1:#faf9fe;--bg-2:#ffffff;--bg-elevated:#ffffff;
  --glass:rgba(0,0,0,0.045);--glass-strong:rgba(255,255,255,0.82);
  --glass-border:rgba(0,0,0,0.08);--line:rgba(0,0,0,0.09);
  --text-0:#161425;--text-1:rgba(22,20,37,0.66);--text-2:rgba(22,20,37,0.40);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; margin:0; padding:0; }
html{ background:var(--bg-0); }
body{
  font-family:var(--font-body);
  color:var(--text-0);
  background:var(--bg-0);
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.45;
}
/* 宿主里页面是叠在壁纸上的。透出壁纸好看，但壁纸一花正文就糊，所以做成
   可选：wall=透出去，solid=铺满不透明底。默认 solid，先保证读得清。 */
html.fm-native[data-bg="wall"], html.fm-native[data-bg="wall"] body{ background:transparent; }
html.fm-native[data-bg="wall"] #ambient{ opacity:.55; }
html.fm-native[data-bg="solid"], html.fm-native[data-bg="solid"] body{ background:var(--bg-0); }
html.fm-native[data-bg="solid"] #ambient{ opacity:1; }

button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; padding:0; cursor:pointer; }
a{ color:inherit; text-decoration:none; }
img{ display:block; max-width:100%; }
ul,li{ list-style:none; margin:0; padding:0; }
svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
svg.fill{ fill:currentColor; stroke:none; }

::-webkit-scrollbar{ width:0; height:0; }

/* ---------- 背景氛围 ---------- */
#ambient{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(120% 80% at 14% 0%, rgba(var(--accent-rgb),.32) 0%, transparent 58%),
    radial-gradient(100% 70% at 90% 6%, rgba(57,208,216,.14) 0%, transparent 55%),
    radial-gradient(140% 90% at 50% 108%, rgba(var(--accent-rgb),.16) 0%, transparent 60%),
    var(--bg-0);
  transition:background 1.1s var(--ease-smooth), opacity .5s var(--ease);
}
/* 浅色皮肤下氛围光要收得更狠，否则整页发紫，正文对比度掉一截 */
html[data-mode="light"] #ambient{
  background:
    radial-gradient(120% 80% at 14% 0%, rgba(var(--accent-rgb),.11) 0%, transparent 56%),
    radial-gradient(100% 70% at 90% 6%, rgba(57,208,216,.06) 0%, transparent 52%),
    var(--bg-0);
}
/* 页面、列表和详情统一使用上面的固定氛围底；封面只作为内容图片展示，
   不再扩散成整页颜色，切换列表时背景就不会跟着跳变。 */
#ambientArt{ display:none; }
#grain{
  position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.28; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='120'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='120' height='120' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
}
html[data-mode="light"] #grain{ opacity:.12; }

/* ---------- 顶栏 ---------- */
/* scrolltop: topbar lives inside the active .view, scrolls away */
#topbar{
  position:relative; z-index:3; flex:none;
  padding:calc(var(--safe-t) + 8px) 14px 8px;
  background:linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.16) 62%, transparent 100%);
  transition:background .4s var(--ease), opacity .3s var(--ease), transform .34s var(--ease-out);
}
html[data-mode="light"] #topbar{
  background:linear-gradient(180deg, rgba(255,255,255,.80) 0%, rgba(255,255,255,.42) 62%, transparent 100%);
}
#topbar.solid{ background:var(--glass-strong); border-bottom:1px solid var(--line); }
@supports ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  #topbar.solid{ -webkit-backdrop-filter:saturate(180%) blur(var(--blur-2)); backdrop-filter:saturate(180%) blur(var(--blur-2)); }
}
#topbar.hide{ transform:translate3d(0,-118%,0); opacity:0; }
.tb-row{ display:flex; align-items:center; height:38px; }
.brand{ display:flex; align-items:center; gap:9px; min-width:0; flex:1; }
.brand .logo{
  width:30px; height:30px; border-radius:10px; flex:none;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(145deg, var(--accent), var(--accent-dim));
  box-shadow:0 5px 16px var(--accent-glow);
  animation:logoIn .7s var(--ease-spring) both;
}
.brand .logo svg{ width:17px; height:17px; color:#fff; }
@keyframes logoIn{ from{ transform:scale(.4) rotate(-22deg); opacity:0 } to{ transform:none; opacity:1 } }
.brand b{ font-family:var(--font-display); font-size:17.5px; font-weight:700; letter-spacing:.4px; white-space:nowrap; }
.brand .sub{ font-size:10.5px; color:var(--text-2); margin-left:2px; letter-spacing:.6px; }
.tb-actions{ display:flex; align-items:center; gap:4px; flex:none; }
.icon-btn{
  width:36px; height:36px; border-radius:12px; flex:none;
  display:flex; align-items:center; justify-content:center;
  color:var(--text-1); transition:background .2s var(--ease), color .2s, transform .2s var(--ease-spring);
}
.icon-btn:active{ transform:scale(.9); background:var(--glass); color:var(--text-0); }
.icon-btn.on{ color:var(--accent); }
/* 登录态小圆点：贴在钥匙图标右上角 */
.icon-btn .pip{ position:absolute; margin:-16px 0 0 16px; width:6px; height:6px; border-radius:50%;
  background:var(--text-2); box-shadow:0 0 0 2px var(--bg-0); }
.icon-btn .pip.ok{ background:var(--ok); }
.icon-btn .pip.bad{ background:var(--danger); }

/* ---------- 视图容器 ---------- */
#views{ position:absolute; inset:0; z-index:5; }
.view{
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; scroll-behavior:smooth;
  padding:6px 0 calc(var(--safe-b) + var(--tab-h) + var(--mini-h) + 20px);
  opacity:0; visibility:hidden; pointer-events:none;
  transform:translate3d(0,10px,0);
  transition:opacity .3s var(--ease), transform .36s var(--ease-out), visibility .3s;
}
.view.on{ opacity:1; visibility:visible; pointer-events:auto; transform:none; }

/* ---------- 通用块 ---------- */
.sec{ margin:0 0 22px; }
.sec-head{ display:flex; align-items:flex-end; padding:0 16px 10px; gap:10px; }
.sec-title{ font-family:var(--font-display); font-size:18px; font-weight:700; letter-spacing:.3px; flex:1; min-width:0;
  display:flex; align-items:center; gap:8px; }
.sec-title i{ width:3px; height:15px; border-radius:2px; background:linear-gradient(180deg,var(--accent),var(--accent-dim)); flex:none; }
.sec-more{ font-size:12.5px; color:var(--text-2); display:flex; align-items:center; gap:2px; flex:none; padding:4px 0 4px 8px; }
.sec-more svg{ width:13px; height:13px; }
.sec-more:active{ color:var(--accent); }
.sec-note{ padding:0 16px 8px; font-size:11.5px; color:var(--text-2); line-height:1.6; }

/* 横滑行
   同样不开 scroll-snap：开了之后第一张卡的左边会被对齐到滚动口起点，
   等于把 padding-left 吃掉，卡片贴屏幕边缘、和标题对不齐。 */
.rail{
  display:flex; gap:12px; overflow-x:auto; overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  padding:2px 16px 4px; margin:0;
}
.rail::-webkit-scrollbar{ display:none; }
.rail > *{ flex:none; }
/* Safari/旧 WebKit 上 flex 容器的右内边距会被忽略，用伪元素补一格 */
.rail::after{ content:""; flex:none; width:4px; }

/* 播客卡（竖） */
.card{
  width:126px; display:block; text-align:left;
  animation:cardIn .48s var(--ease-out) both;
}
@keyframes cardIn{ from{ opacity:0; transform:translate3d(0,14px,0) scale(.97) } to{ opacity:1; transform:none } }
.card .art{
  position:relative; width:126px; height:126px; border-radius:var(--radius-m); overflow:hidden;
  background:linear-gradient(135deg, rgba(var(--accent-rgb),.22), rgba(255,255,255,.05));
  box-shadow:0 8px 22px rgba(0,0,0,.34);
  transition:transform .32s var(--ease-spring), box-shadow .32s var(--ease);
}
.card:active .art{ transform:scale(.945); box-shadow:0 4px 12px rgba(0,0,0,.4); }
.card .art img{ width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .45s var(--ease); }
.card .art img.ld{ opacity:1; }
.card .tt{ margin:8px 2px 2px; font-size:12.5px; font-weight:600; line-height:1.35; color:var(--text-0);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; height:34px; }
.card .st{ margin:0 2px; font-size:11px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card.wide{ width:150px; } .card.wide .art{ width:150px; height:150px; }

/* 角标 */
.tag{
  position:absolute; left:6px; top:6px; z-index:2;
  font-size:9.5px; font-weight:700; letter-spacing:.3px;
  padding:2.5px 6px; border-radius:7px; color:#fff;
  background:rgba(0,0,0,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.tag.pick{ background:linear-gradient(135deg,var(--pick),#c8306e); }
.tag.rank{ background:linear-gradient(135deg,var(--accent),var(--accent-dim)); font-family:var(--font-num); }
.plays{
  position:absolute; right:6px; bottom:6px; z-index:2;
  display:flex; align-items:center; gap:3px;
  font-size:10px; font-weight:600; color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.7);
}
.plays svg{ width:11px; height:11px; }
.art::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:44%; z-index:1;
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.55));
  opacity:.9; pointer-events:none;
}

/* 网格 */
.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px 12px; padding:2px 16px; }
.grid.g2{ grid-template-columns:repeat(2,1fr); }
.grid .card, .grid .card .art{ width:100%; }
.grid .card .art{ height:auto; padding-top:100%; }
.grid .card .art img{ position:absolute; inset:0; }

/* 横条 */
.row{
  display:flex; align-items:center; gap:12px; padding:9px 16px;
  animation:cardIn .42s var(--ease-out) both;
}
.row:active{ background:var(--glass); }
.row .art{ width:62px; height:62px; border-radius:11px; flex:none; position:relative; overflow:hidden;
  background:var(--glass); box-shadow:0 4px 12px rgba(0,0,0,.28); }
.row .art img{ width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .4s; }
.row .art img.ld{ opacity:1; }
.row .meta{ flex:1; min-width:0; }
.row .meta .t{ font-size:14px; font-weight:600; line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.row .meta .d{ margin-top:3px; font-size:11.5px; color:var(--text-2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .go{ flex:none; color:var(--text-2); }

/* 单集横条：小宇宙的主力信息单元，比专辑条多一行互动数 */
.ep{
  display:flex; gap:11px; padding:11px 16px; align-items:flex-start; position:relative;
  animation:cardIn .4s var(--ease-out) both;
}
.ep:active{ background:var(--glass); }
.ep + .ep::before{ content:""; position:absolute; left:89px; right:16px; top:0; height:1px; background:var(--line); }
.ep .art{ width:56px; height:56px; border-radius:12px; flex:none; position:relative; overflow:hidden;
  background:var(--glass); box-shadow:0 4px 12px rgba(0,0,0,.26); }
.ep .art img{ width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .4s; }
.ep .art img.ld{ opacity:1; }
.ep .art .pp{ position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.42); color:#fff; opacity:0; transition:opacity .25s; }
.ep .art .pp svg{ width:20px; height:20px; }
.ep:active .art .pp{ opacity:1; }
.ep .body{ flex:1; min-width:0; }
.ep .t{ font-size:14px; font-weight:600; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.ep .d{ margin-top:4px; font-size:11.5px; color:var(--text-2); line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.ep .m{ margin-top:5px; display:flex; align-items:center; gap:10px; font-size:11px; color:var(--text-2);
  font-family:var(--font-num); flex-wrap:wrap; }
.ep .m span{ display:flex; align-items:center; gap:3px; }
.ep .m svg{ width:11px; height:11px; }
.ep .m .pod{ color:var(--accent); font-family:var(--font-body); max-width:44%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ep.cur .t{ color:var(--accent); }
/* 听到一半的进度条 */
.ep .bar{ margin-top:6px; height:2px; border-radius:2px; background:var(--glass); overflow:hidden; }
.ep .bar i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--cyan)); border-radius:2px; }

/* 分类入口 / 快捷格子 */
.cat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px 6px; padding:6px 12px 4px; }
.cat-cell{ display:flex; flex-direction:column; align-items:center; gap:6px;
  animation:cardIn .45s var(--ease-out) both; }
.cat-cell .ic{
  width:46px; height:46px; border-radius:16px; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(145deg, rgba(var(--accent-rgb),.24), rgba(255,255,255,.07));
  box-shadow:0 5px 14px rgba(0,0,0,.24);
  transition:transform .28s var(--ease-spring);
  color:#fff;
}
.cat-cell:active .ic{ transform:scale(.9); }
.cat-cell .ic img{ width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .4s; }
.cat-cell .ic img.ld{ opacity:1; }
.cat-cell .ic svg{ width:20px; height:20px; }
/* 浅色皮肤下那块底太淡，白字会糊掉，换成主色字 */
html[data-mode="light"] .cat-cell .ic{
  background:linear-gradient(145deg, rgba(var(--accent-rgb),.18), rgba(var(--accent-rgb),.06));
  color:var(--accent-dim);
}
.cat-cell .nm{ font-size:11px; color:var(--text-1); text-align:center; line-height:1.2;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* 分类：两列横排。四列挤不下「喜剧脱口秀」这种四五个字的名字，
   两列还能顺带把节目数摆出来。 */
.cat-grid.cat-2{ grid-template-columns:repeat(2,1fr); gap:10px; padding:6px 16px 4px; }
.cat-2 .cat-cell{
  flex-direction:row; align-items:center; gap:11px; padding:10px 12px;
  border-radius:var(--radius-m); background:var(--glass);
  border:1px solid var(--glass-border);
  transition:transform .22s var(--ease-spring), background .22s, border-color .22s;
}
.cat-2 .cat-cell:active{ transform:scale(.96); background:var(--glass-strong); border-color:var(--accent); }
.cat-2 .cat-cell .ic{ width:38px; height:38px; border-radius:12px; flex:none; box-shadow:0 4px 11px rgba(0,0,0,.2); }
.cat-2 .cat-cell .ic svg{ width:19px; height:19px; }
.cat-2 .cat-cell .tx{ flex:1; min-width:0; }
.cat-2 .cat-cell .nm{ font-size:13px; font-weight:650; color:var(--text-0); text-align:left; }
.cat-2 .cat-cell .ct{ font-size:11px; color:var(--text-2); margin-top:2px; font-family:var(--font-num);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* chips */
.chips{ display:flex; gap:8px; overflow-x:auto; padding:6px 16px 10px; -webkit-overflow-scrolling:touch; }
.chips::-webkit-scrollbar{ display:none; }
.chip{

html.panel-open #mini{ bottom:calc(var(--safe-b) + 8px); }

@supports ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){

}
#mini.on{ transform:none; opacity:1; visibility:visible; }
#miniArt{ width:44px; height:44px; border-radius:11px; flex:none; overflow:hidden; position:relative;
  background:var(--glass); box-shadow:0 4px 12px rgba(0,0,0,.3); }
#miniArt img{ width:100%; height:100%; object-fit:cover; }
#miniArt .ring{ position:absolute; inset:-3px; border-radius:14px; border:1.5px solid rgba(var(--accent-rgb),.55);
  opacity:0; animation:ringPulse 2.4s ease-out infinite; }
html.paused #miniArt .ring{ animation-play-state:paused; opacity:0; }
@keyframes ringPulse{ 0%{ opacity:.7; transform:scale(.94) } 100%{ opacity:0; transform:scale(1.16) } }
#mini .txt{ flex:1; min-width:0; }
#mini .txt .a{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#mini .txt .b{ font-size:11px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
#mini .ctl{ display:flex; align-items:center; gap:2px; flex:none; }
#mini .ctl button{ width:36px; height:36px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  color:var(--text-0); transition:transform .2s var(--ease-spring), background .2s; }
#mini .ctl button:active{ transform:scale(.86); background:var(--glass); }
#mini .ctl button svg{ width:19px; height:19px; }
#miniProg{ position:absolute; left:0; bottom:0; height:2px; background:linear-gradient(90deg,var(--accent),var(--cyan));
  width:0; transition:width .25s linear; border-radius:0 2px 2px 0; }

/* ---------- 全屏播放页 ---------- */
#fullPlayer{
  position:fixed; inset:0; z-index:90; display:flex; flex-direction:column;
  background:var(--bg-0);
  transform:translate3d(0,100%,0); visibility:hidden;
  transition:transform .46s var(--ease-out), visibility .46s;
  will-change:transform;
}
#fullPlayer.on{ transform:none; visibility:visible; }
#fpBg{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(120% 80% at 14% 0%, rgba(var(--accent-rgb),.32) 0%, transparent 58%),
    radial-gradient(100% 70% at 90% 6%, rgba(57,208,216,.14) 0%, transparent 55%),
    radial-gradient(140% 90% at 50% 108%, rgba(var(--accent-rgb),.16) 0%, transparent 60%),
    var(--bg-0); }
html[data-mode="light"] #fpBg{
  background:
    radial-gradient(120% 80% at 14% 0%, rgba(var(--accent-rgb),.11) 0%, transparent 56%),
    radial-gradient(100% 70% at 90% 6%, rgba(57,208,216,.06) 0%, transparent 52%),
    var(--bg-0); }
#fpVeil{ display:none; }

.fp-top{ position:relative; z-index:3; flex:none; display:flex; align-items:center; gap:8px;
  padding:calc(var(--safe-t) + 10px) 14px 6px; }
.fp-top .mid{ flex:1; min-width:0; text-align:center; }
.fp-top .mid .a{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fp-top .mid .b{ font-size:11px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }

.fp-stage{ position:relative; z-index:3; flex:1; min-height:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:8px 22px; }
.fp-art{
  position:relative; width:min(80vw, 296px); height:min(80vw, 296px);
  border-radius:22px; overflow:hidden; flex:none;
  box-shadow:0 26px 60px rgba(0,0,0,.5);
  transition:transform .5s var(--ease-spring), border-radius .5s var(--ease-spring), opacity .45s var(--ease);
}
.fp-art img{ width:100%; height:100%; object-fit:cover; }
html.paused .fp-art{ transform:scale(.9); }
.fp-art .halo{ position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.13); }
.fp-art .pulse{ position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  box-shadow:0 0 0 0 rgba(var(--accent-rgb),.42); animation:artPulse 2.6s ease-out infinite; }
html.paused .fp-art .pulse{ animation-play-state:paused; }
@keyframes artPulse{ 0%{ box-shadow:0 0 0 0 rgba(var(--accent-rgb),.36) } 100%{ box-shadow:0 0 0 26px rgba(var(--accent-rgb),0) } }
.fp-art .hint{ position:absolute; left:0; right:0; bottom:10px; z-index:3; text-align:center;
  font-size:10.5px; color:rgba(255,255,255,.72); text-shadow:0 1px 4px rgba(0,0,0,.6); }

/* 文稿层：翻到文稿时必须把封面淡下去，不然半透明层压在封面上看不清字 */
.fp-lyric{ position:absolute; left:0; right:0; top:0; bottom:0; z-index:4;
  display:none; flex-direction:column;
  padding:0 6px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.fp-lyric.on{ display:flex; }
.fp-stage.txt .fp-art{ opacity:.08; transform:scale(.9); }
.fp-stage.txt .fp-art .pulse{ display:none; }
/* 翻到文稿时那行提示要彻底藏掉：它压在正文中间，只调透明度还是看得见 */
.fp-stage.txt .fp-art .hint{ display:none; }
.fp-art .hint.off{ display:none; }
.fp-lyric .pad{ min-height:36%; flex:none; }
.fp-lyric .ln{
  margin:0; padding:8px 12px; border-radius:12px; font-size:15px; line-height:1.6; color:var(--text-2);
  text-align:center; transition:color .3s var(--ease), transform .35s var(--ease-out), background .25s;
}
.fp-lyric .ln.cur{ color:var(--text-0); font-size:17px; font-weight:700; transform:scale(1.02); }
.fp-lyric .ln:active{ background:var(--glass); }
.fp-lyric .ln .t{ display:block; font-size:10px; color:var(--accent); font-family:var(--font-num);
  opacity:0; transition:opacity .25s; margin-bottom:2px; }
.fp-lyric .ln.cur .t{ opacity:1; }
.fp-lyric .none{ margin:auto; color:var(--text-2); font-size:13px; text-align:center; line-height:1.8; padding:0 24px; }
.fp-lyric .none b{ color:var(--accent); }

.fp-meta{ position:relative; z-index:3; flex:none; padding:14px 24px 4px; text-align:center; }
.fp-meta .t{ font-family:var(--font-display); font-size:18px; font-weight:700; line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.fp-meta .s{ margin-top:5px; font-size:12.5px; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.fp-dock{ position:relative; z-index:3; flex:none; padding:8px 24px calc(var(--safe-b) + 18px); }
.fp-prog{ display:flex; align-items:center; gap:9px; }
.fp-prog .tm{ font-size:10.5px; color:var(--text-2); font-family:var(--font-num); width:42px; flex:none; }
.fp-prog .tm.r{ text-align:right; }
.fp-bar{ flex:1; height:22px; display:flex; align-items:center; position:relative; touch-action:none; }
.fp-bar .trk{ position:absolute; left:0; right:0; height:3.5px; border-radius:3px; background:rgba(255,255,255,.13); }
html[data-mode="light"] .fp-bar .trk{ background:rgba(0,0,0,.10); }
.fp-bar .buf{ position:absolute; left:0; height:3.5px; border-radius:3px; background:rgba(255,255,255,.28); width:0; }
html[data-mode="light"] .fp-bar .buf{ background:rgba(0,0,0,.20); }
.fp-bar .fil{ position:absolute; left:0; height:3.5px; border-radius:3px;
  background:linear-gradient(90deg,var(--accent),var(--cyan)); width:0; }
.fp-bar .knb{ position:absolute; width:11px; height:11px; border-radius:50%; background:#fff;
  box-shadow:0 2px 7px rgba(0,0,0,.45); left:0; margin-left:-5.5px;
  transform:scale(0); transition:transform .24s var(--ease-spring); }
/* 章节标记：直接画在进度条上，长播客里很好用 */
.fp-bar .mk{ position:absolute; width:2px; height:9px; border-radius:1px; background:rgba(255,255,255,.55);
  margin-left:-1px; pointer-events:none; }
html[data-mode="light"] .fp-bar .mk{ background:rgba(0,0,0,.3); }
.fp-bar.act .knb, .fp-bar:active .knb{ transform:scale(1); }
.fp-bar.act .trk, .fp-bar.act .fil, .fp-bar.act .buf{ height:5px; }

.fp-ctrls{ display:flex; align-items:center; justify-content:center; gap:18px; margin:12px 0 6px; min-height:62px; }
.fp-ctrls button{ width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  color:var(--text-0); transition:transform .22s var(--ease-spring), background .22s; position:relative; }
.fp-ctrls button:active{ transform:scale(.86); background:var(--glass); }
.fp-ctrls button svg{ width:26px; height:26px; }
.fp-ctrls .play{
  width:62px; height:62px; color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-dim));
  box-shadow:0 10px 26px var(--accent-glow);
}
.fp-ctrls .play svg{ width:27px; height:27px; }
.fp-ctrls .play:active{ background:linear-gradient(135deg,var(--accent),var(--accent-dim)); transform:scale(.92); }
.fp-ctrls .side{ width:40px; height:40px; color:var(--text-1); }
.fp-ctrls .side svg{ width:21px; height:21px; }
/* 秒数放进圆环正中，别再压在描边上 */
.fp-ctrls .jump{ width:48px; height:48px; }
.fp-ctrls .jump svg{ width:27px; height:27px; }
.fp-ctrls .jump b{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;

  padding-top:.5px; pointer-events:none; }

.fp-quick{ display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:2px; }
.fp-quick button{
  flex:1; height:34px; border-radius:11px;
  display:flex; align-items:center; justify-content:center; gap:4px;
  font-size:11px; font-weight:650; color:var(--text-1); letter-spacing:.2px;
  transition:transform .2s var(--ease-spring), color .2s, background .2s; white-space:nowrap;
}
.fp-quick button:active{ transform:scale(.93); background:var(--glass); }
.fp-quick button svg{ width:14px; height:14px; flex:none; }
.fp-quick button.on{ color:var(--accent); }
.fp-quick button.busy{ opacity:.45; }
@keyframes bgPulse{ 0%,100%{ opacity:1 } 50%{ opacity:.4 } }
.fp-quick button.busy svg{ animation:bgPulse 1s ease-in-out infinite; }

#sheetMask{ position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.5);
  opacity:0; visibility:hidden; transition:opacity .3s, visibility .3s; }
#sheetMask.on{ opacity:1; visibility:visible; }
#sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:101;
  max-height:82%; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--bg-elevated); border-radius:22px 22px 0 0;
  padding:10px 0 calc(var(--safe-b) + 14px);
  transform:translate3d(0,100%,0); visibility:hidden;
  transition:transform .42s var(--ease-out), visibility .42s;
  box-shadow:0 -12px 40px rgba(0,0,0,.4);
}
#sheet.on{ transform:none; visibility:visible; }
#sheet .grip{ width:36px; height:4px; border-radius:2px; background:var(--line); margin:2px auto 12px; }
#sheet h4{ margin:0 0 8px; padding:0 20px; font-size:15px; font-weight:700; font-family:var(--font-display); }
#sheet .hint{ padding:0 20px 10px; font-size:11.5px; color:var(--text-2); line-height:1.6; }
.sh-item{ display:flex; align-items:center; gap:12px; padding:12px 20px; font-size:14px; transition:background .2s; }
.sh-item:active{ background:var(--glass); }
.sh-item svg{ width:18px; height:18px; color:var(--text-1); flex:none; }
.sh-item .l{ flex:1; min-width:0; }
.sh-item .l .d{ font-size:11px; color:var(--text-2); margin-top:2px; }
.sh-item .chk{ color:var(--accent); opacity:0; transition:opacity .2s, transform .3s var(--ease-spring); transform:scale(.6); }
.sh-item.on .chk{ opacity:1; transform:none; }
.sh-item.on{ color:var(--accent); }
.sh-item.on svg{ color:var(--accent); }
.sh-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; padding:4px 20px 12px; }
.sh-grid button{ padding:11px 0; border-radius:12px; background:var(--glass); font-size:13px; font-weight:600;

.sh-grid button:active{ transform:scale(.93); }
.sh-grid button.on{ color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent-dim)); }

/* ---------- toast ---------- */
#toast{
  position:fixed; left:50%; z-index:200; bottom:calc(var(--safe-b) + 96px);
  transform:translate3d(-50%,16px,0); opacity:0; visibility:hidden; pointer-events:none;
  max-width:82%; padding:10px 18px; border-radius:999px;
  background:rgba(18,16,28,.94); color:#fff; font-size:13px; text-align:center; line-height:1.45;
  box-shadow:0 10px 30px rgba(0,0,0,.44);
  transition:opacity .28s var(--ease), transform .34s var(--ease-spring), visibility .28s;
}
#toast.on{ opacity:1; visibility:visible; transform:translate3d(-50%,0,0); }

/* ---------- 下载中心 ---------- */
.dl-item{ display:flex; align-items:center; gap:10px; padding:10px 20px; }
.dl-item .l{ flex:1; min-width:0; }
.dl-item .l .t{ font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dl-item .l .p{ margin-top:5px; height:3px; border-radius:2px; background:var(--glass); overflow:hidden; }
.dl-item .l .p i{ display:block; height:100%; width:0; border-radius:2px;
  background:linear-gradient(90deg,var(--accent),var(--cyan)); transition:width .3s var(--ease); }
.dl-item .s{ flex:none; font-size:11px; color:var(--text-2); font-family:var(--font-num); min-width:44px; text-align:right; }
.dl-item .s.err{ color:var(--danger); }
.dl-item .s.ok{ color:var(--accent); }

/* 定时关闭倒计时挂件 */
#sleepPill{
  position:fixed; right:12px; z-index:71; bottom:calc(var(--tab-h) + var(--safe-b) + var(--mini-h) + 14px);
  transition:bottom .4s var(--ease-out);
  display:none; align-items:center; gap:5px; padding:5px 11px; border-radius:999px;
  background:rgba(18,16,28,.86); color:#fff; font-size:11px; font-family:var(--font-num); font-weight:600;
  box-shadow:0 6px 18px rgba(0,0,0,.34);
}
#sleepPill.on{ display:flex; }
#sleepPill svg{ width:12px; height:12px; color:var(--accent); }

@media (max-width:340px){
  .cat-grid{ grid-template-columns:repeat(4,1fr); }
  .grid{ grid-template-columns:repeat(2,1fr); }
  .dcard .kv{ grid-template-columns:repeat(2,1fr); }
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

<script>
/* =========================================================================
   小宇宙 · 独立 HTML 端 —— 核心层（工具 / 宿主桥 / 凭证 / 接口）
   ---------------------------------------------------------------------
   接口来源有两条，语义都照搬 xiaoyuzhou-juicer（hesorchen）里跑通的那套：

   1) 免 token 链路：网页 SSR 的 __NEXT_DATA__
      - https://www.xiaoyuzhoufm.com/episode/<eid>   单集元信息 + 首屏热评
      - https://www.xiaoyuzhoufm.com/podcast/<pid>   播客信息 + 首页那批单集
      - 首页本身也是 SSR，能捞到一批「精选」单集
      这一条不需要任何账号，页面被改版了也只是取不到，不会泄露什么。

   2) 账号链路：api.xiaoyuzhoufm.com 的私有接口，要 x-jike-access-token
      - /v1/episode/get、/v1/podcast/get、/v1/episode/list
      - /v1/comment/list-primary（全量评论，SSR 只给首屏 20 条）
      - /v1/search/create（发现页每个榜单只给 Top 3，找话题得靠搜索）
      - /v1/top-list/list、/v1/discovery-feed/list
      - /v1/subscription/list、/v1/inbox/list
      - /v1/episode-transcript/get → 拿到 transcriptUrl 再去 CDN 取 JSON
      access token 只有 2 小时，所以这里存的是长效 refresh token，
      用 /app_auth_tokens.refresh 自动换新，并且把轮换回来的新 refresh
      存回本地 —— 不存回去下次续期就废了，这一点和 juicer 一致。

   凭证只写在本机 localStorage，不发给除小宇宙官方域名以外的任何地方。
   ---------------------------------------------------------------------
   代码基线 Chromium 51：不用 ?. ?? 展开 ** 反向断言 catch{} class 字段，
   一律 var + function。
   ========================================================================= */
(function(){
"use strict";

/* ---------------- 小工具 ---------------- */
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function el(tag, cls, txt){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function pad2(n){ n = Math.floor(n); return (n < 10 ? "0" : "") + n; }
function fmtTime(sec){
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? (h + ":" + pad2(m) + ":" + pad2(s)) : (pad2(m) + ":" + pad2(s));
}
/* 播客时长习惯写成「1 小时 24 分」，比 01:24:00 好读 */
function fmtDur(sec){
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  if (m === 60){ h += 1; m = 0; }
  if (h > 0) return h + " 小时" + (m ? " " + m + " 分" : "");
  return m + " 分钟";
}
function fmtCount(n){
  n = Number(n) || 0;
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, "") + "亿";
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, "") + "万";
  return String(n);
}
function fmtSize(b){
  b = Number(b) || 0;
  if (b >= 1048576) return (b / 1048576).toFixed(1) + "MB";
  if (b >= 1024) return Math.round(b / 1024) + "KB";
  return b + "B";
}
function now(){ return new Date().getTime(); }

/* 相对时间：列表里比 2026-08-16 直观 */
function fmtAgo(iso){
  if (!iso) return "";
  var t = Date.parse(String(iso).replace(/-/g, "/").replace(/\.\d+Z?$/, "").replace("T", " "));
  if (!isFinite(t)) t = Date.parse(iso);
  if (!isFinite(t)) return String(iso).slice(0, 10);
  var d = (now() - t) / 1000;
  if (d < 3600) return Math.max(1, Math.floor(d / 60)) + " 分钟前";
  if (d < 86400) return Math.floor(d / 3600) + " 小时前";
  if (d < 86400 * 30) return Math.floor(d / 86400) + " 天前";
  return String(iso).slice(0, 10);
}
function ageHours(iso){
  if (!iso) return 0;
  var t = Date.parse(String(iso).replace(/-/g, "/").replace(/\.\d+Z?$/, "").replace("T", " "));
  if (!isFinite(t)) t = Date.parse(iso);
  if (!isFinite(t)) return 0;
  return Math.max(0, (now() - t) / 3600000);
}

/* 统一请求：宿主走 fm.req（原生 OkHttp，不受 CORS 限制），浏览器退回 fetch。
   和喜马版的区别是这里要拿响应头 —— 续期接口把新 token 放在
   x-jike-access-token / x-jike-refresh-token 响应头里，正文是空的。
   宿主桥不一定回传 headers，所以下面对多种返回形状都做了兼容，
   实在拿不到就退回「让用户直接粘 access token」那条路。 */
function xfull(url, opts){
  opts = opts || {};
  var method = (opts.method || "GET").toUpperCase();
  var headers = opts.headers || webHdr();
  var body = opts.body;
  if (body != null && typeof body !== "string"){
    try{ body = JSON.stringify(body); }catch(e){ body = String(body); }
  }
  function norm(res){
    var out = { text: "", headers: {}, status: 0 };
    if (res == null) return out;
    if (typeof res === "string"){ out.text = res; return out; }
    if (typeof res === "object"){
      if (res.body != null) out.text = typeof res.body === "string" ? res.body : JSON.stringify(res.body);
      else if (res.data != null) out.text = typeof res.data === "string" ? res.data : JSON.stringify(res.data);
      else if (res.text != null) out.text = String(res.text);
      else if (res.result != null) out.text = typeof res.result === "string" ? res.result : JSON.stringify(res.result);
      if (res.status != null) out.status = Number(res.status) || 0;
      if (res.statusCode != null && !out.status) out.status = Number(res.statusCode) || 0;
      if (res.httpStatus != null && !out.status) out.status = Number(res.httpStatus) || 0;
      if (res.code != null && !out.status && Number(res.code) >= 100) out.status = Number(res.code) || 0;
      var hs = res.headers || res.header || res.responseHeaders || (res.response && res.response.headers);
      if (hs && typeof hs === "object"){
        for (var k in hs){
          if (!hs.hasOwnProperty(k)) continue;
          var v = hs[k];
          out.headers[String(k).toLowerCase()] = isArr(v) ? v[0] : String(v);
        }
      }
      var raw = res.rawHeaders || res.responseHeader || res.allHeaders || "";
      if (typeof raw === "string" && raw){
        raw.split(/\r?\n/).forEach(function(line){
          var at = line.indexOf(":");
          if (at > 0) out.headers[line.slice(0, at).trim().toLowerCase()] = line.slice(at + 1).trim();
        });
      }
      var accTop = res["x-jike-access-token"] || res.accessToken || res.access_token || "";
      var refTop = res["x-jike-refresh-token"] || res.refreshToken || res.refresh_token || "";
      if (accTop && !out.headers["x-jike-access-token"]) out.headers["x-jike-access-token"] = String(accTop);
      if (refTop && !out.headers["x-jike-refresh-token"]) out.headers["x-jike-refresh-token"] = String(refTop);
    }
    return out;
  }
  if (window.fm && typeof window.fm.req === "function"){
    return Promise.resolve()
      .then(function(){
        return window.fm.req(url, {
          method: method,
          headers: headers,
          body: body || "",
          responseType: opts.responseType || "text",
          timeout: opts.timeout || 15,
          credentials: "omit"
        });
      })
      .then(norm)
      ["catch"](function(){ return { text: "", headers: {}, status: 0 }; });
  }
  try{
    return fetch(url, {
      method: method, headers: headers,
      body: method === "POST" ? (body || "") : undefined,
      mode: "cors", credentials: "omit"
    }).then(function(r){
      return r.text().then(function(t){
        var hs = {};
        try{
          /* 浏览器里没有 CORS 暴露的话读不到自定义响应头，这是预期内的 */
          r.headers.forEach(function(v, k){ hs[String(k).toLowerCase()] = v; });
        }catch(e){}
        return { text: t, headers: hs, status: r.status };
      });
    })["catch"](function(){ return { text: "", headers: {}, status: 0 }; });
  }catch(e){ return Promise.resolve({ text: "", headers: {}, status: 0 }); }
}
function xreq(url, opts){ return xfull(url, opts).then(function(r){ return r.text; }); }

/* ---------------- 凭证：refresh token 自动续期 ---------------- */
var TK = (function(){
  var st = LS.get(K.cred, null) || { refresh: "", access: "", exp: 0, at: 0, err: "", phone: "", uid: "", nickname: "", deviceId: "" };
  function save(){ LS.set(K.cred, st); }
  /* 上一次续期失败的时刻；见下面 access() 里的冷却 */
  var refreshFailAt = 0;
  function has(){ return !!(st.refresh || st.access); }
  function valid(){ return !!(st.access && st.exp > now() + 60000); }

  /* 续期：POST /app_auth_tokens.refresh，新 token 在响应头里。
     有的宿主桥不回传响应头，这时正文里偶尔会带 data —— 两头都翻一遍。 */
  function refresh(){
    if (!st.refresh) return Promise.reject(new Error("没有 refresh token"));
    return xfull(API_BASE + "/app_auth_tokens.refresh", {
      method: "POST",
      headers: appHdr({ "x-jike-refresh-token": st.refresh }),
      body: "",
      timeout: 8
    }).then(function(r){
      var acc = r.headers["x-jike-access-token"] || "";
      var ref = r.headers["x-jike-refresh-token"] || "";
      if (!acc){
        var j = safeParse(r.text);
        if (j){
          acc = deepFind(j, "x-jike-access-token")[0] || deepFind(j, "accessToken")[0] || "";
          ref = deepFind(j, "x-jike-refresh-token")[0] || deepFind(j, "refreshToken")[0] || ref;
        }
      }
      if (!acc){
        st.err = r.status === 401 ? "refresh token 已失效，重新抓一枚" :
                 (r.status ? ("续期失败 HTTP " + r.status) : "续期失败：宿主没有回传响应头，改用 access token");
        save();
        throw new Error(st.err);
      }
      st.access = acc;
      /* 官方 access token 大约 2 小时，这里按 90 分钟当过期，留足余量 */
      st.exp = now() + 90 * 60 * 1000;
      st.at = now();
      st.err = "";
      /* 小宇宙会轮换 refresh token，新的那枚必须存回去 */
      if (ref && ref !== st.refresh) st.refresh = ref;
      save();
      return st.access;
    });
  }
  return {
    state: function(){ return st; },
    has: has,
    ready: function(){ return valid(); },
    /* 拿一枚可用 access token；拿不到就返回空串，调用方自己降级到免 token 链路 */
    access: function(){
      if (valid()) return Promise.resolve(st.access);
      if (st.access && !st.refresh && st.exp === 0) return Promise.resolve(st.access); /* 用户手填的 access */
      if (!st.refresh) return Promise.resolve("");
      /* 续期刚失败过就直接走免 token 链路。
         没有这道冷却时，refresh token 一失效，每点开一集都要重试一次续期，
         白等一整个超时才开始下 SSR 页面 —— 这就是「点进去半天没反应」。
         用户重新填凭证 / 手动续期时会清掉冷却。 */
      if (refreshFailAt && (now() - refreshFailAt) < 120000) return Promise.resolve("");
      return refresh()["catch"](function(){ refreshFailAt = now(); return ""; });
    },
    force: function(){ refreshFailAt = 0; return refresh(); },
    setRefresh: function(v){
      refreshFailAt = 0;
      st.refresh = String(v || "").trim();
      st.access = ""; st.exp = 0; st.err = "";
      save();
    },
    setAccess: function(v){
      refreshFailAt = 0;
      st.access = String(v || "").trim();
      st.exp = 0;              /* exp=0 表示这是手填的短效 token，不自动续 */
      st.refresh = st.refresh || "";
      st.err = "";
      save();
    },
    setLogin: function(v){
      refreshFailAt = 0;
      v = v || {};
      st.access = String(v.access || "").trim();
      st.refresh = String(v.refresh || "").trim();
      st.exp = st.access ? (now() + 90 * 60 * 1000) : 0;
      st.at = now(); st.err = "";
      st.phone = String(v.phone || st.phone || "");
      st.uid = String(v.uid || "");
      st.nickname = String(v.nickname || "");
      st.deviceId = String(v.deviceId || "");
      save();
    },
    clear: function(){ refreshFailAt = 0; st = { refresh: "", access: "", exp: 0, at: 0, err: "", phone: "", uid: "", nickname: "", deviceId: "" }; save(); },
    /* 401 时清掉缓存的 access，下次调用会自动续一次 */
    invalidate: function(){ if (st.refresh){ st.access = ""; st.exp = 0; save(); } }
  };
})();

    login:function(phone, code, areaCode){

/* ---------------- 深挖 JSON ---------------- */
function deepFind(obj, key){
  var out = [];
  (function walk(o){
    if (!o) return;
    if (isArr(o)){ for (var i = 0; i < o.length; i++) walk(o[i]); return; }
    if (typeof o === "object"){
      for (var k in o){
        if (!o.hasOwnProperty(k)) continue;
        if (k === key && o[k]) out.push(o[k]);
        walk(o[k]);
      }
    }
  })(obj);
  return out;
}
/* 把整棵 SSR 树里长得像「单集」的对象全捞出来（有 eid + title 就算），
   首页/发现页改版时结构会变，靠形状认比靠路径认稳。 */
function deepCollect(obj, test){
  var out = [], seen = [];
  (function walk(o){
    if (!o || typeof o !== "object") return;
    if (seen.indexOf(o) >= 0) return;
    seen.push(o);
    if (isArr(o)){ for (var i = 0; i < o.length; i++) walk(o[i]); return; }
    if (test(o)) out.push(o);
    for (var k in o){ if (o.hasOwnProperty(k)) walk(o[k]); }
  })(obj);
  return out;
}
function isEpObj(o){ return !!(o && o.eid && o.title && (o.enclosure || o.duration != null || o.pubDate)); }
function isPodObj(o){ return !!(o && o.pid && o.title && !o.eid && (o.author != null || o.subscriptionCount != null)); }

/* ---------------- 归一化 ---------------- */
function picUrl(o){
  if (!o) return "";
  if (typeof o === "string") return o;
  return o.picUrl || o.thumbnailUrl || o.middlePicUrl || o.smallPicUrl || o.largePicUrl || "";
}
function mapPod(p){
  if (!p) return null;
  return {
    pid: String(p.pid || p.id || ""),
    title: p.title || "",
    author: p.author || "",
    brief: p.brief || "",
    desc: p.description || p.brief || "",
    cover: picUrl(p.image) || picUrl(p.picture) || "",
    subs: Number(p.subscriptionCount || 0),
    count: Number(p.episodeCount || 0),
    latest: p.latestEpisodePubDate || "",
    podcasters: isArr(p.podcasters) ? p.podcasters : []
  };
}
/* =========================================================================
   音频直链：归一化 + 音质判定
   ---------------------------------------------------------------------
   查过十几个下载器项目后的结论，跟直觉相反：小宇宙没有多音质档位。
   直链是 media.xyzcdn.net/{pid}/{key}.m4a 这种内容寻址地址，没有查询参数、
   没有 _hd/_low 后缀、没有可替换的码率位；实测同一档节目多集的
   字节数 ÷ 时长恒定在 129.4 kbps，就是一档固定转码（约 128k AAC）。
   所以「选最高音质」在这里是伪命题 —— 真正会让音质变差的是走错源：
   榜单里近一半播客的 RSS 指向喜马拉雅 / 荔枝等第三方托管，那是另一个
   文件，码率未必一样。要保音质，就得优先走小宇宙自家 CDN。

   另外官方 RSS 里的 enclosure 不是直链，是一层下载统计跳转：
     https://dts-api.xiaoyuzhoufm.com/track/{pid}/{eid}/media.xyzcdn.net/...
   剥掉前缀就是直链本身，能省一次 302，也不上报播放统计。
   ========================================================================= */
var DTS_RE = /^https?:\/\/dts-api\.xiaoyuzhoufm\.com\/track\/[0-9a-fA-F]{24}\/[0-9a-fA-F]{24}\//;
function bestAudio(u){
  u = String(u || "");
  if (!u) return "";
  if (DTS_RE.test(u)) u = u.replace(DTS_RE, "https://");
  return u;
}
/* 直链体检：只要一个字节，靠 Content-Range 把真实文件大小问出来。
   播放器只播十几秒、进度条却显示一小时，多半是这里能看出端倪：
   要么服务端返回的本来就是个短片段（付费试听），要么 m4a 没做
   faststart（moov 在文件尾），浏览器读不出真实时长。 */
function audioProbe(url){
  var h = webHdr();
  h["Range"] = "bytes=0-1";
  h["Accept"] = "*/*";
  return xfull(url, { headers: h, timeout: 12 }).then(function(r){
    var hd = r.headers || {};
    var cr = hd["content-range"] || "";
    var total = 0;
    var m = /\/\s*(\d+)\s*$/.exec(cr);
    if (m) total = Number(m[1]) || 0;
    if (!total && hd["content-length"] && String(r.status) !== "206"){
      total = Number(hd["content-length"]) || 0;
    }
    return {
      status: r.status || 0,
      total: total,
      ranged: String(r.status) === "206" || /bytes/i.test(hd["accept-ranges"] || ""),
      type: hd["content-type"] || "",
      gotHeaders: !!cr || !!hd["content-length"] || !!hd["content-type"]
    };
  });
}

/* 给 UI 用：这条直链是什么来路 */
function audioKind(u){
  u = String(u || "");
  if (!u) return { src: "none", label: "没有音频地址", best: false, paid: false };
  if (/\/\/pmedia\.xyzcdn\.net|\/\/private-media\.xyzcdn\.net/.test(u))
    return { src: "paid", label: "账号授权的完整付费音源（签名地址）", best: true, paid: true };
  if (u.indexOf("media.xyzcdn.net") >= 0)
    return { src: "xz", label: "小宇宙 CDN · m4a（这一集官方就这一个文件）", best: true, paid: false };
  if (/ximalaya|xmcdn|lizhi\.fm|lizhi\.io|wavpub|anchor\.fm|spreaker|fireside|typlog|castos|buzzsprout/.test(u))
    return { src: "3rd", label: "第三方托管订阅源，未必是小宇宙那份转码", best: false, paid: false };
  return { src: "rss", label: "播客自有订阅源", best: false, paid: false };
}

/* 搜索接口在不同版本里对付费标记并不完全一致：旧版用
   isPrivateMedia，新版列表里还见过 isPaid / source.mode。不要只靠 URL
   判断，因为公开的 10 秒试听同样可能挂在 media.xyzcdn.net。 */
function isPaidEpisode(e, audio){
  var source = e && e.media && e.media.source;
  var mode = source && String(source.mode || "").toUpperCase();
  return !!(e && (e.isPrivateMedia || e.isPaid || e.isPaidEpisode || e.paywalled ||
           mode === "PRIVATE" || mode === "PREVIEW")) ||
         /\/\/(pmedia|private-media)\.xyzcdn\.net/.test(String(audio || ""));
}

function mapEp(e){
  if (!e) return null;
  var pod = e.podcast && typeof e.podcast === "object" ? mapPod(e.podcast) : null;
  /* enclosure.url 和 media.source.url 在公开单集上指向同一个文件，
     enclosure 在 SSR 和 App 接口两边都有，所以拿它当首选 */
  var audio = "";
  if (e.enclosure && e.enclosure.url) audio = e.enclosure.url;
  if (!audio && e.media && e.media.source && e.media.source.url) audio = e.media.source.url;
  /* 第三顺位：backupSource。官方接口文档里没写，但确实存在，白捡一层容错 */
  if (!audio && e.media && e.media.backupSource && e.media.backupSource.url) audio = e.media.backupSource.url;
  audio = bestAudio(audio);
  var asize = Number((e.media && e.media.size) || (e.enclosure && e.enclosure.length) || 0);
  /* 逐字稿的 mediaId 优先取 transcript.mediaId —— media.id 和它不等价，
     mediaKey 还可能带前导斜杠、扩展名有时是非标准的 .mp4a，都不能直接当它用。
     transcript 这个对象在不在，本身就是「这集有没有逐字稿」的判据。 */
  var mediaId = "";
  if (e.transcript && e.transcript.mediaId) mediaId = e.transcript.mediaId;
  if (!mediaId) mediaId = e.transcriptMediaId || "";
  if (!mediaId && e.media && e.media.id) mediaId = e.media.id;
  mediaId = String(mediaId).replace(/^\//, "");
  var cover = picUrl(e.image) || (pod ? pod.cover : "");
  return {
    eid: String(e.eid || e.id || ""),
    title: e.title || "",
    desc: (e.description || "").replace(/\s+$/, ""),
    shownotes: e.shownotes || "",
    dur: Number(e.duration || 0),
    pub: e.pubDate || "",
    cover: cover,
    audio: audio,
    asize: asize,
    priv: isPaidEpisode(e, audio),
    mediaId: mediaId,
    plays: Number(e.playCount || 0),
    comments: Number(e.commentCount || 0),
    claps: Number(e.clapCount || 0),
    favs: Number(e.favoriteCount || 0),
    picked: !!e.isPicked,
    pid: pod ? pod.pid : String(e.pid || ""),
    podTitle: pod ? pod.title : (e.podcastTitle || ""),
    podAuthor: pod ? pod.author : "",
    podCover: pod ? pod.cover : cover,
    podSubs: pod ? pod.subs : 0,
    raw: e
  };
}

/* ---------------- shownotes：纯文本 / 章节 ---------------- */
function htmlToText(h){
  var s = String(h || "");
  s = s.replace(/<(br|\/p|\/div|\/li|figure|\/figure|\/h[1-6])[^>]*>/gi, "\n");
  s = s.replace(/<[^>]+>/g, "");
  var d = document.createElement("textarea");
  d.innerHTML = s;
  s = d.value;
  s = s.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n");
  return s.replace(/^\s+|\s+$/g, "");
}
/* 从 shownotes 纯文本里抽章节，兼容两种排版（照搬 juicer 的 extract_chapters）：
     '00:02:41 标题'      同一行
     '00:02:41\n标题'     时间戳与标题分行 */
function extractChapters(text){
  var lines = String(text || "").split("\n");
  var clean = [];
  for (var i = 0; i < lines.length; i++){
    var ln = lines[i].replace(/^\s+|\s+$/g, "");
    if (ln) clean.push(ln);
  }
  var re = /^(\d{1,2}:\d{2}(?::\d{2})?)/;
  var out = [];
  for (var j = 0; j < clean.length; j++){
    var m = re.exec(clean[j]);
    if (!m) continue;
    var title = clean[j].slice(m[0].length).replace(/^[\s\-—·:：|]+/, "").replace(/\s+$/, "");
    if (!title && j + 1 < clean.length && !re.test(clean[j + 1])) title = clean[j + 1];
    out.push({ ts: m[1], sec: hmsToSec(m[1]), title: title || "（未命名段落）" });
  }
  return out;
}
function hmsToSec(s){
  var p = String(s).split(":");
  var n = 0;
  for (var i = 0; i < p.length; i++) n = n * 60 + (parseInt(p[i], 10) || 0);
  return n;
}
function secToHms(sec){
  sec = Math.max(0, Math.floor(sec));
  return pad2(Math.floor(sec / 3600)) + ":" + pad2(Math.floor((sec % 3600) / 60)) + ":" + pad2(sec % 60);
}
/* 年龄归一化的热度指标，对应 juicer 的 snapshot_metrics：
   绝对播放量对新单集不公平，每小时播放 / 每千播放评论数才有可比性 */
function snapshot(ep){
  var age = ageHours(ep.pub);
  return {
    ageHours: age,
    playsPerHour: age > 0 && ep.plays ? Math.round(ep.plays / age * 10) / 10 : null,
    cmtPerK: ep.plays ? Math.round(ep.comments * 1000 / ep.plays * 10) / 10 : null
  };
}

/* ---------------- 链接解析 ---------------- */
function parseLink(s){
  s = String(s || "").replace(/^\s+|\s+$/g, "");
  var m = /\/episode\/([0-9a-fA-F]{16,})/.exec(s);
  if (m) return { kind: "episode", id: m[1] };
  m = /\/podcast\/([0-9a-fA-F]{16,})/.exec(s);
  if (m) return { kind: "podcast", id: m[1] };
  if (/^[0-9a-fA-F]{24}$/.test(s)) return { kind: "episode", id: s };  /* 裸 id 默认按单集试 */
  return null;
}

/* ---------------- 短链 ----------------
   微博 / 微信里分享出来的是 https://xyzfm.link/s/xxxxxx，正文里没有 24 位 id，
   parseLink 认不出来。实测这条短链是服务端 302，跟到的落地页就是目标页本身，
   <link rel="canonical"> 里直接写着长地址 —— 所以一趟请求就够，
   不需要「先解析短链拿长地址、再去抓长地址」两趟。

   xreq 在宿主里走 fm.req（OkHttp 默认跟重定向），浏览器里走 fetch（也跟）。
   万一哪天桥不跟了，下面还会读 Location 响应头 / meta refresh 自己再跳一次。
   长地址尾巴上那个 ?s=eyJ1Ijoi… 是分享者的追踪参数，
   parseLink 只取 id，所以它天然不会被带进后续任何请求。 */
function pickUrl(s){
  var m = /https?:\/\/[^\s<>"'\u3000\uff0c\u3002\uff1b\uff09\u3011)\]]+/i.exec(String(s || ""));
  return m ? m[0].replace(/[.,;:!?\uff0c\u3002\uff1b\u3001]+$/, "") : "";
}
function isShortLink(u){
  u = String(u || "");
  if (!/^https?:\/\//i.test(u)) return false;
  if (/\/(episode|podcast)\/[0-9a-fA-F]{16,}/.test(u)) return false;
  return /^https?:\/\/(?:[\w-]+\.)*xyzfm\.link\//i.test(u) ||
         /^https?:\/\/(?:[\w-]+\.)*xiaoyuzhoufm\.com\/s\//i.test(u);
}
function originOf(u){
  var m = /^(https?:\/\/[^\/]+)/i.exec(String(u || ""));
  return m ? m[1] : "";
}
/* 从落地页 HTML 里认出目标。顺序是有讲究的：
   canonical / og:url 指的是「这一页是什么」，而满页面乱抓 /episode/ 的话，
   播客页第一条单集的链接会把播客短链错认成单集。 */
function linkFromHtml(html){
  html = String(html || "");
  var tag = /<link[^>]+rel=["']canonical["'][^>]*>/i.exec(html) ||
            /<link[^>]+href=["'][^"']+["'][^>]*rel=["']canonical["'][^>]*>/i.exec(html);
  if (tag){
    var href = /href=["']([^"']+)["']/i.exec(tag[0]);
    if (href){ var h1 = parseLink(href[1]); if (h1) return h1; }
  }
  tag = /<meta[^>]+(?:property|name)=["']og:url["'][^>]*>/i.exec(html);
  if (tag){
    var ct = /content=["']([^"']+)["']/i.exec(tag[0]);
    if (ct){ var h2 = parseLink(ct[1]); if (h2) return h2; }
  }
  var nd = /id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/.exec(html);
  if (nd){
    var j = safeParse(nd[1]);
    var pp = j && j.props && j.props.pageProps;
    if (pp){
      if (pp.episode && pp.episode.eid) return { kind: "episode", id: String(pp.episode.eid) };
      if (pp.podcast && pp.podcast.pid) return { kind: "podcast", id: String(pp.podcast.pid) };
    }
  }
  return null;
}
function metaRefresh(html){
  var m = /<meta[^>]+http-equiv=["']refresh["'][^>]*>/i.exec(String(html || ""));
  if (!m) return "";
  var c = /content=["'][^"';]*;\s*url=([^"']+)["']/i.exec(m[0]);
  return c ? c[1] : "";
}
function resolveShort(u, hops){
  hops = hops || 0;
  if (hops > 3) return Promise.resolve(null);
  return xfull(u, { headers: webHdr(), timeout: 15 }).then(function(r){
    var loc = (r.headers && (r.headers["location"] || r.headers["content-location"])) || "";
    if (!loc) loc = metaRefresh(r.text);
    if (loc){
      var abs = absUrl(loc, originOf(u));
      var direct = parseLink(abs);
      if (direct) return direct;
      if (abs && abs !== u) return resolveShort(abs, hops + 1);
    }
    return linkFromHtml(r.text);
  })["catch"](function(){ return null; });
}
/* 统一入口：同步认得出就同步给，认不出但像短链就联网跟一次。永远返回 Promise。 */
function resolveLink(input){
  var direct = parseLink(input);
  if (direct) return Promise.resolve(direct);
  var u = pickUrl(input);
  if (!u) return Promise.resolve(null);
  direct = parseLink(u);
  if (direct) return Promise.resolve(direct);
  if (!isShortLink(u)) return Promise.resolve(null);
  return resolveShort(u, 0);
}

/* =========================================================================
   接口层
   ========================================================================= */
var API = {};
var MEM = { ep: {}, pod: {}, list: {}, cmt: {}, tr: {}, priv: {} };

/* --- 带 token 的 POST；401 自动续一次期再重试 --- */
function apiPost(path, payload, retry){
  return TK.access().then(function(tok){
    if (!tok) return null;
    return xfull(API_BASE + path, {
      method: "POST",
      headers: appHdr({ "x-jike-access-token": tok }),
      body: payload || {},
      timeout: 8
    }).then(function(r){
      var j = safeParse(r.text);
      var bad = (r.status === 401 || r.status === 403) ||
                (j && j.code && Number(j.code) === 401) ||
                (!j && r.status === 0 && !r.text);
      if (bad && !retry){
        TK.invalidate();
        return apiPost(path, payload, true);
      }
      if (!j) return null;
      /* 服务端出错时会带 toast 文案，直接抛出去让 UI 显示 */
      if (j.toast && !j.data) throw new Error(String(j.toast));
      return j;
    });
  });
}

/* xyz 项目验证过的 GET 私有接口。普通 episode/get 对付费节目经常只给试听
   enclosure；真正已购买的完整音源要向 /v1/private-media/get 单独换取，
   返回的 pmedia 签名地址带 TTL，故只在本次页面会话中缓存。 */
function apiGet(path, retry){
  return TK.access().then(function(tok){
    if (!tok) return null;
    return xfull(API_BASE + path, {
      method: "GET",
      headers: appHdr({ "x-jike-access-token": tok, "Accept": "*/*" }),
      timeout: 8
    }).then(function(r){
      var j = safeParse(r.text);
      var bad = (r.status === 401 || r.status === 403) ||
                (j && j.code && Number(j.code) === 401) ||
                (!j && r.status === 0 && !r.text);
      if (bad && !retry){
        TK.invalidate();
        return apiGet(path, true);
      }
      if (!j) return null;
      if (j.toast && !j.data) throw new Error(String(j.toast));
      return j;
    });
  });
}
/* xyz 的标准响应是 data.data.url。先精确取这一层，再兼容历史形状；
   泛搜到的封面 url 绝不能误当成付费音频。 */
function privateMediaUrl(j){
  var roots = [j && j.data && j.data.data, j && j.data, j];
  var candidates = [];
  for (var i = 0; i < roots.length; i++){
    var r = roots[i];
    if (!r || typeof r !== "object") continue;
    candidates.push(r.url || "", r.playUrl || "", r.mediaUrl || "");
  }
  var more = deepFind(j, "url").concat(deepFind(j, "playUrl"));
  for (var m = 0; m < more.length; m++) candidates.push(more[m]);
  var url = "";
  for (var c = 0; c < candidates.length; c++){
    var u = String(candidates[c] || "");
    if (/^https?:\/\//i.test(u) &&
        (/\/\/(pmedia|private-media)\.xyzcdn\.net/i.test(u) || /auth_key=/i.test(u))){
      url = u; break;
    }
  }
  if (!url){
    for (var c2 = 0; c2 < candidates.length; c2++){
      var u2 = String(candidates[c2] || "");
      if (/^https?:\/\/[^?#]+\.(m4a|mp3|mp4a)(?:[?#]|$)/i.test(u2)){ url = u2; break; }
    }
  }
  return bestAudio(url);
}
API.privateAudio = function(ep){
  if (!ep || !ep.eid || String(ep.eid).indexOf("rss:") === 0)
    return Promise.resolve("");
  if (MEM.priv[ep.eid]) return Promise.resolve(MEM.priv[ep.eid]);
  return apiGet("/v1/private-media/get?dubbing=false&eid=" + encodeURIComponent(ep.eid))
    .then(function(j){
      var url = privateMediaUrl(j);
      if (!url) throw new Error("账号没有取得完整付费音源；请确认这集已购买且登录凭证属于同一账号");
      MEM.priv[ep.eid] = url;
      ep.fullAudio = url;
      ep.audioAccess = "full";
      return url;
    });
};

/* --- SSR：把 __NEXT_DATA__ 整块捞出来 --- */
function ssr(url){
  return xreq(url, { headers: webHdr() }).then(function(html){
    if (!html) return null;
    var m = /id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/.exec(html);
    if (!m) return null;
    return safeParse(m[1]);
  });
}

/* --- 单集 --- */
/* ---------------- 单集详情落盘缓存 ----------------
   MEM.ep / MEM.cmt 只活在这一次会话里，页面一重载就全没了，于是每次进
   同一集都要重新下一张几百 KB 的 SSR 页面。这里按 eid 分键存进
   localStorage，和逐字稿缓存同一套路数：一个索引 + 每集一个键。
   分键的好处是每次只写一集，不用把整坨缓存重新序列化一遍。

   策略是 stale-while-revalidate：有缓存就立刻用，超过 EPC_STALE 再在
   后台悄悄刷一次。播放量、评论数这种数字过半小时才更新完全够用，
   而简介、章节、音源地址本来就不怎么变。 */
var EPC_STALE = 30 * 60 * 1000;          /* 超过这么久就后台刷新 */
var EPC_MAX_AGE = 30 * 24 * 3600 * 1000; /* 超过这么久直接当没有 */
var EPC_KEEP = 60;                       /* 最多留这么多集 */
var EPC_MAX_BYTES = 160 * 1024;          /* 单集超过这么大就只存元信息，不存评论 */

var EPC = (function(){
  function idx(){ var a = LS.get(K.epc, null); return isArr(a) ? a : []; }
  function saveIdx(a){ try{ LS.set(K.epc, a); }catch(e){} }
  /* 下划线开头的是运行期临时字段（比如解析出来的付费签名地址），
     带 TTL，不该落盘 */
  function clean(o){
    var out = {};
    for (var k in o){
      if (!o.hasOwnProperty(k)) continue;
      if (k.charAt(0) === "_") continue;
      out[k] = o[k];
    }
    return out;
  }
  return {
    get: function(eid){
      if (!eid) return null;
      var v = LS.get(K.epc + "." + eid, null);
      if (!v || !v.ep || !v.at) return null;
      if (now() - v.at > EPC_MAX_AGE){ LS.del(K.epc + "." + eid); return null; }
      return v;
    },
    put: function(eid, ep, cmt){
      if (!eid || !ep) return;
      var body = { at: now(), ep: clean(ep), cmt: cmt || null };
      try{
        if (body.cmt && JSON.stringify(body).length > EPC_MAX_BYTES) body.cmt = null;
      }catch(e){ return; }
      try{ LS.set(K.epc + "." + eid, body); }catch(e){ return; }
      /* 索引维护：最近用过的排前面，超出上限的连键一起删掉 */
      var a = idx(), out = [eid];
      for (var i = 0; i < a.length; i++){ if (a[i] !== eid) out.push(a[i]); }
      while (out.length > EPC_KEEP){
        var drop = out.pop();
        try{ LS.del(K.epc + "." + drop); }catch(e2){}
      }
      saveIdx(out);
    },
    clear: function(){
      var a = idx(), n = 0;
      for (var i = 0; i < a.length; i++){ try{ LS.del(K.epc + "." + a[i]); n++; }catch(e){} }
      try{ LS.del(K.epc); }catch(e3){}
      /* 索引丢了但键还在的漏网之鱼也扫一遍 */
      try{
        for (var j = window.localStorage.length - 1; j >= 0; j--){
          var k = window.localStorage.key(j);
          if (k && k.indexOf(K.epc + ".") === 0){ window.localStorage.removeItem(k); n++; }
        }
      }catch(e4){}
      return n;
    },
    count: function(){ return idx().length; }
  };
})();

/* 真正去网上取一集。原来那套 apiGet → SSR 兜底，只是多了一步写盘。
   v1.13：同一个 eid 同时只允许一条详情请求在跑。
   热门单集“快车道”和评论区都可能需要这张 SSR 页面；不去重的话，
   首次点开时可能把同一张几百 KB 页面并发下载两次，反而把首开拖慢。 */
var epFetching = {};

function fetchEpisodeNetwork(eid){
  return apiGet("/v1/episode/get?eid=" + encodeURIComponent(eid))["catch"](function(){ return null; })
    .then(function(j){
      var e = j && j.data ? mapEp(j.data) : null;
      if (e && e.title){
        MEM.ep[eid] = e;
        EPC.put(eid, e, MEM.cmt[eid] || null);
        return e;
      }
      return ssr(WEB_BASE + "/episode/" + eid).then(function(d){
        if (!d) throw new Error("这一集取不到（可能是链接失效或页面改版）");
        var pp = (d.props && d.props.pageProps) || {};
        var raw = pp.episode || deepCollect(d, isEpObj)[0];
        if (!raw) throw new Error("页面里没有单集数据");
        var ee = mapEp(raw);
        /* SSR 首屏还顺手带了热评，塞进缓存，评论区就不用再请求一次。
           关键是「一条评论都没有」也要写进去 —— 不写的话 API.comments
           会把这张几百 KB 的页面从头到尾再下一遍，而结果还是空的。 */
        var cl = isArr(pp.comments) ? pp.comments : [];
        var cm = { total: Number(ee.comments || cl.length || 0), list: cl, ssr: true };
        if (!MEM.cmt[eid]) MEM.cmt[eid] = cm;
        MEM.ep[eid] = ee;
        EPC.put(eid, ee, MEM.cmt[eid] || cm);
        return ee;
      });
    });
}

function fetchEpisode(eid){
  if (epFetching[eid]) return epFetching[eid];
  var task = fetchEpisodeNetwork(eid);
  epFetching[eid] = task;
  task.then(function(){
    if (epFetching[eid] === task) epFetching[eid] = null;
  }, function(){
    if (epFetching[eid] === task) epFetching[eid] = null;
  });
  return task;
}

/* 正在后台刷新的那几集。UI 想在刷新回来之后更新数字，就 then 这个 promise。 */
var epRefreshing = {};
function refreshEpisode(eid){
  if (epRefreshing[eid]) return epRefreshing[eid];
  var t = fetchEpisode(eid)["catch"](function(){ return null; });
  epRefreshing[eid] = t;
  t.then(function(){ epRefreshing[eid] = null; });
  return t;
}
/* 给 UI 用：这一集有没有现成的（同步，不发请求） */
API.episodeCached = function(eid){
  if (!eid) return null;
  if (MEM.ep[eid]) return MEM.ep[eid];
  var hit = EPC.get(eid);
  return hit ? hit.ep : null;
};
/* 给 UI 用：这一集是不是正在后台刷新，是的话拿到那个 promise */
API.episodePending = function(eid){ return epFetching[eid] || epRefreshing[eid] || null; };
API.epCacheClear = function(){ return EPC.clear(); };
API.epCacheCount = function(){ return EPC.count(); };

API.episode = function(eid, force){
  if (!force && MEM.ep[eid]) return Promise.resolve(MEM.ep[eid]);
  if (!force){
    var hit = EPC.get(eid);
    if (hit && hit.ep && hit.ep.title){
      MEM.ep[eid] = hit.ep;
      if (hit.cmt && !MEM.cmt[eid]) MEM.cmt[eid] = hit.cmt;
      /* 旧了就在后台刷一次，但绝不让这次打开等它 */
      if (now() - hit.at > EPC_STALE) refreshEpisode(eid);
      try{ console.log("[ep] 走本地缓存:", eid, Math.round((now() - hit.at) / 60000) + " 分钟前存的"); }catch(e){}
      return Promise.resolve(hit.ep);
    }
  }
  return fetchEpisode(eid);
};

/* --- 播客 + 单集列表 --- */
API.podcast = function(pid, force){
  if (!force && MEM.pod[pid]) return Promise.resolve(MEM.pod[pid]);
  return apiGet("/v1/podcast/get?pid=" + encodeURIComponent(pid))["catch"](function(){ return null; })
    .then(function(j){
      var p = j && j.data ? mapPod(j.data) : null;
      if (p && p.title){ MEM.pod[pid] = p; return p; }
      return ssr(WEB_BASE + "/podcast/" + pid).then(function(d){
        if (!d) throw new Error("这个播客取不到");

        if (!raw) throw new Error("页面里没有播客数据");
        var pod = mapPod(raw);
        /* 播客页 SSR 自带首屏那批单集，缓存起来当第一页 */
        var eps = [];

        for (var i = 0; i < pool.length; i++){

        MEM.pod[pid] = pod;

      });
    });
};
/* loadMoreKey 是小宇宙的游标分页，第一页不传，之后原样回传上一页返回的那个对象 */
API.episodes = function(pid, key){

    .then(function(j){

        return { list: out, key: j.loadMoreKey || null };

      if (!key) return API.podcast(pid).then(function(){
        return MEM.list[pid] ? { list: MEM.list[pid].list, key: null, ssr: true }

};

API.comments = function(eid, force){

    .then(function(j){
      if (j && isArr(j.data) && j.data.length){
        var r = { total: Number(j.totalCount || j.data.length), list: j.data, ssr: false };
        MEM.cmt[eid] = r;
        return r;
      }

      /* v1.13：热门单集首次打开时，官方详情 SSR 可能正在后台补全。
         那张页面本身就带首屏热评；先等同一条在途请求，避免再下载一次。 */
      var pending = epFetching[eid] || epRefreshing[eid];
      if (!force && pending){
        return pending.then(function(){
          if (MEM.cmt[eid]) return MEM.cmt[eid];
          return commentsFromSsr(eid);
        }, function(){
          return commentsFromSsr(eid);
        });
      }

      /* 免 token 兜底：单集页 SSR 里内嵌首屏约 20 条热评 */
      return commentsFromSsr(eid);
    });
};

/* --- 发现：榜单 Top3 + 编辑精选 + 为你推荐 --- */
API.discovery = function(){

    apiPost("/v1/discovery-feed/list", { limit: 30 })["catch"](function(){ return null; })
  ]).then(function(rs){

    var tl = rs[0] && isArr(rs[0].data) ? rs[0].data : [];
    for (var i = 0; i < tl.length; i++){

    }
    var feed = rs[1] && isArr(rs[1].data) ? rs[1].data : [];
    for (var q = 0; q < feed.length; q++){

          if (ce && ce.eid) out.forYou.push(ce);

      }
    }
    if (out.topLists.length || out.pick.length || out.forYou.length) return out;
    /* 免 token：首页 SSR 里能捞到一批精选单集，虽然没有榜单分组 */
    return ssr(WEB_BASE + "/").then(function(d){
      if (!d) return out;
      var pool = deepCollect(d, isEpObj), seen = {}, eps = [];
      for (var i2 = 0; i2 < pool.length; i2++){

        seen[ee.eid] = 1; eps.push(ee);
      }
      out.forYou = eps;
      out.viaSsr = true;
      return out;
    });
  });
};

/* --- 逐字稿：先拿 transcriptUrl，再去 CDN 取 JSON ---
   CDN 有 UA 白名单，必须带 App UA，普通浏览器 UA 会 403；
   浏览器里改不了 UA，所以这一步基本只能在宿主里跑通。 */
API.transcript = function(ep){
  var eid = ep.eid;
  if (MEM.tr[eid]) return Promise.resolve(MEM.tr[eid]);
  var cached = LS.get(K.tr + "." + eid, null);
  if (cached && isArr(cached) && cached.length){ MEM.tr[eid] = cached; return Promise.resolve(cached); }
  if (!TK.has()) return Promise.reject(new Error("逐字稿要登录凭证：右上角钥匙里填 refresh token"));
  var mid = ep.mediaId;
  return (mid ? Promise.resolve(mid) : API.episode(eid, true).then(function(e){ return e.mediaId; }))
    .then(function(mediaId){
      if (!mediaId) throw new Error("这一集没有 mediaId，官方没生成文稿");
      return apiPost("/v1/episode-transcript/get", { mediaId: mediaId, eid: eid });
    })
    .then(function(j){
      var url = j && j.data && j.data.transcriptUrl;
      if (!url) throw new Error("没拿到 transcriptUrl（这一集可能没有官方文稿）");
      return xreq(url, { headers: { "User-Agent": UA_APP } });
    })
    .then(function(txt){
      var arr = safeParse(txt);
      /* CDN 返回的是数组，个别情况会包一层 {segments:[...]} */
      if (!isArr(arr) && arr && isArr(arr.segments)) arr = arr.segments;
      if (!isArr(arr) || !arr.length) throw new Error("文稿内容是空的（CDN 可能拒绝了这次请求）");
      var segs = [];
      for (var i = 0; i < arr.length; i++){
        var s = arr[i];
        var t = (s && (s.text || s.content || "")).replace(/^\s+|\s+$/g, "");
        if (!t) continue;
        segs.push({ t: Math.round(Number(s.startMs || s.start || 0) / 1000), x: t, spk: s.speaker || "" });
      }
      MEM.tr[eid] = segs;
      try{ LS.set(K.tr + "." + eid, segs); }catch(e){}
      return segs;
    });
};
/* 逐字稿按 ~90 秒合并成段，导出和阅读都比一句一行舒服（同 juicer 的锚点策略） */
function groupSegs(segs, gap){
  gap = gap || 90;
  var out = [], cur = null;
  for (var i = 0; i < segs.length; i++){
    if (!cur || segs[i].t - cur.t >= gap){
      cur = { t: segs[i].t, x: segs[i].x };
      out.push(cur);
    } else {
      cur.x += segs[i].x;
    }
  }
  return out;
}

/* =========================================================================
   通用：失败重试
   ---------------------------------------------------------------------
   榜单这类「一次拿不到就整块空白」的请求，第一次失败往往只是冷启动时网络
   还没就绪。退避重试两次比让用户自己按刷新体面得多。
   ========================================================================= */
function retryReq(fn, times, delay){
  return fn()["catch"](function(err){
    if (times <= 0) throw err;
    return new Promise(function(res){ setTimeout(res, delay || 600); }).then(function(){
      return retryReq(fn, times - 1, Math.min((delay || 600) * 2, 4000));
    });
  });
}

/* =========================================================================
   免登录内容源之一：中文播客榜（xyzrank）的 GitHub 每日快照
   ---------------------------------------------------------------------
   这是整个免登录链路的骨架，原因只有一个：raw.githubusercontent.com 带
   access-control-allow-origin:*，浏览器里 fetch 直接就通 —— 不要宿主、
   不要代理、不要账号。小宇宙自家的 api / 网页都没有 CORS 头，抓站类的源
   （EarsOnMe 之类）也一样，所以它们在浏览器里注定是空白。

   仓库 cellinlab/xyzrank 每天用 Actions 更新四份 JSON，结构都是 {data:[...]}：
     full.json             热门播客榜
     new_podcasts.json     新锐播客
     hot_episodes.json     热门单集
     hot_episodes_new.json 新锐单集

   最要紧的是播客记录里的 links 数组，同时给出小宇宙页面地址（能反解出
   24 位 pid）和官方 RSS（feed.xyzfm.space/xxxx）。也就是说这份榜单本身
   就是一张「pid ↔ RSS」对照表：任何一档播客点开都至少有一条能播的路 ——
   有凭证走官方接口拿互动数据，没凭证就读它自己的 RSS 直接放。
   ========================================================================= */
/* 镜像列表全部是公开 GitHub 资源加速或官方源，不含私人反代。
   并发赛跑，谁先回有效数据用谁，胜出的写进 localStorage，下次优先从它开始。

   两种拼接格式不能混：
     完整 URL 型：代理域名/https://raw.githubusercontent.com/...
     去协议头型：代理域名/raw.githubusercontent.com/...   ← chenc.dev / yylx.win
   拼错格式直接 404，所以下面每条都是写全的，不做字符串拼装。

   ghfast.top 放在最前，方便大陆用户拉 GitHub 榜单；其余公共加速源跟在后面。
   只加速 cellinlab/xyzrank 这种公开资源，登录接口和私人 API 不会走这些域名。
   jsDelivr 和 GitHub raw 留在末尾做保底：它们在大陆经常不通，
   但并发模式下垫底不影响首屏（谁快用谁），万一加速源集体挂了还有条活路。 */
var BUILD = "2026.11.17-share-v1";
var XR_RAW_PATH = "raw.githubusercontent.com/cellinlab/xyzrank/main/";
var XR_HOSTS = [
  "https://ghfast.top/https://" + XR_RAW_PATH,                /* 大陆常用 GitHub 加速 */
  "https://gh.acmsz.top/https://" + XR_RAW_PATH,
  "https://gh.monlor.com/https://" + XR_RAW_PATH,
  "https://github.chenc.dev/" + XR_RAW_PATH,                 /* 去协议头型 */
  "https://jsnzkpg4.pages.dev/https://" + XR_RAW_PATH,
  "https://git.yylx.win/" + XR_RAW_PATH,                      /* 去协议头型 */
  "https://gh.jjj.gv.uy/https://" + XR_RAW_PATH,
  "https://fastly.jsdelivr.net/gh/cellinlab/xyzrank@main/",   /* 保底 */
  "https://" + XR_RAW_PATH                                     /* 保底：直连 */
];
/* 可选的自定义榜单源前缀。分享版默认不设置，直接走上面的公共镜像赛跑。
   需要自备源时，把前缀写入 localStorage 键 xr_primary（JSON 字符串，
   例如 "https://example.com/xyzrank/"）；写空串就是关掉，仍走公共镜像。 */
var XR_PRIMARY = "";
try {
  var _xp = LS.get("xr_primary", null);
  if (typeof _xp === "string") XR_PRIMARY = _xp;
} catch (e) {}

var XR = {};
var xrCache = {};   /* 一次会话内每份 JSON 只拉一遍 */
/* 「正在下载中」的那一轮。xrCache 只认下完的结果，所以在它填上之前，
   两个调用方各自会起一轮 9 镜像赛跑 —— full.json 近 10 MB，同时下两遍。 */
var xrPending = {};
var xrPodIx = {};   /* 榜单内部 id(32位) → 播客记录，给单集补 pid / RSS */
var xrHost = null;  /* 上一次成功的镜像 */
try { xrHost = LS.get("xr_host", null) || null; } catch(e){}   /* 跨次启动记住它 */
/* 换过镜像列表之后，旧的记忆值可能已经不在列表里了，留着只会白占一个并发位 */
if (xrHost && XR_HOSTS.indexOf(xrHost) < 0){ xrHost = null; try { LS.set("xr_host", null); } catch(e){} }

function xrLink(links, want){
  if (!isArr(links)) return "";
  for (var i = 0; i < links.length; i++){
    if (links[i] && links[i].name === want) return String(links[i].url || "");
  }
  return "";
}
function xrPid(links){
  var m = /\/podcast\/([0-9a-fA-F]{24})/.exec(xrLink(links, "xyz") || xrLink(links, "website"));
  return m ? m[1] : "";
}
/* 榜单封面来自 Apple，默认只给 100x100，列表里会糊 */
function xrLogo(u){ return String(u || "").replace(/\/\d+x\d+bb\./, "/600x600bb."); }

/* 这几份文件的外层包装不统一：播客榜是 {data:{podcasts:[]}}，
   单集榜是 {data:{episodes:[]}}，将来改名也不奇怪。与其把键名写死，
   不如往里挖第一个「对象数组」——结构变了也不至于整栏空白。 */
function xrUnwrap(j){
  if (!j) return null;
  if (isArr(j)) return j;
  var pools = [j.data, j];
  for (var i = 0; i < pools.length; i++){
    var o = pools[i];
    if (!o || typeof o !== "object") continue;
    if (isArr(o)) return o;
    for (var k in o){

   原来是串行：每个镜像 12 秒超时，大陆网络下 jsDelivr 三个域名和 GitHub raw
   经常全都连不上或极慢，最坏要等将近一分钟首屏才出来。
   并发之后首屏耗时 = 最快那个镜像的耗时，而不是前面几个失败的累加。
   胜出的镜像写进 localStorage，下次启动直接从它开始。 */

function xrOne(host, file){
  var hdr = webHdr();
  hdr["Accept"] = "application/json,text/plain,*/*";
  return xfull(host + file, { headers: hdr, timeout: 12 }).then(function(r){
    var arr = xrUnwrap(safeParse(r.text));
    if (!isArr(arr) || !arr.length){

    }
    xrCache[file] = arr;
    try { console.log("[xr] 自定义榜单源命中:", host + file, arr.length + " 条"); } catch(e){}
    return arr;
  });

XR.raw = function(file){

  if (xrPending[file]) return xrPending[file];      /* 已经有一轮在跑，跟着它就行 */
  var task = XR_PRIMARY
    ? xrOne(XR_PRIMARY, file)["catch"](function(err){
        try { console.log("[xr] 自定义榜单源不通，回退公共镜像:", (err && err.message) || err); } catch(e){}
        return xrRace(file);
      })
    : xrRace(file);
  xrPending[file] = task;
  /* 成败都要从在途表里摘掉：成功后走 xrCache，失败后允许重试 */
  task.then(function(){ xrPending[file] = null; }, function(){ xrPending[file] = null; });
  return task;

function xrRace(file){

  }
  var hdr0 = webHdr();
  hdr0["Accept"] = "application/json,text/plain,*/*";
  var gotBytes = false, pending = hosts.length;
  var task = new Promise(function(resolve, reject){
    var settled = false;
    function lose(){
      if (settled) return;
      if (--pending <= 0){
        settled = true;
        reject(new Error(gotBytes
          ? "镜像连上了，但文件里没有能认的榜单结构（上游可能改版了）"
          : "所有公共镜像都没连上：加速源、jsDelivr 和 GitHub raw 都取不到，多半是网络到不了"));
      }
    }
    hosts.forEach(function(h, n){
      /* 首选镜像立刻发，其余错开一点，避免四路同时挤同一条链路 */
      setTimeout(function(){
        if (settled) return;
        xfull(h + file, { headers: hdr0, timeout: 9 }).then(function(r){
          if (settled) return lose();
          if (r.text && r.text.length > 40) gotBytes = true;
          var arr = xrUnwrap(safeParse(r.text));
          if (!isArr(arr) || !arr.length) return lose();
          settled = true;
          xrHost = h;
          try { LS.set("xr_host", h); } catch(e){}
          xrCache[file] = arr;
          try { console.log("[xr] 镜像胜出:", h); } catch(e){}
          resolve(arr);
        }, lose);

    });
  });

}
XR.rawLegacy = function(file){

        : "所有公共镜像都没连上：加速源、jsDelivr 和 GitHub raw 都取不到，多半是网络到不了");
    }

        if (r.text && r.text.length > 40) gotBytes = true;
        var arr = xrUnwrap(safeParse(r.text));

  API.epQualities = function(trackId){

  API.qualityLadder = function(trackId, withOrigin){

       悄悄把那条低码率地址当成原始档下下来。 */
    if (track.url && /^https?:\/\//i.test(track.url) &&
        (now() - (track.urlAt || 0)) < 8 * 60000 && (track.urlQ || "high") === want){
      return Promise.resolve(track.url);

      u = normSrc(u);

      var pEp = API.epQualities(tid).then(function(list){
        if (!list || !list.length) return null;
        var p = pickQuality(list, want === "origin" ? "high" : want);
        return p ? p.url : null;
      }).catch(function(){ return null; });
  
      return firstOf([pWeb, pMob, pEp]).then(function(u){
        if (u) return apply(u);
        return xjson("https://www.ximalaya.com/revision/play/v1/audio?id=" + encodeURIComponent(tid) +
          "&ptype=1&t=" + now(), { headers: xmHdr(), timeout: 8 }).then(function(d){

      if (list && list.length) track.qualities = list;

      if (pick && pick.url && (want === "origin" ? pick.origin : (pick.kbps || 0) >= 64)){

  /* ---------------- 上层：喜马托管的 RSS → 专辑 ---------------- */

  API.albumIdFromFeed = function(u){

            /\/rss\/album\/(\d{4,})/i.exec(s);
    return m ? m[1] : "";
