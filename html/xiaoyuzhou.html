  /* ---------------- 匹配打分 ----------------
     和之前跨平台匹配同一套思路：标题相似度 + 时长锚点。
     时长是最硬的一条 —— 同一期节目跨平台误差通常在几秒内，
     而选集、精编版、分段上传的时长必然对不上。 */
  function normT(s){
    return String(s || "").toLowerCase()
      .replace(/[\s\u3000]+/g, "")
      .replace(/[\[\]【】()（）|｜·・,，.。!！?？:：;；'"“”‘’\-_~—]/g, "");
  }
  function lcsRatio(a, b){
    a = normT(a); b = normT(b);
    if (!a || !b) return 0;
    if (a === b) return 1;
    if (a.length > 60) a = a.slice(0, 60);
    if (b.length > 60) b = b.slice(0, 60);
    var la = a.length, lb = b.length, prev = [], cur = [], i, j;
    for (j = 0; j <= lb; j++) prev[j] = 0;
    for (i = 1; i <= la; i++){
      cur[0] = 0;
      for (j = 1; j <= lb; j++){
        cur[j] = a.charAt(i - 1) === b.charAt(j - 1)
          ? prev[j - 1] + 1 : Math.max(prev[j], cur[j - 1]);
      }
      for (j = 0; j <= lb; j++) prev[j] = cur[j];
    }
    return (2 * prev[lb]) / (la + lb);
  }
  /* 满分 100：标题 0-55 · 时长 -30~+35 · 专辑名 0-10。返回 -1 直接出局 */
  API.MATCH_MIN = 58;
  API.score = function(cand, want){
    if (!cand || !want) return -1;
    var s = 0;
    var r = lcsRatio(cand.name, want.title);
    if (r >= 0.95) s += 55;
    else if (r >= 0.82) s += 44;
    else if (r >= 0.62) s += 30;
    else if (r >= 0.45) s += 16;
    else return -1;

    var cd = Number(cand.dur) || 0, wd = Number(want.dur) || 0;
    if (cd > 0 && wd > 0){
      var diff = Math.abs(cd - wd);
      if (diff <= 3) s += 35;
      else if (diff <= 10) s += 26;
      else if (diff <= 30) s += 12;
      else if (diff <= 90) s -= 6;
      else s -= 30;              /* 差一分半以上，基本不是同一期 */
    }
    var ar = lcsRatio(cand.albumName || "", want.podTitle || "");
    if (ar >= 0.9) s += 10;
    else if (ar >= 0.6) s += 5;
    return s;
  };

  /** 在一个专辑里翻页找匹配的那一期。命中高分就提前收手。 */
  API.findInAlbum = function(albumId, want, maxPages){
    maxPages = maxPages || 4;
    var best = null, page = 1;
    function step(){
      if (page > maxPages) return Promise.resolve(best);
      return API.albumTracks(albumId, page, false).then(function(r){
        var list = (r && r.list) || [];
        for (var i = 0; i < list.length; i++){
          var sc = API.score(list[i], want);
          if (sc >= API.MATCH_MIN && (!best || sc > best.sc)) best = { t: list[i], sc: sc };
        }
        if (best && best.sc >= 85) return best;            /* 够准了，不用再翻 */
        if (!r || !r.hasMore || page >= (r.pages || 1)) return best;
        page++;
        return step();
      }).catch(function(){ return best; });
    }
    return step();
  };

  /**
   * 兜底主入口：拿小宇宙的一集，去喜马找同一期，返回可播地址。
   * want = { title, dur, podTitle, podAuthor }
   */
  API.rescue = function(want, prefer){
    if (!want || !want.title) return Promise.resolve(null);
    var queries = [];
    function push(q){
      q = String(q || "").replace(/\s+/g, " ").trim();
      if (q && queries.indexOf(q) < 0 && queries.length < 3) queries.push(q);
    }
    /* 先用「播客名 + 单集名」缩小到正确的专辑，再退到只搜播客名 */
    if (want.podTitle) push(want.podTitle + " " + want.title);
    if (want.podTitle) push(want.podTitle);
    push(want.title);

    var qi = 0;
    function round(){
      if (qi >= queries.length) return Promise.resolve(null);
      var kw = queries[qi++];
      return API.searchAlbums(kw, 1, 10).then(function(r){
        var albums = (r && r.list) || [];
        if (!albums.length) return round();
        /* 专辑先按名字和播客名的贴合度排一下，最多试前三个 */
        albums.sort(function(a, b){
          return lcsRatio(b.title, want.podTitle || want.title) -
                 lcsRatio(a.title, want.podTitle || want.title);
        });
        var ai = 0;
        function tryAlbum(){
          if (ai >= Math.min(albums.length, 3)) return round();
          var alb = albums[ai++];
          return API.findInAlbum(alb.id, want, 3).then(function(hit){
            if (!hit) return tryAlbum();
            return API.trackUrl(hit.t, prefer || "high").then(function(u){
              if (!u) return tryAlbum();
              return { url: u, track: hit.t, album: alb, score: hit.sc };
            }).catch(tryAlbum);
          }).catch(tryAlbum);
        }
        return tryAlbum();
      }).catch(round);
    }
    return round();
  };

  return API;
})();

/* =========================================================================
   免登录内容源之二：Apple 播客榜单 + RSS
   ---------------------------------------------------------------------
   这一路完全不碰账号：Apple 的榜单和搜索都是公开 JSON，拿到 feedUrl 之后
   直接解析播客自己的 RSS —— 单集、简介、音频直链全在里面，能搜能听能下。
   小宇宙独占的节目这里没有，但「没登录就没内容」的问题它能兜住。

var AP = {};
var AP_CHART = "https://rss.marketingtools.apple.com/api/v2/cn/podcasts/top/";

var AP_CHART_LEGACY = "https://itunes.apple.com/cn/rss/toppodcasts/limit=";
var AP_CHART_TTL = 6 * 60 * 60 * 1000;   /* 榜单一天最多变一次，缓存 6 小时足够 */
function apBigCover(u){
  /* Apple 封面地址形如 .../100x100bb.png，换成 600x600 更清楚。
     注意这里不能再过 thumb()：那是七牛的 imageView2 语法，mzstatic 不认。 */
  return String(u || "").replace(/\/\d+x\d+bb\./, "/600x600bb.");
}
AP.charts = function(limit){
  var n = limit || 100;
  function viaMarketing(){
    return xjson(AP_CHART + n + "/podcasts.json", { headers: { "Accept": "application/json" } })
      .then(function(j){
        var rs = (j && j.feed && j.feed.results) || [];
        var out = [];
        for (var i = 0; i < rs.length; i++){
          out.push({
            src: "ap", apId: String(rs[i].id), title: rs[i].name || "",
            author: rs[i].artistName || "",
            cover: apBigCover(rs[i].artworkUrl100)
          });
        }
        return out;
      });
  }
  function viaLegacy(){
    return xjson(AP_CHART_LEGACY + n + "/json", { headers: { "Accept": "application/json" } })
      .then(function(j){
        var rs = (j && j.feed && j.feed.entry) || [];
        if (!isArr(rs)) rs = [rs];
        var out = [];
        for (var i = 0; i < rs.length; i++){
          var e = rs[i]; if (!e) continue;
          var imgs = e["im:image"] || [];
          var img = isArr(imgs) && imgs.length ? (imgs[imgs.length - 1].label || "") : "";
          var id = (e.id && e.id.attributes && e.id.attributes["im:id"]) || "";
          out.push({
            src: "ap", apId: String(id),
            title: (e["im:name"] && e["im:name"].label) || "",
            author: (e["im:artist"] && e["im:artist"].label) || "",
            cover: apBigCover(img)
          });
        }
        return out;
      });
  }

     原来是「先等 marketingtools 失败/返回空，再去试旧端点」——
     marketingtools 慢的时候，那段等待时间是白白加在首屏上的。 */
  function race(){
    var tasks = [viaMarketing, viaLegacy];
    var pending = tasks.length, settled = false;
    return new Promise(function(resolve, reject){
      function lose(why){
        if (settled) return;
        if (--pending <= 0){ settled = true; reject(new Error("Apple 榜单两个端点都没返回数据")); }
      }
      tasks.forEach(function(fn, i){
        setTimeout(function(){
          if (settled) return;
          fn().then(function(l){
            if (settled) return lose();
            if (!l || !l.length) return lose();
            settled = true;
            try { console.log("[ap] 胜出端点:", i === 0 ? "marketingtools" : "旧版RSS", "条数:", l.length); } catch(e){}
            resolve(l);
          }, function(err){
            try { console.log("[ap] 端点", i, "失败:", err && err.message); } catch(e){}
            lose();
          });
        }, i === 0 ? 0 : 150);
      });
    });
  }
  /* 榜单一天最多变一次，没必要每次打开都等网络。
     命中新鲜缓存直接返回（首屏基本瞬开），同时后台悄悄刷新供下次使用。 */
  var ck = "ap_chart_" + n;
  var hit = LS.get(ck, null);
  var fresh = hit && hit.at && (now() - hit.at) < AP_CHART_TTL && isArr(hit.list) && hit.list.length;
  if (fresh){
    try { console.log("[ap] 用缓存，", hit.list.length, "条，", Math.round((now() - hit.at) / 60000), "分钟前抓的"); } catch(e){}
    setTimeout(function(){
      race().then(function(l){ LS.set(ck, { at: now(), list: l }); }, function(){});
    }, 1500);
    return Promise.resolve(hit.list);
  }
  return race().then(function(l){
    try { LS.set(ck, { at: now(), list: l }); } catch(e){}
    try { console.log("[ap] 首条封面:", l[0] && l[0].cover); } catch(e){}
    return l;
  }, function(err){
    /* 网络不行但有旧缓存时，宁可给过期数据也别给白板 */
    if (hit && isArr(hit.list) && hit.list.length){
      try { console.log("[ap] 取不到新数据，回退到过期缓存"); } catch(e){}
      return hit.list;
    }
    throw err;
  });
};
AP.search = function(kw){

AP.feed = function(url){

    .then(function(xml){

/* ---------------- VideoTranscriptAPI 后备转写 ----------------

  var art = el("div", "art");
  var img = el("img"); img.alt = "";
  art.appendChild(lazy(img, thumb(e.cover || e.podCover, 300)));
  if (rank) art.appendChild(el("div", "tag rank", "NO." + rank));
  if (e.plays){
    var pl = el("div", "plays");
    pl.innerHTML = '<svg><use href="#i-play-count"/></svg>';
    pl.appendChild(el("span", null, fmtCount(e.plays)));

  n.appendChild(el("div", "st", (e.podTitle || "") + (e.dur ? "  ·  " + fmtDur(e.dur) : "")));
  tap(n, function(){ openEp(e); });
  return n;
}

var stack = [];
var curTab = "disc";



function clearView(v){
  if (!v) return;
  var keep = null, kids = Array.prototype.slice.call(v.childNodes);
  for (var i = 0; i < kids.length; i++){
    var n = kids[i];
    if (n && n.id === "topbar") keep = n;
    else if (n && n.parentNode === v) v.removeChild(n);
  }
  if (keep){
    if (keep.parentNode !== v) v.insertBefore(keep, v.firstChild);
    else if (v.firstChild !== keep) v.insertBefore(keep, v.firstChild);
  }
}

function mountTopbar(name){
  var tb = $("#topbar");
  if (!tb) return;
  var sel = name ? '#views .view[data-view="' + name + '"]' : "#views .view.on";
  var v = document.querySelector(sel) || document.querySelector("#views .view.on");
  if (!v) return;
  if (tb.parentNode !== v) v.insertBefore(tb, v.firstChild);
  else if (v.firstChild !== tb) v.insertBefore(tb, v.firstChild);
}
function switchTab(name, silent){
  curTab = name;
  $$("#views .view").forEach(function(v){ v.classList.toggle("on", v.getAttribute("data-view") === name); });
  $$("#tabbar button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-tab") === name); });
  mountTopbar(name);
  $("#topbar").classList.remove("solid");
  if (name === "disc") renderDisc();
  if (name === "sub") renderSub();
  if (name === "mine") renderMine();
  if (name === "search" && !silent) setTimeout(function(){ renderSearchIdle(); }, 0);
}

  b.addEventListener("click", function(){ switchTab(b.getAttribute("data-tab")); });

function syncPanelFlag(){
  var on = false;
  for (var i = 0; i < stack.length; i++){
    if (stack[i].tag && stack[i].tag.indexOf("p") === 0 && stack[i].tag !== "player") on = true;
  }
  HOST.classList.toggle("panel-open", on);
}
function pushLayer(closeFn, tag){
  stack.push({ close: closeFn, tag: tag || "" });
  try{ history.pushState({ xz: stack.length }, "", "#" + (tag || "p") + stack.length); }catch(e){}
  syncPanelFlag();
}
function popTop(){
  var top = stack.pop();
  if (top && top.close){ try{ top.close(); }catch(e){} }
  syncPanelFlag();
  unstick();
  return !!top;
}
/* 返回之后页面滑不动，基本都是上一层留了点东西没收干净：
   下拉收起播放页时被系统手势打断，内联 transform 就永远钉在元素上；
   弹层的遮罩是 position:fixed inset:0，只要 .on 还在就吃掉所有触摸。
   与其逐个去猜是哪一处漏了，不如每次退栈都按当前栈的真实状态重新对一遍。 */
function unstick(){
  var fp = $("#fullPlayer");
  if (fp && fp.style.transform) fp.style.transform = "";
  var hasSheet = false, hasPlayer = false;
  for (var i = 0; i < stack.length; i++){
    if (stack[i].tag === "sheet") hasSheet = true;
    if (stack[i].tag === "player") hasPlayer = true;
  }
  if (!hasSheet){
    var sh = $("#sheet"), mk = $("#sheetMask");
    if (sh) sh.classList.remove("on");
    if (mk) mk.classList.remove("on");
    sheetOpen = false;
  }
  if (!hasPlayer && fp) fp.classList.remove("on");
  if (!stack.length){
    panelZ = 60;
    $$(".panel").forEach(function(n){ n.classList.remove("on"); n.style.zIndex = ""; });
    resetTopUrl();          /* 回到顶层就把 #hash 洗掉，宿主靠 URL 判断是不是首页 */
  }
}
function closeLayer(){
  if (!stack.length) return;
  try{ history.back(); }catch(e){ popTop(); }
}
window.addEventListener("popstate", function(){
  if (stack.length) popTop();
  else unstick();
});
/* 从后台切回来时也对一遍：息屏 / 切 App 同样会打断手势 */
document.addEventListener("visibilitychange", function(){
  if (!document.hidden) unstick();
});
/* 起手把地址洗成无 hash 的首页：上次退出时可能停在 #pEp2 这种地址上，
   不清掉的话宿主会一直认为「当前不是首页」，返回键永远退不出去。 */
function resetTopUrl(){
  try{
    if (location.hash) history.replaceState({ xz: 0 }, "", location.href.split("#")[0]);
  }catch(e){}
}
try{ history.replaceState({ xz: 0 }, "", location.href.split("#")[0]); }catch(e){}

/* ============================================================
   宿主全屏 / 返回键
   ------------------------------------------------------------
   宿主 HomeWebController.handleBack 的规则（影院、网易云那两份已经跑通）：
     ① WebView 没有 history              → 交回原生（= 退出全屏）
     ② 当前 URL == 站点配置里的 homePage  → 不 goBack，交回原生
        （忽略 _fm_reload / _fm_restore 两个参数，其余逐字比）
     ③ 上一条 history 跨站点              → 交回原生
     ④ 其余                               → webView.goBack()
   而且宿主会先回调页面注册的 onBack，返回 true 表示页面自己消化了这次返回。
   所以页面的责任就两件：注册 onBack；回到顶层时让 URL 和 homePage 逐字一致。
   ============================================================ */

/* 刷新 / 同页重载 -> 一次性恢复 edge 全屏
   三种明确动作会恢复全屏：
   1) App 宿主右上刷新：navigation.type === "reload"
   2) 资源库再次选择当前同一页面：URL 带 _fm_reload
   3) HTML 页面自己的刷新按钮：requestEdgeForExplicitRefresh()

   普通 focus / resume / visibilitychange / back_forward 均不触发，
   避免用户边缘退出全屏后又被生命周期拉回去。 */
var _reloadShouldEnterEdge = (function(){
  try{
    var navEntry = (performance.getEntriesByType && performance.getEntriesByType("navigation")[0]) || null;
    var navType = navEntry ? String(navEntry.type || "") :
      (performance.navigation && performance.navigation.type === 1 ? "reload" :
       performance.navigation && performance.navigation.type === 2 ? "back_forward" : "navigate");
    if (navType === "back_forward") return false;
    if (navType === "reload") return true;
    if (/(?:^|[?&])_fm_reload=/.test(String(location.search || ""))) return true;
  }catch(e){}
  return false;
})();

var _reloadEdgeApplied = false, _reloadEdgeTries = 0;

function reloadChromeUi(){
  try{
    if (window.fongmi && window.fongmi.ui && typeof window.fongmi.ui.setChrome === "function"){
      return window.fongmi.ui;
    }
  }catch(e){}
  try{
    if (window.fm && window.fm.ui && typeof window.fm.ui.setChrome === "function"){
      return window.fm.ui;
    }
  }catch(e){}
  return null;
}

function enterEdgeAfterReloadOnce(){
  if (!_reloadShouldEnterEdge || _reloadEdgeApplied) return;
  _reloadEdgeTries++;
  try{
    var ui = reloadChromeUi();
    if (ui){
      var light = CFG.mode !== "light";
      var r = ui.setChrome({
        mode: "edge",
        statusBarStyle: light ? "light" : "dark",
        navigationBarStyle: light ? "light" : "dark"
      });
      _reloadEdgeApplied = true;
      _reloadShouldEnterEdge = false;
      if (r && r["catch"]) r["catch"](function(){});
      try{ console.log("[chrome] 小宇宙刷新/同页重载 -> edge 全屏"); }catch(e2){}
      return;
    }
  }catch(e){}

  /* SDK 可能比 fm.req 晚一点，有限等待 15 秒；绝不挂到生命周期事件。 */
  if (_reloadEdgeTries < 60) setTimeout(enterEdgeAfterReloadOnce, 250);
}

function requestEdgeForExplicitRefresh(){
  _reloadShouldEnterEdge = true;
  _reloadEdgeApplied = false;
  _reloadEdgeTries = 0;
  enterEdgeAfterReloadOnce();
}

try{
  window.addEventListener("fmsdk", function(){
    enterEdgeAfterReloadOnce();
  });
}catch(e){}

/* 宿主返回键 / 边缘返回：true = 页面自己处理了，宿主什么都不做 */
function handleBack(){
  if (stack.length){ closeLayer(); return true; }
  resetTopUrl();
  return false;                       /* 顶层不拦，交给宿主去退出全屏 */
}
window.handleBack = handleBack;
window.__onBackPressed = function(){ try{ return handleBack(); }catch(e){ return false; } };
window.__xzBack = window.__onBackPressed;

/* fm 桥是宿主异步注入的，一次绑不上就接着试，别静默放弃 —— 绑不上的话
   宿主只能退回默认的 goBack，装了多个 html 时首页返回会跳到上一个页面。 */
var _backBound = false, _backTries = 0;
function bindHostBack(){
  if (_backBound) return;
  _backTries++;
  try{
    var ui = window.fm && window.fm.ui;
    if (ui && typeof ui.onBack === "function"){
      ui.onBack(function(){ return handleBack(); });
      _backBound = true;
      try{ console.log("[back] 已绑定宿主返回回调"); }catch(e3){}
      return;
    }
  }catch(e){}
  if (_backTries < 60) setTimeout(bindHostBack, 250);   /* 最多试 15 秒 */
}

/* 五个面板在 CSS 里 z-index 全是 60，谁在 DOM 里靠后谁就压在上面。
   pPod 写在 pList 前面，于是从榜单列表里点开一档播客时，播客页是开了，
   却被列表页整个盖住 —— 表现就是「点了没反应」；再按返回，关掉的是那层
   看不见的播客页，屏幕毫无变化，又像是「返回也失灵」。两个症状同一个根。
   改成开一层抬一层，谁最后开谁在最上面。 */
var panelZ = 60;
function openPanel(id, tag){
  var p = $("#" + id);
  if (!p) return;
  panelZ = Math.min(panelZ + 1, 82);   /* 上限压在播放页(90)之下 */
  p.style.zIndex = String(panelZ);
  p.classList.add("on");
  var body = p.querySelector(".panel-body");
  if (body) body.scrollTop = 0;
  pushLayer(function(){
    p.classList.remove("on");
    p.style.zIndex = "";
    panelZ = Math.max(60, panelZ - 1);
  }, tag || id);
}
$$("[data-close]").forEach(function(b){

});

  if (!body || !head) return;
  body.addEventListener("scroll", function(){

/* 横滑切底栏。要绕开三类区域：横向滚动的卡片轨、chips、以及任何面板开着
   的时候（面板自己有返回手势）。判定要求横向位移明显大于纵向，避免把
   斜着滚列表误判成切页。 */
(function(){
  var TABS = ["disc", "sub", "search", "mine"];
  var host = $("#views");
  var x0 = 0, y0 = 0, live = false, decided = false, isX = false;
  function blocked(t){
    for (var n = t; n && n !== host; n = n.parentNode){
      if (!n.classList) continue;
      if (n.classList.contains("rail") || n.classList.contains("chips") ||
          n.classList.contains("sh-grid") || n.classList.contains("jx-out")) return true;
    }
    return false;
  }
  host.addEventListener("touchstart", function(e){
    live = false;
    if (stack.length) return;                        /* 有面板 / 弹层就不接管 */
    if (!e.touches || e.touches.length !== 1) return;
    if (blocked(e.target)) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    live = true; decided = false; isX = false;
  }, { passive: true });
  host.addEventListener("touchmove", function(e){
    if (!live || !e.touches || !e.touches.length) return;
    var dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if (!decided && (Math.abs(dx) > 12 || Math.abs(dy) > 12)){
      decided = true;
      isX = Math.abs(dx) > Math.abs(dy) * 1.5;
      if (!isX) live = false;                        /* 认定是在竖着滚，放手 */
    }
  }, { passive: true });
  host.addEventListener("touchend", function(e){
    if (!live || !isX) { live = false; return; }
    live = false;
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 64 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    var i = TABS.indexOf(curTab);
    if (i < 0) return;
    var j = dx < 0 ? i + 1 : i - 1;
    if (j < 0 || j >= TABS.length) return;           /* 到头了就不循环，免得转向 */
    switchTab(TABS[j]);
  });
  host.addEventListener("touchcancel", function(){ live = false; });
})();

});

function posSave(eid, sec, dur){
  if (!eid || !isFinite(sec)) return;
  var m = LS.get(K.pos, {}) || {};
  m[eid] = { t: Math.floor(sec), d: Math.floor(dur || 0), at: now() };
  /* 只留最近 300 条，别把 localStorage 撑爆 */
  var keys = [];
  for (var k in m){ if (m.hasOwnProperty(k)) keys.push(k); }
  if (keys.length > 300){
    keys.sort(function(a, b){ return (m[b].at || 0) - (m[a].at || 0); });
    var m2 = {};
    for (var i = 0; i < 300; i++) m2[keys[i]] = m[keys[i]];
    m = m2;
  }
  LS.set(K.pos, m);
}

}

var discLoaded = false;

/* 一块内容 = 骨架 → 重试两次 → 成功就画，失败留一个「重试」按钮。
   之前整页共用一次请求，任何一处失败就整屏空白，只能靠用户自己刷新。 */
/* 整栏延后加载：栏目滚到跟前才发请求。
   给「热门播客 / 新锐播客」用 —— 它们在首屏之下，却要下这个仓库里
   最大的两份文件，放在启动时下纯粹是跟「点进单集」抢带宽。
   没有 IntersectionObserver 就退回立刻加载；有也留 12 秒兜底，
   免得因为布局问题一直停在骨架上。 */
var SEC_IO = null;
try{
  if (window.IntersectionObserver){
    SEC_IO = new IntersectionObserver(function(ents){
      for (var i = 0; i < ents.length; i++){
        if (!ents[i].isIntersecting) continue;
        var n = ents[i].target;
        SEC_IO.unobserve(n);
        var f = n.__secRun;
        n.__secRun = null;
        if (f) f();
      }
    }, { rootMargin: "300px 0px" });
  }
}catch(e){ SEC_IO = null; }

function lazySec(sec, skel, load, paint, defer){
  var box = el("div");
  sec.appendChild(box);
  function run(){
    box.innerHTML = "";
    box.appendChild(skel());
    X.retryReq(load, 2, 600).then(function(d){
      box.innerHTML = "";
      paint(box, d, run);
    })["catch"](function(err){
      box.innerHTML = "";
      var msg = (err && err.message) || "网络不通";
      var eb = emptyBox("这一栏没取到", msg, "重试", run);
      var dg = el("div", "sec-note");
      dg.style.textAlign = "center";
      dg.style.color = "var(--accent)";
      dg.setAttribute("role", "button");
      dg.textContent = "跑一次网络自检 →";
      dg.addEventListener("click", sheetDiag);
      eb.appendChild(dg);
      box.appendChild(mini(eb));
    });
  }
  if (defer && SEC_IO){
    box.appendChild(skel());
    box.__secRun = run;
    SEC_IO.observe(box);
    setTimeout(function(){
      if (!box.__secRun) return;          /* 已经被滚动触发过了 */
      box.__secRun = null;
      try{ SEC_IO.unobserve(box); }catch(e){}
      run();
    }, 12000);
    return run;
  }
  run();
  return run;
}

/* =========================================================================
   网络自检
   ---------------------------------------------------------------------
   「没取到」有太多种可能：镜像被墙、上游改版、宿主没放行、只是这一次超时。
   与其让人对着一句错误提示猜，不如把每个源单独试一遍，把结果摊开。
   ========================================================================= */
function xrHostLabel(h){
  try{
    var host = String(h || "").replace(/^https?:\/\//i, "").split("/")[0];
    if (!host) return "榜单 · 公共镜像";
    if (host.indexOf("jsdelivr") >= 0) return "榜单 · jsDelivr";
    if (host === "raw.githubusercontent.com") return "榜单 · GitHub 直连";
    return "榜单 · " + host;
  }catch(e){ return "榜单 · 公共镜像"; }
}
function diagTargets(){
  var hs = X.XR_HOSTS || [];
  var out = [];
  /* 自检用较小的 hot_episodes_new.json，避免为探活去拉近 10 MB 的完整播客榜。 */
  if (X.XR_PRIMARY){
    out.push({ name: "榜单 · 自定义源", url: X.XR_PRIMARY + "hot_episodes_new.json", kind: "json" });
  }
  for (var i = 0; i < hs.length; i++){
    out.push({ name: xrHostLabel(hs[i]), url: hs[i] + "hot_episodes_new.json", kind: "json" });
  }
  out.push({ name: "小宇宙 · 网页", url: X.WEB_BASE + "/podcast/6021f949a789fca4eff4492c", kind: "ssr" });
  out.push({ name: "小宇宙 · 官方 RSS", url: "https://feed.xyzfm.space/hwen8wf69c6g", kind: "xml" });
  out.push({ name: "Apple · 中国区榜单", url: "https://rss.marketingtools.apple.com/api/v2/cn/podcasts/top/10/podcasts.json", kind: "json" });
  return out;
}
function sheetDiag(){
  showSheet(function(s){
    sheetTitle(s, "网络自检 · " + X.BUILD, "把每个数据源单独试一遍。结果只说明这台设备此刻的情况，" +
      (X.isNative() ? "当前在宿主里跑，走的是原生请求。" : "当前在浏览器里跑，跨域会挡掉一部分源。"));
    var box = el("div");
    s.appendChild(box);
    var list = diagTargets();
    var rows = [];
    for (var i = 0; i < list.length; i++){
      (function(t){
        var n = el("div", "sh-item");
        var l = el("div", "l");
        l.appendChild(el("div", null, t.name));
        var d = el("div", "d", "排队中…");
        l.appendChild(d);
        n.appendChild(l);
        var tag = el("div", "chk");
        tag.style.opacity = "1";
        tag.textContent = "…";
        n.appendChild(tag);
        box.appendChild(n);
        rows.push({ t: t, d: d, tag: tag, n: n });
      })(list[i]);
    }
    /* 串行跑，避免一次并发把弱网压垮，读数也更接近真实体感 */
    (function run(i){
      if (i >= rows.length) return;
      var r = rows[i];
      r.d.textContent = "正在试…";
      var t0 = now();
      var dh = X.webHdr();
      if (r.t.kind === "json") dh["Accept"] = "application/json,text/plain,*/*";
      X.xfull(r.t.url, { headers: dh, timeout: 12 })
        .then(function(res){
          var ms = now() - t0;
          var len = (res.text || "").length;
          var ok = len > 40;
          var why = "";
          if (ok && r.t.kind === "json"){
            var j = X.safeParse(res.text);
            if (!j) { ok = false; why = "回来了但不是 JSON"; }
          }
          if (ok && r.t.kind === "ssr" && res.text.indexOf("__NEXT_DATA__") < 0){
            ok = false; why = "页面里没有数据块";
          }
          if (!ok && !why) why = len ? "只回了 " + len + " 字节" : "没有任何响应";
          r.tag.textContent = ok ? "通" : "不通";
          r.tag.style.color = ok ? "var(--ok)" : "var(--danger)";
          r.d.textContent = ok ? (ms + " ms　·　" + fmtSize(len)) : why + "　·　" + ms + " ms";
          run(i + 1);
        })["catch"](function(){
          r.tag.textContent = "不通";
          r.tag.style.color = "var(--danger)";
          r.d.textContent = "请求直接失败";
          run(i + 1);
        });
    })(0);

    var tip = el("div", "hint");
    tip.style.paddingTop = "10px";
    tip.textContent = "读法：榜单源只要有一条通，发现页就有内容。小宇宙那两条不通只影响评论和逐字稿，" +
      "不影响播放。全部不通基本就是这台设备出不去网。若用浏览器直接打开本地 HTML 文件，有的浏览器会拦截跨域请求，可改用本地静态服务器或宿主 App。";
    s.appendChild(tip);
  });
}

/* =========================================================================
   跨源解析：把任意来源的卡片变成可播、可打开的对象
   ========================================================================= */
/* RSS 里按标题找回同一集：榜单给的标题和订阅源里的完全一致的情况居多，
   宽松匹配一下（去掉空格和标点）能兜住绝大多数改过排版的。 */
function loosen(s){ return String(s || "").toLowerCase().replace(/[\s\u3000\-—·|:：,，.。!！?？"'""'']/g, ""); }
function epFromFeed(feed, title, fallback){
  return X.AP.feed(feed).then(function(r){
    var want = loosen(title), best = null;
    for (var i = 0; i < r.eps.length; i++){
      var t = loosen(r.eps[i].title);
      if (t === want){ best = r.eps[i]; break; }
      if (!best && want && (t.indexOf(want) >= 0 || want.indexOf(t) >= 0)) best = r.eps[i];
    }
    if (!best) throw new Error("这档播客的 RSS 里没找到这一集");
    /* 榜单已有的播放量 / 评论数比 RSS 全，留着显示 */
    if (fallback){
      best.plays = best.plays || fallback.plays || 0;
      best.comments = best.comments || fallback.comments || 0;
      best.cover = best.cover || fallback.cover || "";
    }
    return best;
  });
}
/* 两条详情链路并发时，谁先成功就先用谁；另一条不会取消，
   它继续在后台把 MEM/EPC 缓存和评论补齐，下一次打开就直接命中本地。 */
function firstEpisodeResult(tasks){
  return new Promise(function(resolve, reject){
    var left = tasks.length, done = false, lastErr = null;
    if (!left){ reject(new Error("没有可用的单集详情链路")); return; }
    function fail(err){
      lastErr = err || lastErr;
      left--;
      if (!done && left <= 0) reject(lastErr || new Error("单集详情获取失败"));
    }
    for (var i = 0; i < tasks.length; i++){
      tasks[i].then(function(v){
        if (done) return;
        if (v && (v.title || v.audio)){
          done = true;
          resolve(v);
          return;
        }
        fail(new Error("这条详情链路没有返回可用内容"));
      }, fail);
    }
  });
}

function mergeFastFeedEpisode(feedEp, card){
  var out = feedEp || {};
  /* RSS 负责“先能看、先能播”；身份仍保留小宇宙 eid，
     后面的评论/逐字稿才能继续用官方接口补全。 */
  out.src = "xr";
  out.eid = card.eid || out.eid;
  out.pid = card.pid || out.pid || "";
  out.feed = card.feed || out.feed || "";
  out.podId = card.podId || out.podId || "";
  out.podTitle = out.podTitle || card.podTitle || "";
  out.podAuthor = out.podAuthor || card.podAuthor || "";
  out.cover = out.cover || card.cover || "";
  out.podCover = out.podCover || card.podCover || out.cover || "";
  out.dur = out.dur || card.dur || 0;
  out.pub = out.pub || card.pub || "";
  out.plays = card.plays || out.plays || 0;
  out.comments = card.comments || out.comments || 0;
  out.genre = card.genre || out.genre || "";
  out.rank = card.rank || out.rank || 0;
  out._fastFeed = true;
  return out;
}

function resolveEp(e){
  if (!e) return Promise.reject(new Error("没有这条目"));
  if (e.src === "rss") return Promise.resolve(e);
  /* 从播客页列表点进来的单集，手上已经有可播的直链了（SSR / RSS 都带
     enclosure）。再去请求一次单集详情只是为了补 shownotes 和评论 ——
     那一步失败不该连累播放。补不到就用手上这份，至少能听。 */
  var have = e.audio ? e : null;
  function keep(err){
    if (have) return have;
    throw err;
  }
  if (e.src === "xr"){
    var viaFeed = function(){
      if (!e.feed) return Promise.reject(new Error("这一集取不到，而且榜单里没给这档播客的 RSS"));
      return epFromFeed(e.feed, e.title, e).then(function(feedEp){
        return mergeFastFeedEpisode(feedEp, e);
      });
    };

    if (!e.eid) return Promise.resolve().then(viaFeed)["catch"](keep);

    /* v1.13 快车道：
       榜单记录若已带 feed，官方详情和 RSS 不必串行。
       官方接口/SSR 与 RSS 同时起跑，谁先回来就先把页面交给用户。 */
    if (e.feed){
      var official = API.episode(e.eid);
      var rssFast = Promise.resolve().then(viaFeed);
      return firstEpisodeResult([official, rssFast])["catch"](keep);
    }

    return API.episode(e.eid)["catch"](keep);
  }
  if (e.src === "em"){
    return X.EM.resolve("ep", e.emId).then(function(m){
      if (m.kind !== "ep") throw new Error("这张卡指向的是播客，不是单集");
      return API.episode(m.id);
    });
  }
  if (e.eid && String(e.eid).indexOf("rss:") === 0) return Promise.resolve(e);
  if (e.eid) return API.episode(e.eid)["catch"](keep);
  if (have) return Promise.resolve(have);
  return Promise.reject(new Error("这条目缺少 id"));
}
/* 播客侧：小宇宙 / EarsOnMe / Apple / 裸 RSS 四种入口，最后都归到
   {pod, eps, paged} —— paged 为真表示走小宇宙的游标翻页。 */
function preparePod(p){
  if (p.src === "xr"){
    /* 三条路，都不需要凭证：
         viaXz   小宇宙网页 SSR —— 任何一档都能走（pid 在榜单里 100% 有效），
                 但页面里只内嵌最新十几集，再往前翻要登录。
         viaFeed 官方 RSS（feed.xyzfm.space）—— 小宇宙自家转码，和网页上是
                 同一个文件，而且能一次拿到全部历史。榜单里近一半播客没有
                 这一项（它取自 Apple 目录，小宇宙独占的节目天然没有）。
         viaApple 按名字去 Apple 搜同名订阅源，最后一根稻草。
       之前把 viaXz 锁在「有凭证」后面是错的 —— API.podcast 自带 SSR 兜底，
       没凭证一样能走。缺 RSS 的播客就是卡在这儿打不开的。 */
    var viaXz = function(){
      if (!p.pid) return Promise.reject(new Error("榜单里没给这档播客的小宇宙 id"));
      return API.podcast(p.pid).then(function(pod){
        pod.cover = pod.cover || p.cover;
        pod.title = pod.title || p.title;
        return { pod: pod, eps: null, paged: true };
      });
    };
    var viaFeed = function(){
      if (!p.feed) return Promise.reject(new Error("这档播客没有公开的 RSS"));
      return X.AP.feed(p.feed).then(function(r){
        r.pod.cover = p.cover || r.pod.cover;
        r.pod.title = r.pod.title || p.title;
        r.pod.author = r.pod.author || p.author;
        if (p.pid) r.pod.xzPid = p.pid;
        return { pod: r.pod, eps: r.eps, paged: false };
      });
    };
    var viaApple = function(){
      return X.AP.search(p.title).then(function(list){
        var want = String(p.title || "");
        var hit = null;
        for (var i = 0; i < list.length; i++){
          if (list[i].feed && (list[i].title === want || list[i].title.indexOf(want) >= 0)){ hit = list[i]; break; }
        }
        if (!hit) return Promise.reject(new Error("Apple 上也没找到同名的订阅源"));
        return X.AP.feed(hit.feed).then(function(r){
          r.pod.cover = p.cover || r.pod.cover;
          r.pod.title = r.pod.title || p.title;
          return { pod: r.pod, eps: r.eps, paged: false };
        });
      });
    };
    /* 自家 RSS 优先（同一份转码 + 全部历史）；有凭证时官方接口能翻页，
       比 RSS 还全，所以排前面。第三方托管的 RSS（喜马拉雅、荔枝之类）
       是另一个文件，码率未必一样，排到 SSR 后面。 */
    var mine = /xyzfm\.space/.test(p.feed || "");
    var chain;
    if (p.pid && TK.has()) chain = [viaXz, viaFeed, viaApple];
    else if (mine) chain = [viaFeed, viaXz, viaApple];
    else chain = [viaXz, viaFeed, viaApple];
    return chain.reduce(function(acc, fn){
      return acc ? acc["catch"](function(){ return fn(); }) : Promise.resolve().then(fn);
    }, null);
  }
  var feed = p.feed || (String(p.pid || "").indexOf("rss:") === 0 ? String(p.pid).slice(4) : "");
  if (p.src === "rss" || feed){
    return X.AP.feed(feed).then(function(r){
      if (p.cover) r.pod.cover = r.pod.cover || p.cover;
      return { pod: r.pod, eps: r.eps, paged: false };
    });
  }
  if (p.src === "ap"){
    return X.AP.lookup(p.apId).then(function(x){
      if (!x.feed) throw new Error("Apple 没给出这个播客的 RSS 地址");
      return X.AP.feed(x.feed).then(function(r){
        r.pod.title = r.pod.title || x.title;
        r.pod.cover = r.pod.cover || x.cover;
        r.pod.author = r.pod.author || x.author;
        return { pod: r.pod, eps: r.eps, paged: false };
      });
    });
  }
  if (p.src === "em"){
    return X.EM.resolve("pod", p.emId).then(function(m){
      if (m.kind === "ep"){
        /* 有的卡其实指向单集，直接把人送到单集页更合理 */
        var err = new Error("__EP__" + m.id);
        throw err;
      }
      return API.podcast(m.id).then(function(pod){ return { pod: pod, eps: null, paged: true }; });
    });
  }
  return API.podcast(p.pid).then(function(pod){ return { pod: pod, eps: null, paged: true }; });
}

}
$$("#sSeg button").forEach(function(b){
  b.addEventListener("click", function(){

});

var sInput = $("#sInput"), sBox = $("#sbox");
sInput.addEventListener("focus", function(){ sBox.classList.add("focus"); });
sInput.addEventListener("blur", function(){ sBox.classList.remove("focus"); });
sInput.addEventListener("input", function(){
  sBox.classList.toggle("has", !!sInput.value);
});

});

});

function kwHistory(){ return LS.get(K.kw, []) || []; }
function kwPush(k){
  var l = kwHistory(), out = [k];
  for (var i = 0; i < l.length && out.length < 14; i++) if (l[i] !== k) out.push(l[i]);
  LS.set(K.kw, out);
}
function renderSearchIdle(){
  var b = $("#sBody");
  b.innerHTML = "";
  var kws = kwHistory();
  if (kws.length){
    var s = section("搜过的词", "清空", function(){ LS.del(K.kw); renderSearchIdle(); });
    var chips = el("div", "chips");
    for (var i = 0; i < kws.length; i++){
      (function(k){
        var c = el("button", "chip", k);
        c.type = "button";
        c.addEventListener("click", function(){ sInput.value = k; sBox.classList.add("has"); doSearch(k, true); });
        chips.appendChild(c);
      })(kws[i]);
    }
    s.appendChild(chips);
    b.appendChild(s);
  }
  var s2 = section("怎么搜", null, null);
  note(s2, "① 贴小宇宙的单集/播客链接回车 → 直接打开，免登录。\n" +
    "② 填了凭证 → 搜小宇宙的单集和播客。\n" +
    "③ 没填凭证 → 自动退到 Apple 的公开播客搜索，进去读 RSS 一样能播。");
  b.appendChild(s2);
  var s3 = section("免登录也能逛", null, null);
  var g = el("div", "cat-grid");
  var entries = [["i-star", "热门播客榜", function(){ openXrTop("hot"); }], ["i-planet", "Apple 总榜", openApTop],
    ["i-refresh", "网络自检", sheetDiag],
                 ["i-chapter", "全部分类", sheetGenres], ["i-link", "粘贴链接", sheetOpenLink]];
  for (var q = 0; q < entries.length; q++){
    g.appendChild(quickCell(entries[q][0], entries[q][1], entries[q][2]));
  }
  s3.appendChild(g);
  b.appendChild(s3);
}
function doSearch(kw, reset){
  kw = String(kw || "").replace(/^\s+|\s+$/g, "");
  if (!kw){ renderSearchIdle(); return; }

  /* 先看是不是链接：是就直接进详情，省得白搜一次 */
  var link = parseLink(kw);
  if (link){
    if (link.kind === "episode") openEp({ eid: link.id });
    else openPod({ pid: link.id });
    return;
  }
  /* 短链正文里没有 id，跟一次重定向再决定去哪 */
  if (isShortLink(pickUrl(kw))){
    toast("正在解析短链…", 1500);
    resolveLink(kw).then(function(lk){
      if (!lk){ toast("这条短链没解析出小宇宙的单集或播客"); return; }
      if (lk.kind === "episode") openEp({ eid: lk.id });
      else openPod({ pid: lk.id });
    });
    return;
  }
  if (sBusy) return;
  sKw = kw;
  kwPush(kw);
  var b = $("#sBody");
  if (reset){ b.innerHTML = ""; b.appendChild(skRows(4)); }
  sBusy = true;

  /* 有凭证先走小宇宙官方搜索；没有或者搜空了，退到 Apple 的公开搜索 */
  var task = TK.has() ? API.search(kw, sKind)["catch"](function(){ return { list: [] }; })
                      : Promise.resolve({ list: [] });
  task.then(function(r){
    if (r.list && r.list.length){
      sBusy = false;
      b.innerHTML = "";
      var s = section("小宇宙 · " + (sKind === "PODCAST" ? "播客" : "单集") + " " + r.list.length + " 条", null, null);
      for (var i = 0; i < r.list.length; i++){
        s.appendChild(sKind === "PODCAST" ? podRow(r.list[i], i * 16)
                                          : epRow(r.list[i], { queue: r.list, index: i }, i * 16));
      }
      b.appendChild(s);
      return;
    }
    /* 没凭证时先在榜单里搜一遍：这批结果带小宇宙 pid，比 Apple 那路贴近得多 */
    return X.XR.search(kw)["catch"](function(){ return []; }).then(function(xl){
      if (xl.length){
        sBusy = false;
        b.innerHTML = "";
        var sx = section("中文播客榜 · " + xl.length + " 个", null, null);
        note(sx, "从榜单快照里搜的，都是小宇宙上的节目；进去有凭证走官方数据，没凭证读它自己的 RSS。");
        for (var k = 0; k < xl.length; k++) sx.appendChild(podRow(xl[k], k * 16));
        b.appendChild(sx);
        return;
      }
      return X.AP.search(kw).then(function(list){
      sBusy = false;
      b.innerHTML = "";
      if (!list.length){
        b.appendChild(emptyBox("没搜到「" + kw + "」", TK.has() ? "换个词试试"
          : "免登录时只能搜到 Apple 收录的播客；小宇宙的单集搜索是账号接口",
          TK.has() ? null : "去填凭证", TK.has() ? null : sheetToken));
        return;
      }
      var s2 = section("Apple 播客 · " + list.length + " 个", null, null);
      note(s2, TK.has()
        ? "小宇宙那边没搜到，这批是 Apple 的公开搜索结果，进去读 RSS 播放。"
        : "免登录搜索走的是 Apple 公开接口，按播客搜；进去之后读它自己的 RSS，能播能下。"
          + "想搜小宇宙的单集，得在右上角填凭证。");
      for (var j = 0; j < list.length; j++) s2.appendChild(podRow(list[j], j * 16));
      b.appendChild(s2);
      });
    });
  })["catch"](function(err){
    sBusy = false;
    b.innerHTML = "";
    b.appendChild(emptyBox("搜索失败", (err && err.message) || "网络异常", "重试", function(){ doSearch(kw, true); }));
  });
}

var PD = { p: null, list: [], key: null, busy: false, end: false, ssr: false, paged: true, shown: 0 };
function openPod(p){
  if (!p || (!p.pid && !p.emId && !p.apId && !p.feed)) return;
  PD = { p: null, list: [], key: null, busy: false, end: false, ssr: false, paged: true, shown: 0 };
  openPanel("pPod", "pPod");
  var body = $("#pPodBody");
  body.innerHTML = "";
  $("#pPodTtl").textContent = p.title || "播客";
  body.appendChild(loadingBox(p.src === "em" ? "正在解析回小宇宙…" : "正在取播客…"));

  preparePod(p).then(function(r){
    var pod = r.pod;
    PD.p = pod;
    PD.paged = r.paged;
    $("#pPodTtl").textContent = pod.title;
    body.innerHTML = "";
    body.appendChild(podHero(pod));
    var bar = el("div", "tk-bar");
    var n = el("div", "n");
    n.innerHTML = "共 <b>" + (pod.count || (r.eps ? r.eps.length : "—")) + "</b> 集" +
      (pod.src === "rss" ? "　·　来源 RSS" : "");
    bar.appendChild(n);
    body.appendChild(bar);
    var listBox = el("div");
    listBox.id = "podList";
    body.appendChild(listBox);
    if (r.paged){
      loadPodPage(true);
    } else {
      PD.list = r.eps || [];
      PD.end = true;
      showRssPage();
    }
  })["catch"](function(err){
    var msg = (err && err.message) || "网络异常";
    if (msg.indexOf("__EP__") === 0){
      closeLayer();
      setTimeout(function(){ openEp({ eid: msg.slice(6) }); }, 280);
      return;
    }
    body.innerHTML = "";
    body.appendChild(emptyBox("播客没取到", msg, "重试", function(){ openPod(p); }));
  });
}
/* RSS 一次给全部单集，几百条一次渲染会卡，按 30 条一批放 */
function showRssPage(){
  var box = $("#podList");
  if (!box) return;
  var old = box.querySelector(".more-btn");
  if (old) old.parentNode.removeChild(old);
  var start = PD.shown, stop = Math.min(PD.list.length, start + 30);
  for (var i = start; i < stop; i++){
    box.appendChild(epRow(PD.list[i], { queue: PD.list, index: i, pod: PD.p, desc: false }, (i - start) * 14));
  }
  PD.shown = stop;
  if (stop < PD.list.length){
    var btn = el("button", "more-btn", "再看 30 集（还有 " + (PD.list.length - stop) + "）");
    btn.type = "button";
    btn.addEventListener("click", showRssPage);
    box.appendChild(btn);
  } else if (!PD.list.length){
    box.appendChild(emptyBox("这份 RSS 里没有单集", "可能是订阅源改版或者只放了付费内容"));
  }
  markCurEp();
}

function loadPodPage(first){
  if (PD.busy || PD.end) return;
  PD.busy = true;
  var box = $("#podList");
  if (!box) { PD.busy = false; return; }
  var sk = skRows(3);
  box.appendChild(sk);
  API.episodes(PD.p.pid, PD.key).then(function(r){
    PD.busy = false;
    if (sk.parentNode) sk.parentNode.removeChild(sk);
    var start = PD.list.length;
    for (var i = 0; i < r.list.length; i++){
      var e = r.list[i];
      var dup = false;
      for (var j = 0; j < PD.list.length; j++) if (PD.list[j].eid === e.eid) dup = true;
      if (!dup) PD.list.push(e);
    }
    for (var q = start; q < PD.list.length; q++){
      box.appendChild(epRow(PD.list[q], { queue: PD.list, index: q, pod: PD.p, desc: false }, (q - start) * 16));
    }
    PD.key = r.key;
    PD.ssr = !!r.ssr;
    if (!PD.list.length){
      box.appendChild(emptyBox("没取到单集", "这个播客可能是空的"));
      PD.end = true;
      return;
    }
    var old = box.querySelector(".more-btn");
    if (old) old.parentNode.removeChild(old);
    if (r.key){
      var btn = el("button", "more-btn", "加载更多");
      btn.type = "button";
      btn.addEventListener("click", function(){ btn.disabled = true; loadPodPage(false); });
      box.appendChild(btn);
    } else {
      PD.end = true;
      var tip = el("div", "sec-note");
      tip.style.textAlign = "center";
      tip.textContent = PD.ssr
        ? "免登录只能拿到官网首屏这一批；填了凭证就能一直往下翻。"
        : "已经到底了";
      box.appendChild(tip);
    }
    markCurEp();
  })["catch"](function(){
    PD.busy = false;
    if (sk.parentNode) sk.parentNode.removeChild(sk);
    box.appendChild(emptyBox("这一页没取到", "点一下重试", "重试", function(){ loadPodPage(false); }));
  });
}

/* =========================================================================
   单集面板
   ========================================================================= */
var EP = { e: null, chaps: [], cmts: null };
function openEp(e, queue, index){
  if (!e || (!e.eid && !e.emId)) return;
  EP = { e: null, chaps: [], cmts: null };
  openPanel("pEp", "pEp");
  var body = $("#pEpBody");
  body.innerHTML = "";
  $("#pEpTtl").textContent = e.title || "单集";
  /* 本地已经有这一集了：一帧之后就整屏画出来，别闪一下加载条 */
  var cachedNow = (e.eid && API.episodeCached) ? API.episodeCached(e.eid) : null;
  if (!cachedNow){
    /* 榜单/列表那条记录里已经有标题、封面、播客名、时长、发布时间，够画第一屏了。
       以前是整屏空着等 SSR 页面下完 —— 那张页面连 shownotes 和二十来条热评
       一起好几百 KB，点进去的「非常慢」大半就是这段白屏。
       先把 hero 画出来，详情回来再整屏替换。 */
    if (e.title && (e.cover || e.podTitle)){
      body.appendChild(epHero(e, queue, index, true));
    }
    body.appendChild(loadingBox(e.src === "em" ? "正在解析回小宇宙…" : "正在取这一集…"));
  }

  resolveEp(e).then(function(ep){
    EP.e = ep;
    EP.chaps = extractChapters(htmlToText(ep.shownotes || ep.desc || ""));
    $("#pEpTtl").textContent = ep.title;
    body.innerHTML = "";
    body.appendChild(epHero(ep, queue, index));
    var dcNode = decisionCard(ep);
    body.appendChild(dcNode);
    /* 用的是旧缓存、而且后台正在刷：刷回来只把决策卡那几个数字换掉。
       整屏重画会把滚动位置和展开状态一起弄丢，不值当。 */
    var pend = API.episodePending && API.episodePending(ep.eid);
    if (pend) pend.then(function(fresh){
      if (!fresh || !fresh.title) return;
      if (!EP.e || EP.e.eid !== fresh.eid) return;        /* 已经翻到别的单集了 */
      if (!dcNode.parentNode) return;                      /* 这一屏已经被重画过 */
      EP.e = fresh;
      try{ dcNode.parentNode.replaceChild(decisionCard(fresh), dcNode); }catch(e2){}
    });
    /* 音频来源卡默认不出：日常听的时候没人看它，它占的是简介和热评的位置。
       付费 / 私有集例外，理由见 AUDIO_CARD 那里。 */
    if (AUDIO_CARD === "always" || (AUDIO_CARD === "paid" && epNeedsUnlock(ep))){
      body.appendChild(audioCard(ep));
    }

    if (EP.chaps.length){
      var sc = section("章节 · " + EP.chaps.length + " 段", null, null);
      note(sc, "章节来自主播写在 shownotes 里的时间戳，点一下直接跳到那一段。");
      var cb = el("div", "chaps");
      for (var i = 0; i < EP.chaps.length; i++){
        (function(c, idx){
          var n = el("div", "chap");
          n.setAttribute("role", "button");
          n.style.animationDelay = Math.min(idx * 14, 220) + "ms";
          n.appendChild(el("div", "ts", c.ts));
          n.appendChild(el("div", "tx", c.title));
          tap(n, function(){ playFrom(ep, c.sec); });
          cb.appendChild(n);
        })(EP.chaps[i], i);
      }
      sc.appendChild(cb);
      body.appendChild(sc);
    }

    /* shownotes 原文 */
    var sn = section("节目简介", null, null);
    var notes = el("div", "notes");
    if (ep.shownotes){
      notes.innerHTML = sanitize(ep.shownotes);
      bindNoteLinks(notes, ep);
    } else {
      notes.appendChild(el("p", null, ep.desc || "（这一集没有写简介）"));
    }
    sn.appendChild(notes);
    body.appendChild(sn);

    /* 评论：只有小宇宙的单集有；RSS 来源没有评论体系 */
    if (ep.src === "rss"){
      var sr = section("来源", null, null);
      note(sr, "这一集来自播客自己的 RSS（Apple 榜单那一路），所以没有小宇宙的播放量、评论和官方逐字稿；" +
        "音频、简介、章节都是订阅源里带的。想要互动数据，用搜索或粘链接打开小宇宙上的同一集。");
      body.appendChild(sr);
      return;
    }
    var scm = section("热评", null, null);
    body.appendChild(scm);
    var cbox = el("div");
    scm.appendChild(cbox);
    cbox.appendChild(loadingBox("正在取评论…"));
    API.comments(ep.eid).then(function(cm){
      EP.cmts = cm;
      cbox.innerHTML = "";
      if (!cm.list.length){ cbox.appendChild(emptyBox("还没有评论", "或者评论接口没给数据")); return; }
      var head = scm.querySelector(".sec-title span");
      if (head) head.textContent = "热评 · " + (cm.total || cm.list.length) + " 条";
      if (cm.ssr) note(scm, "免登录只拿得到首屏这 " + cm.list.length + " 条热评；填了凭证能取全量。");
      for (var i = 0; i < cm.list.length; i++) cbox.appendChild(cmtRow(cm.list[i], i * 14));
    })["catch"](function(){
      cbox.innerHTML = "";
      cbox.appendChild(emptyBox("评论没取到", "接口可能变了"));
    });
  })["catch"](function(err){
    body.innerHTML = "";
    body.appendChild(emptyBox("这一集没取到", (err && err.message) || "网络异常"));
  });
}

/* 决策卡：对应 juicer 的「值不值得听」那一屏。
   只放接口给得出的客观量，不编主观结论；判断句也标明是按什么算的。 */
/* 音频来源卡：这一集到底从哪拿的音频、是不是小宇宙那份原始转码。
   查完一圈下载器项目才敢这么写 —— 小宇宙只有一档转码，没有高低音质可选，
   所以这里能给的最有用的信息不是「切换音质」，而是「你现在这条是不是正主」。 */
/* 音频来源卡什么时候出。
   "paid"   只在付费 / 私有集出（默认）—— 那张卡里的解锁按钮是必需品
   "never"  永远不出
   "always" 恢复成原来每集都出 */
var AUDIO_CARD = "paid";

/* 这一集是不是「标着私有、但手上这条还只是公开试听」，
   也就是需要用账号去换完整签名地址的那种。判定和卡片里那段保持一致。 */
function epNeedsUnlock(ep){
  if (!ep || !ep.priv) return false;
  var a = ep.fullAudio || ep.audio || "";
  var fullPaid = !!(ep.audioAccess === "full" || /\/\/(pmedia|private-media)\.xyzcdn\.net/.test(a));
  return !fullPaid;
}

function audioCard(ep){
  var shownAudio = ep.fullAudio || ep.audio || "";
  var k = X.audioKind(shownAudio);
  var fullPaid = !!(ep.audioAccess === "full" || /\/\/(pmedia|private-media)\.xyzcdn\.net/.test(shownAudio));
  var preview = !!(ep.priv && !fullPaid);
  var wrap = el("div", "jx-out");
  wrap.style.fontFamily = "var(--font-body)";
  wrap.style.fontSize = "12.5px";
  wrap.style.whiteSpace = "normal";

  var head = el("div");
  head.style.display = "flex";
  head.style.alignItems = "center";
  head.style.gap = "7px";
  head.style.marginBottom = "6px";
  var dot = el("span");
  dot.style.cssText = "width:7px;height:7px;border-radius:50%;flex:none;background:" +
    (preview ? "var(--danger)" : k.best ? "var(--ok)" : "var(--gold)");
  head.appendChild(dot);
  var t = el("b", null, fullPaid ? "完整付费音源" : (preview ? "可能是试听片段" : (k.best ? "原始音质" : "非小宇宙源")));
  t.style.color = "var(--text-0)";
  head.appendChild(t);
  wrap.appendChild(head);

  var line = el("div", null, preview ? "这集标记为私有内容；普通 enclosure 可能只是试听，需要账号另取完整签名地址。" : k.label);
  line.style.color = "var(--text-1)";
  wrap.appendChild(line);

  /* 有体积就顺手把码率算出来 —— 这是唯一能客观说明音质的数字 */
  if (ep.asize && ep.dur){
    var kbps = Math.round(ep.asize * 8 / ep.dur / 1000);
    var d = el("div", null, fmtSize(ep.asize) + "　·　约 " + kbps + " kbps");
    d.style.cssText = "color:var(--text-2);margin-top:4px;font-family:var(--font-num)";
    wrap.appendChild(d);
    var d2 = el("div", null, "按元数据里的体积 ÷ 时长算的，不同节目上传的原始文件本来就不一样。");
    d2.style.cssText = "color:var(--text-2);margin-top:3px;font-size:11.5px";
    wrap.appendChild(d2);
  }
  if (fullPaid){
    var w = el("div", null, "已通过账号换到完整签名地址。地址通常约 4 小时过期，页面会在需要时重新解析。");
    w.style.cssText = "color:var(--text-2);margin-top:6px";
    wrap.appendChild(w);
  } else if (preview){
    var wp = el("div", null, TK.has()
      ? "播放时会先调用 /v1/private-media/get 解析完整音源；若账号未购买或凭证不匹配，会停止并明确提示，不再误播 10 秒试听。"
      : "请先配置小宇宙登录凭证。未登录时不能取得完整付费音源，也不会把公开试听误当成完整节目。");
    wp.style.cssText = "color:var(--text-2);margin-top:6px";
    wrap.appendChild(wp);
  } else if (!k.best && k.src === "3rd"){
    var w2 = el("div", null, "这档播客在榜单里登记的是第三方托管的订阅源，和小宇宙那份是两个文件，码率可能不同。想要小宇宙原版，用搜索或粘链接从小宇宙那边打开同一集。");
    w2.style.cssText = "color:var(--text-2);margin-top:6px";
    wrap.appendChild(w2);
  }
  if (shownAudio){
    var out = el("div");
    out.style.cssText = "margin-top:8px;color:var(--text-2);line-height:1.7";
    wrap.appendChild(out);

    var chk = el("button", "more-btn", "体检这条直链");
    chk.type = "button";
    chk.style.marginTop = "10px";
    chk.addEventListener("click", function(){
      chk.disabled = true;
      out.textContent = "正在问服务端要文件信息…";
      X.audioProbe(ep.fullAudio || ep.audio).then(function(r){
        chk.disabled = false;
        out.innerHTML = "";
        if (!r.gotHeaders){
          out.appendChild(el("div", null, "读不到响应头（浏览器里跨域会挡掉，宿主里才看得到）。HTTP " + (r.status || "无响应")));
          return;
        }
        var rows = [];
        rows.push("HTTP " + r.status + (r.ranged ? "　·　支持分段请求" : "　·　不支持分段请求"));
        if (r.type) rows.push("类型 " + r.type);
        if (!r.total){

/* shownotes 里主播写的东西不能直接 innerHTML —— 去掉脚本和事件属性 */
function sanitize(html){
  var s = String(html || "");
  s = s.replace(/<script[\s\S]*?<\/script>/gi, "");
  s = s.replace(/<style[\s\S]*?<\/style>/gi, "");
  s = s.replace(/<iframe[\s\S]*?<\/iframe>/gi, "");
  s = s.replace(/ on[a-z]+\s*=\s*"[^"]*"/gi, "");
  s = s.replace(/ on[a-z]+\s*=\s*'[^']*'/gi, "");
  s = s.replace(/javascript:/gi, "");
  return s;
}

function authorTags(c){

/* Markdown 的结构照着 juicer 的成品排：先给能不能听的判断，再给内容 */
function buildMd(ep, chaps, cm, segs, opt){

  L.push("> 发布：" + String(ep.pub || "").slice(0, 10) + "　时长：" + (ep.dur ? fmtDur(ep.dur) : "—"));
  L.push("");
  if (opt.meta){
    L.push("## 决策卡");
    L.push("");
    L.push("| 项目 | 值 |");
    L.push("| --- | --- |");
    L.push("| 时间投入 | " + (ep.dur ? fmtDur(ep.dur) : "—") + " |");
    L.push("| 播放 / 评论 / 鼓掌 | " + fmtCount(ep.plays) + " / " + fmtCount(ep.comments) + " / " + fmtCount(ep.claps) + " |");
    L.push("| 每小时播放 | " + (s.playsPerHour != null ? s.playsPerHour : "—") + " |");
    L.push("| 每千播放评论 | " + (s.cmtPerK != null ? s.cmtPerK : "—") + " |");
    L.push("| 发布至今 | " + (s.ageHours ? Math.round(s.ageHours) + " 小时" : "—") + " |");
    L.push("| 抓取时间 | " + new Date().toISOString().replace(/\.\d+Z$/, "Z") + " |");
    L.push("");
    var notes = htmlToText(ep.shownotes || ep.desc || "");
    if (notes){
      L.push("## 节目简介（shownotes 原文）");
      L.push("");
      L.push(notes);
      L.push("");
    }
  }
  if (opt.chap && chaps && chaps.length){
    L.push("## 章节时间轴");
    L.push("");
    for (var i = 0; i < chaps.length; i++) L.push("- `" + chaps[i].ts + "` " + chaps[i].title);
    L.push("");
  }
  if (opt.cmt && cm && cm.list && cm.list.length){
    L.push("## 热评（" + cm.list.length + " 条" + (cm.total ? " / 共 " + cm.total : "") + "）");
    L.push("");
    for (var j = 0; j < cm.list.length; j++){
      var c = cm.list[j];
      var a = c.author || {};
      var tg = authorTags(c).map(function(t){ return "[" + t.t + "]"; }).join("");
      L.push("- 👏" + (c.likeCount || 0) + "　**" + (a.nickname || "匿名") + "**" + tg +
             (c.ipLoc ? "（" + c.ipLoc + "）" : "") + "　" + String(c.createdAt || "").slice(0, 10));
      L.push("  " + String(c.text || "").replace(/\n/g, " "));
      var reps = isArr(c.replies) ? c.replies.slice(0, 3) : [];
      for (var q = 0; q < reps.length; q++){
        var ra = reps[q].author || {};
        L.push("  - ↳ **" + (ra.nickname || "匿名") + "**：" + String(reps[q].text || "").replace(/\n/g, " "));
      }
    }
    L.push("");
  }
  if (opt.tr && segs && segs.length){
    L.push("## 逐字稿");
    L.push("");
    L.push("> 小宇宙官方自动生成，约 90 秒一个时间锚点；ASR 结果，人名/术语可能有误，且没有说话人标注。");
    L.push("");
    var g = groupSegs(segs, 90);
    for (var w = 0; w < g.length; w++){
      L.push("**[" + secToHms(g[w].t) + "]** " + g[w].x);
      L.push("");
    }
  }
  return L.join("\n");
}

var _lastPosSave = 0;

function playAt(i, keepPos, seekTo){

  PL.index = i;

  var t = PL.queue[i];
  PL.tr = []; PL.trIdx = -1;
  PL.chaps = extractChapters(htmlToText(t.shownotes || t.desc || ""));

  PL.wantPos = seekTo != null ? seekTo
             : ((saved > 10 && (!t.dur || saved < t.dur - 15)) ? saved : 0);

  try{ audio.pause(); }catch(e){}
  audio.removeAttribute("src");
  try{ audio.load(); }catch(e){}

  resolveAudio(t).then(function(url){
    if (PL.queue[PL.index] !== t) return;
    if (!url){ toast("这一集没取到音源"); return; }
    /* 喜马托管的单集在这里换高码率地址；不是喜马的直接原样返回 */
    return xmUpgrade(t, url).then(function(better){
      if (PL.queue[PL.index] !== t) return;
      startSrc(better || url);
      if (t.xmUpgraded && better !== url) toast("已用喜马拉雅高码率音源", 1600);
    });
  })["catch"](function(err){
    if (PL.queue[PL.index] !== t) return;
    toast((err && err.message) ? err.message : "取音源失败", 2600);
  });

  /* 文稿晚一点再取：先把带宽让给音频，起播能快一些 */
  if (t.src === "rss"){
    renderFpLyric(null, "RSS 来源没有官方逐字稿");

  setTimeout(function(){
    if (PL.queue[PL.index] !== t || t.src === "rss") return;
    API.transcript(t).then(function(segs){
      if (PL.queue[PL.index] !== t) return;
      PL.tr = segs;
      renderFpLyric(segs, "");
    })["catch"](function(err){
      if (PL.queue[PL.index] !== t) return;

/* 三层音源解析：
   1) 搜索命中先补一次完整单集详情，避免精简结果漏掉 isPrivateMedia；
   2) 已购买的私有内容走 xyz 项目验证的 /v1/private-media/get；
   3) 只有确认是公开内容时才直接使用 enclosure / media.source。
   私有接口失败时不再静默播放 10 秒试听，直接说明购买或凭证状态。 */
function mergeEpisodeDetail(t, e){
  if (!t || !e) return;
  if (e.audio) t.audio = e.audio;
  t.priv = !!(t.priv || e.priv);
  t.dur = t.dur || e.dur;
  t.asize = t.asize || e.asize;
  t.shownotes = t.shownotes || e.shownotes;
  t.mediaId = t.mediaId || e.mediaId;
  t.detailChecked = true;
  if (!PL.chaps.length){
    PL.chaps = extractChapters(htmlToText(e.shownotes || e.desc || ""));
    paintChapMarks();
  }
}
/* =========================================================================
   喜马拉雅 ↔ 小宇宙 的桥接
   ========================================================================= */
/* -------- 播放期音质升级 --------
   分集列表照旧走 RSS（标题、简介、更新时间都在那份里最全），
   但喜马托管的 RSS 里 enclosure 给的通常是一档较低的转码。
   真正要播的时候，拿这一集去喜马接口换一条高码率地址。
   换不到就用 RSS 那条，绝不因为升级失败而播不了。 */
function isXmAudio(u){
  return /(^|\.)ximalaya\.com|xmcdn\.com/i.test(String(u || ""));
}
/** 有些喜马的 enclosure 里直接带了 trackId，能省掉一整轮搜索匹配 */
function xmTidFromUrl(u){
  var m = /[?&]track_?id=(\d{4,})/i.exec(String(u || "")) ||
          /\/track\/(\d{6,})/i.exec(String(u || ""));
  return m ? m[1] : "";
}
var XM_UP_MS = 6000;          /* 升级最多等这么久，超时就用 RSS 那条起播 */
function xmUpgrade(t, url){
  if (!t || !url) return Promise.resolve(url);
  if (!isXmAudio(url)) return Promise.resolve(url);      /* 不是喜马托管，不用管 */
  if (t._xmUp && t._xmUpAt && now() - t._xmUpAt < 30 * 60000) return Promise.resolve(t._xmUp);

  var tid = xmTidFromUrl(url) || (xmHitMap()[t.eid || ""] || {}).tid || "";
  var job = tid
    ? XM.trackUrl({ id: tid }, "high").then(function(u){ return u ? { url: u, tid: tid } : null; })
    : XM.rescue({ title: t.title, dur: Number(t.dur) || 0,
                  podTitle: t.podTitle || "", podAuthor: t.podAuthor || "" }, "high")
        .then(function(r){ return (r && r.url) ? { url: r.url, tid: r.track && r.track.id } : null; });

  /* 起播速度优先：超时就先用 RSS 那条，别让用户干等 */
  var guard = new Promise(function(res){ setTimeout(function(){ res(null); }, XM_UP_MS); });
  return Promise.race([job["catch"](function(){ return null; }), guard]).then(function(r){
    if (!r || !r.url) return url;
    if (r.tid) xmHitSet(t.eid, r.tid);
    t._xmUp = r.url; t._xmUpAt = now();
    t.xmUpgraded = true;
    return r.url;
  })["catch"](function(){ return url; });
}

/* -------- 播放失败时的喜马兜底 --------
   小宇宙这边取不到流（付费、防盗链、直链失效）时，按标题 + 时长去喜马
   找同一期节目。匹配结果按 eid 缓存，同一集不会反复搜。 */
var XM_HIT_LS = "xz_xm_hit_v1";
function xmHitMap(){
  try{ return JSON.parse(localStorage.getItem(XM_HIT_LS) || "{}") || {}; }
  catch(e){ return {}; }
}
function xmHitSet(eid, tid){
  if (!eid || !tid) return;
  try{
    var m = xmHitMap();
    m[eid] = { tid: String(tid), at: now() };
    var ks = Object.keys(m);
    if (ks.length > 300){
      ks.sort(function(a, b){ return (m[b].at || 0) - (m[a].at || 0); });
      var keep = {};
      for (var i = 0; i < 200; i++) keep[ks[i]] = m[ks[i]];
      m = keep;
    }
    localStorage.setItem(XM_HIT_LS, JSON.stringify(m));
  }catch(e){}
}
function xmRescue(t){
  if (!t || !t.title) return Promise.resolve(null);
  var cached = xmHitMap()[t.eid || ""];
  var head = (cached && cached.tid)
    ? XM.trackUrl({ id: cached.tid }, "high").then(function(u){
        return u ? { url: u, label: "喜马拉雅（已匹配）" } : null;
      })["catch"](function(){ return null; })
    : Promise.resolve(null);

  return head.then(function(hit){
    if (hit) return hit;
    return XM.rescue({
      title: t.title, dur: Number(t.dur) || 0,
      podTitle: t.podTitle || "", podAuthor: t.podAuthor || ""
    }, "high").then(function(r){
      if (!r || !r.url) return null;
      xmHitSet(t.eid, r.track && r.track.id);
      return { url: r.url, label: "喜马拉雅 · " + (r.album && r.album.title ? r.album.title : "匹配"), score: r.score };
    })["catch"](function(){ return null; });
  });
}

function resolveAudio(t){
  if (!t) return Promise.resolve("");
  if (t._resolvedAudio && t.audioAccess !== "preview" &&
      (!t._resolvedAt || now() - t._resolvedAt < 3 * 60 * 60 * 1000))
    return Promise.resolve(t._resolvedAudio);

  function choose(){
    if (t.priv){
      if (!TK.has()){
        t.audioAccess = "preview";
        t.audioWarning = "检测到付费试听，但没有登录凭证";
        return Promise.reject(new Error("这是付费单集：请先填写已购买账号的登录凭证；已阻止播放 10 秒试听"));
      }
      t.audioAccess = "checking";
      return API.privateAudio(t).then(function(url){
        t._resolvedAudio = url; t._resolvedAt = now();
        return url;
      })["catch"](function(err){
        t.audioAccess = "preview";
        t.audioWarning = (err && err.message) || "完整付费音源解析失败";
        throw new Error(t.audioWarning + "；已阻止播放 10 秒试听");
      });
    }
    if (!t.audioAccess) t.audioAccess = "public";
    t._resolvedAudio = t.audio || "";
    t._resolvedAt = now();
    return Promise.resolve(t._resolvedAudio);
  }

  if (t.searchHit && !t.detailChecked && t.eid){
    return API.episode(t.eid, true).then(function(e){
      mergeEpisodeDetail(t, e);
      return choose();
    }, function(){
      /* 详情请求失败时仍保留搜索结果；若搜索结果已标记付费，choose 会继续
         尝试私有音源，未标记的 10 秒片段则由 loadedmetadata 二次识别。 */
      t.detailChecked = true;
      return choose();
    });
  }
  if (t.audio || t.priv) return choose();
  return API.episode(t.eid, true).then(function(e){
    mergeEpisodeDetail(t, e);
    return choose();
  });
}
function startWebSrc(url){
  if (bgActive || bgBusy) bgClearActive(true);
  audio.src = url;

function startSrc(url){
  var t = PL.queue[PL.index];

  if (t && t.audioAccess === "preview")
    toast(t.audioWarning || "当前可能是试听片段；登录后可解析完整音源", 3600);
  if (hostPreferred()){

/* 某些搜索结果没有付费标记，只在浏览器读到“节目写一小时、文件却只有
   10 秒”时才暴露。此时暂停试听，并用账号向私有接口验证一次；成功后
   原地换成完整签名地址，失败则明确停住，不再循环播放试听。 */
function recoverPaidPreview(t, pos){
  if (!t || t.audioAccess === "full" || t._paidRecovering) return false;
  if (t._paidRecoveryFailed) return true;
  t._paidRecovering = true;
  t.priv = true;
  t.audioAccess = "preview";
  t.audioWarning = "检测到约 10 秒的付费试听地址";
  try{ audio.pause(); }catch(e){}
  if (!TK.has()){
    t._paidRecovering = false;
    t._paidRecoveryFailed = true;
    toast("检测到付费试听：请填写已购买账号的登录凭证", 3800);
    return true;
  }
  toast("检测到付费试听，正在验证已购完整音源…", 3200);
  API.privateAudio(t).then(function(url){
    t._paidRecovering = false;
    t._paidRecovered = true;
    t._resolvedAudio = url;
    t._resolvedAt = now();
    if (PL.queue[PL.index] !== t) return;
    PL.wantPos = Math.max(0, Number(pos || 0));
    toast("已换成账号授权的完整音源", 2600);
    startSrc(url);
  })["catch"](function(err){
    t._paidRecovering = false;
    t._paidRecoveryFailed = true;
    t.audioAccess = "preview";
    t.audioWarning = (err && err.message) || "没有取得完整付费音源";
    if (PL.queue[PL.index] === t)
      toast(t.audioWarning + "；试听已停止", 4200);
  });
  return true;
}

function next(auto){

function prev(){
  if (!PL.queue.length) return;
  if (bgActive){ nativeHostControl("prev"); return; }
  if (audio.currentTime > 4){ audio.currentTime = 0; return; }

}
function togglePlay(){
  if (!PL.queue.length){ toast("先挑一集吧"); return; }
  if (bgActive){ nativeHostControl(nativeIsPlaying() ? "pause" : "play"); return; }
  if (audio.paused){
    if (!audio.src){ playAt(PL.index < 0 ? 0 : PL.index); return; }
    var p = audio.play();
    if (p && p["catch"]) p["catch"](function(){});
  } else audio.pause();
}
/* 播客场景里前后跳比切集常用得多：默认后退 15 / 快进 30 */
function seekBy(d){
  if (bgActive){
    var pos = Math.max(0, Number(bgLastStatus && bgLastStatus.position) || 0);
    var dur = Math.max(0, Number(bgLastStatus && bgLastStatus.duration) || 0);
    var to = pos + Number(d || 0) * 1000;
    if (dur > 0) to = clamp(to, 0, Math.max(0, dur - 500));
    nativeHostSeek(to);
    toast((d > 0 ? "快进 " : "后退 ") + Math.abs(d) + " 秒", 900);
    return;
  }
  if (!audio.duration) return;
  try{ audio.currentTime = clamp(audio.currentTime + d, 0, audio.duration - 0.5); }catch(e){}
  toast((d > 0 ? "快进 " : "后退 ") + Math.abs(d) + " 秒", 900);
}

audio.addEventListener("play", function(){ setPaused(false); paintPlayBtns(); });
audio.addEventListener("pause", function(){ setPaused(true); paintPlayBtns(); });
audio.addEventListener("ended", function(){
  /* 明明才播了一小截就 ended，多半是这条流在 WebView 里不可 seek
     （宿主拦截请求后用 InputStream 回包，没有 Content-Length 也不支持 Range，
     媒体栈读完第一个缓冲区就当播完了）。这种情况下自动"下一集"是错的，
     应该原地停住并把播放交给宿主的原生播放器 —— 它走的是自己的网络栈。 */
  var cur = PL.queue[PL.index];
  var want = cur && cur.dur ? Number(cur.dur) : 0;
  var got = 0;
  try{ got = audio.currentTime || 0; }catch(e){}
  if (want > 60 && got > 0 && got < want * 0.9){
    try{ audio.pause(); }catch(e){}
    /* 约 10 秒结束首先按付费试听处理；完整付费签名地址才进入普通的
       WebView 中断/宿主接管分支。 */
    if (got <= 45 && cur && cur.audioAccess !== "full" && recoverPaidPreview(cur, got)) return;
    if (CFG.player === "auto" && X.isNative() && !PL.cutOnce){
      PL.cutOnce = true;
      toast("只播到 " + fmtTime(got) + " 就断了（应有 " + fmtTime(want) + "），正在交给宿主播放器", 3600);
      setTimeout(function(){ try{ bgHandoff(); }catch(e){} }, 700);
    } else {
      toast("页面音频提前中断；可切到「智能切换」，或点「后台播放」", 3400);
    }
    return;
  }
  PL.cutOnce = false;
  if (sleepEnd){
    sleepEnd = false;
    setSleep(0, false);
    try{ audio.pause(); }catch(e){}
    hostStop();
    toast("这一集听完，已停止", 2400);
    return;
  }
  next(true);
});
audio.addEventListener("loadedmetadata", function(){
  var t = PL.queue[PL.index];
  var ad = audio.duration;
  /* 文件报出来的时长比节目信息短一大截时，别信它，更别写回节目数据。
     两种常见成因：一是拿到的本来就是付费试听片段；二是这份 m4a 没做
     faststart（moov 原子在文件尾），浏览器在下完之前读不出真实时长。
     以前这里直接 t.dur = audio.duration，等于把错的时长写进了收听记录。 */
  var declared = t && t.dur ? Number(t.dur) : 0;
  var fishy = isFinite(ad) && ad > 0 && declared > 60 && ad < declared * 0.5;
  if (t){
    if (fishy){
      t.durReal = Math.round(ad);
      if (!PL.warnedShort && ad > 45){
        PL.warnedShort = true;
        toast("音频只有 " + fmtTime(ad) + "，节目信息写的是 " + fmtTime(declared) + "，可能是试听片段", 3200);
      }
    } else if ((!t.dur || Math.abs(t.dur - ad) > 3) && isFinite(ad)){
      t.dur = Math.round(ad);
      t.durReal = 0;
    }
  }
  $("#fpDur").textContent = fmtTime((fishy ? declared : ad) || (t && t.dur) || 0);
  paintChapMarks();
  if (t && fishy && ad <= 45 && t.audioAccess !== "full"){
    var resumePaid = PL.wantPos || 0;
    PL.wantPos = 0;
    if (recoverPaidPreview(t, resumePaid)) return;
  }
  if (PL.wantPos > 0 && isFinite(audio.duration) && PL.wantPos < audio.duration - 5){
    try{
      audio.currentTime = PL.wantPos;
      toast("已从 " + fmtTime(PL.wantPos) + " 继续", 1600);
    }catch(e){}
  }
  PL.wantPos = 0;
});
audio.addEventListener("emptied", function(){ PL.warnedShort = false; });
audio.addEventListener("timeupdate", function(){
  if (PL.seeking) return;
  var d = audio.duration || 0, c = audio.currentTime || 0;
  var pct = d > 0 ? (c / d * 100) : 0;
  $("#fpFil").style.width = pct + "%";
  $("#fpKnb").style.left = pct + "%";
  $("#miniProg").style.width = pct + "%";
  $("#fpCur").textContent = fmtTime(c);
  syncLyric(c);
  syncTransPanel(c);
  var t = PL.queue[PL.index];
  if (t && now() - _lastPosSave > 5000){ _lastPosSave = now(); posSave(t.eid, c, d); }
});
audio.addEventListener("progress", function(){
  try{
    if (audio.buffered && audio.buffered.length && audio.duration){
      var e = audio.buffered.end(audio.buffered.length - 1);
      $("#fpBuf").style.width = (e / audio.duration * 100) + "%";
    }
  }catch(e){}
});
audio.addEventListener("error", function(){
  var t = PL.queue[PL.index];
  if (!t) return;
  /* 切集时会先 removeAttribute("src") + load()，这一步也会触发 error，
     此时没有真实地址，不该当成播放失败去重取一次流。 */
  if (!audio.getAttribute("src")) return;
  if (PL.retried) return;
  PL.retried = true;
  t.audio = "";
  resolveAudio(t).then(function(u){
    if (!u) throw new Error("no url");
    /* 直链偶尔被防盗链挡住，宿主里可以换成 /webResource 代理再试一次 */
    if (window.fm && typeof window.fm.res === "function"){
      try{
        var r = window.fm.res(u, { headers: { "User-Agent": X.UA_APP, "Referer": X.WEB_BASE + "/" } });
        if (r && typeof r === "string") u = r;
      }catch(e){}
    }
    startSrc(u);
  })["catch"](function(){
    /* 小宇宙这条路彻底走不通了，去喜马找同一期当兜底音源 */
    toast("正在找喜马拉雅的同一期…", 1600);
    return xmRescue(t).then(function(r){
      if (!r || !r.url) throw new Error("no xm");
      t._resolvedAudio = r.url; t._resolvedAt = now();
      t.audioAccess = "public";
      t.audioWarning = "";
      t.xmFallback = r.label || "喜马拉雅";
      var u2 = r.url;
      if (window.fm && typeof window.fm.res === "function"){
        try{
          var rr = window.fm.res(u2, { headers: { "User-Agent": XM_UA_IOS, "Referer": "https://www.ximalaya.com/" } });
          if (rr && typeof rr === "string") u2 = rr;
        }catch(e){}
      }
      startSrc(u2);
      toast("已换到喜马拉雅音源", 2000);
    })["catch"](function(){
      toast("这一集播放失败", 2200);
    });
  });
});

/* ---- 进度条拖动 ---- */
(function(){
  var bar = $("#fpBar");
  function pos(e){
    var r = bar.getBoundingClientRect();
    var x = (e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX) - r.left;
    return clamp(x / r.width, 0, 1);
  }
  function apply(p, commit){
    var d = bgActive ? (Number(bgLastStatus && bgLastStatus.duration) || 0) / 1000 : (audio.duration || 0);
    $("#fpFil").style.width = (p * 100) + "%";
    $("#fpKnb").style.left = (p * 100) + "%";
    $("#fpCur").textContent = fmtTime(p * d);
    if (commit && d > 0){
      if (bgActive) nativeHostSeek(p * d * 1000);
      else try{ audio.currentTime = p * d; }catch(e){}
    }
  }
  function down(e){
    if (!(bgActive ? Number(bgLastStatus && bgLastStatus.duration) : audio.duration)) return;
    PL.seeking = true; bar.classList.add("act");
    apply(pos(e), false);
    e.preventDefault();
  }
  function move(e){ if (!PL.seeking) return; apply(pos(e), false); e.preventDefault(); }
  function up(e){
    if (!PL.seeking) return;
    PL.seeking = false; bar.classList.remove("act");
    apply(pos(e.changedTouches ? { touches: e.changedTouches, clientX: e.changedTouches[0].clientX } : e), true);
  }
  bar.addEventListener("touchstart", down, { passive: false });
  bar.addEventListener("touchmove", move, { passive: false });
  bar.addEventListener("touchend", up);
  bar.addEventListener("touchcancel", up);
  bar.addEventListener("mousedown", down);
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
  bar.addEventListener("click", function(e){
    if (!(bgActive ? Number(bgLastStatus && bgLastStatus.duration) : audio.duration)) return;
    apply(pos(e), true);
  });
})();

/* 播放页下拉收起 */
(function(){
  var fp = $("#fullPlayer"), y0 = 0, on = false;
  /* 只在封面 / 标题 / 顶栏这几块起手。原来整个播放页都能拖，结果在进度条、
     章节列表上一划，整页跟着走，手感很乱。 */
  function draggable(t){
    for (var n = t; n && n !== fp; n = n.parentNode){
      if (!n.classList) continue;
      if (n.classList.contains("fp-dock") || n.classList.contains("fp-quick")) return false;
      if (n.classList.contains("fp-top") || n.classList.contains("fp-stage") ||
          n.classList.contains("fp-art") || n.classList.contains("fp-meta")) return true;
    }
    return false;
  }
  function reset(){ on = false; fp.style.transform = ""; }
  fp.addEventListener("touchstart", function(e){
    if (!e.touches || e.touches.length !== 1) return;
    if (!fp.classList.contains("on")) return;
    if ($("#fpLyric").classList.contains("on")) return;
    if (!draggable(e.target)) return;
    y0 = e.touches[0].clientY; on = true;
  }, { passive: true });
  fp.addEventListener("touchmove", function(e){
    if (!on || !e.touches || !e.touches.length) return;
    var dy = e.touches[0].clientY - y0;
    if (dy > 0) fp.style.transform = "translate3d(0," + Math.min(dy * 0.55, 240) + "px,0)";
  }, { passive: true });
  fp.addEventListener("touchend", function(e){
    if (!on) return;
    var dy = (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientY : y0) - y0;
    reset();
    if (dy > 96) closeLayer();
  });
  /* 被系统返回手势 / 来电 / 息屏打断时只会收到 touchcancel。
     不接这一下，内联 transform 就留在元素上，页面从此半死不活。 */
  fp.addEventListener("touchcancel", reset);
})();

var sleepAt = 0, sleepEnd = false, sleepIv = null;
function setSleep(min, endOfTrack){
  sleepEnd = !!endOfTrack;
  sleepAt = min > 0 ? now() + min * 60000 : 0;
  if (sleepIv){ clearInterval(sleepIv); sleepIv = null; }
  var pill = $("#sleepPill");
  if (sleepAt){
    sleepIv = setInterval(tickSleep, 1000);
    pill.classList.add("on");
    tickSleep();
  } else if (sleepEnd){
    pill.classList.add("on");
    $("#sleepLeft").textContent = "本集";
  } else {
    pill.classList.remove("on");
  }
  var b = $("#fpSleep");
  if (b){
    b.classList.toggle("on", !!(sleepAt || sleepEnd));
    var sp = b.querySelector("span");
    if (sp) sp.textContent = sleepAt ? "定时中" : (sleepEnd ? "本集停" : "定时");
  }
}
function tickSleep(){
  if (!sleepAt) return;
  var left = sleepAt - now();
  if (left <= 0){
    setSleep(0, false);
    try{ audio.pause(); }catch(e){}
    hostStop();
    toast("定时到了，已暂停", 2600);
    return;
  }
  $("#sleepLeft").textContent = fmtTime(left / 1000);
}

/* =========================================================================
   复制 / 保存 / 下载
   ========================================================================= */
function safeName(s){
  return String(s || "untitled").replace(/[\\\/:*?"<>|\n\r\t]/g, "_").slice(0, 80);
}
function copyText(t){
  if (!t){ toast("没有可复制的内容"); return; }
  var done = function(){ toast("已复制到剪贴板"); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done)["catch"](fallback);
    return;
  }
  fallback();
  function fallback(){
    try{
      var ta = document.createElement("textarea");
      ta.value = t;
      ta.style.cssText = "position:fixed;left:-9999px;top:0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    }catch(e){ toast("复制失败，长按选中吧", 2600); }
  }
}
function saveBlob(blob, filename){
  try{
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1200);
    toast("已保存 " + filename, 2400);
  }catch(e){ toast("保存失败：" + (e.message || e), 2800); }
}
function b64ToBlob(b64, mime){
  var bin = atob(String(b64).replace(/^data:[^,]+,/, ""));
  var len = bin.length, arr = new Uint8Array(len);
  for (var i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime || "application/octet-stream" });
}
/* 音频下载：宿主里走 fm.req 拿 base64（不受 CORS 限制），浏览器退回 fetch */
function fetchBinary(url){
  if (window.fm && typeof window.fm.req === "function"){
    return Promise.resolve(window.fm.req(url, {
      method: "GET",
      headers: { "User-Agent": X.UA_APP, "Referer": X.WEB_BASE + "/" },
      responseType: "base64",
      timeout: 120
    })).then(function(res){
      var b64 = typeof res === "string" ? res : (res && (res.body || res.data || res.base64));
      if (!b64) throw new Error("宿主没有回传数据");
      return b64ToBlob(b64, "audio/mpeg");
    });
  }
  return fetch(url, { mode: "cors", credentials: "omit" }).then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.blob();
  });
}
function dlOne(ep){
  var t = ep;
  toast("开始下载…");
  resolveAudio(t).then(function(url){
    if (!url) throw new Error("没有音源");
    return fetchBinary(url).then(function(blob){
      var ext = /\.m4a/i.test(url) ? ".m4a" : ".mp3";
      saveBlob(blob, safeName((t.podTitle ? t.podTitle + " - " : "") + t.title) + ext);
    });
  })["catch"](function(err){
    toast("下载失败：" + ((err && err.message) || "未知错误"), 3000);
  });
}

    if (token !== bgSyncToken || document.hidden) return;
    syncNativePlaybackState(true).then(function(){
      if (token !== bgSyncToken || document.hidden) return; tries++;
      if (tries < 8 || bgActive || bgSessionHint) setTimeout(tick, tries < 2 ? 160 : (tries < 4 ? 350 : (tries < 8 ? 700 : 1000)));
    });
  }
  tick();
}
function openNativePlayer(){
  if (!PL.queue.length){ toast("先播一集吧"); return; }
  try{ var fm = window.fm;
    if (bgActive && fm && typeof fm.openPlayer === "function"){
      Promise.resolve(fm.openPlayer())["catch"](function(){ bgHandoff({ autoReturn:false, forceNew:true,
        fallbackToWeb:false, startPositionMs:Number(bgLastStatus && bgLastStatus.position) || 0 }); }); return;
    }
  }catch(e){}
  bgHandoff({ autoReturn:false, forceNew:true, fallbackToWeb:false,
    startPositionMs:bgActive ? Number(bgLastStatus && bgLastStatus.position) || 0 : (audio.currentTime || 0) * 1000 });
}
try{
  ["pageshow","focus","fmresume"].forEach(function(ev){ window.addEventListener(ev, beginNativeResumeSync); });
  window.addEventListener("fmplaybackstate", function(ev){ try{ applyNativeHostStatus((ev && ev.detail) || {}); }catch(e){} });
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) beginNativeResumeSync(); });
}catch(e){}
$("#bgPlayBtn").addEventListener("click", function(e){ e.stopPropagation(); openNativePlayer(); });
bgSessionHint = readNativeSession();
if (bgSessionHint) restoreNativeQueueSnapshot();
bgRegisterResolver(); bgUpdateBtn();

/* =========================================================================
   起步
   ========================================================================= */
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && stack.length) closeLayer();
});
window.addEventListener("beforeunload", function(){
  var t = PL.queue[PL.index];
  if (t){
    var p = bgActive ? (Number(bgLastStatus && bgLastStatus.position) || 0) / 1000 : (audio.currentTime || 0);
    var d = bgActive ? (Number(bgLastStatus && bgLastStatus.duration) || 0) / 1000 : (audio.duration || 0);
    posSave(t.eid, p, d);
    try{ saveNativeQueueSnapshot(); }catch(e){}
    if (bgActive) saveNativeSession(bgLastStatus || {}, true);
  }
});

bindHostBack();
enterEdgeAfterReloadOnce();
renderDisc();
mountTopbar(curTab);
whenFm(6000).then(function(){
  try{ document.documentElement.classList.add("fm-native"); }catch(e){}
})["catch"](function(){});

/* 调试出口：测试脚本用 */
window.__XZUI = {

  seekBy: seekBy, bgHandoff: bgHandoff, setSleep: setSleep, toast: toast, openFull: openFull,

  doSearch: doSearch, renderMine: renderMine, renderDisc: renderDisc, renderSub: renderSub,

  sheetGenres: sheetGenres, sheetDiag: sheetDiag, resolveEp: resolveEp, preparePod: preparePod,
  buildMd: buildMd, aiPrompt: aiPrompt, copyText: copyText, dlOne: dlOne,

  VT: VT, EP: function(){ return EP; }, PD: function(){ return PD; }, JX: function(){ return JX; }
};
})();

/* ============================================================
   顶部安全区：退出全屏之后要跟着收回来
   ------------------------------------------------------------
   宿主在 edge（全屏）模式下让 WebView 顶到状态栏底下，所以上报的
   inset 是状态栏高度，页面顶栏必须自己让开这一截，否则会压在状态栏上。
   退出全屏后宿主画了自己的顶栏，WebView 已经在它下面了，可上报的
   inset 还是原来那个值 —— 页面再让开一次，就白白多顶出一条空白。

   这里按宿主当前模式算一个有效值写进 --safe-t-eff：
     · edge / 模式未知 → 用原值，保持老行为，绝不会顶进状态栏
     · 其它模式        → 状态栏已经被宿主顶栏占掉了，收成 0
   再用 screenY 兜一层：宿主确实把 WebView 往下挪过的话，
   挪了多少就从 inset 里扣多少，扣到 0 为止。
   ============================================================ */
(function(){
var _chromeMode = "";
var _safeTopBase = null, _safeTopApplied = null;
/* 和上面 CSS 里 --safe-t 的原始表达式保持一致，改一处要改两处 */
var SAFE_TOP_BASE = "max(var(--fm-safe-top,0px), env(safe-area-inset-top,0px))";
function noteChromeMode(m){
  m = String(m == null ? "" : m).replace(/^[\s"']+|[\s"']+$/g, "");
  if (!m || m === _chromeMode) return;
  _chromeMode = m;
  syncSafeTop();
}
function readChromeMode(){
  try{
    if (window.__fmViewport && window.__fmViewport.chromeMode){
      noteChromeMode(window.__fmViewport.chromeMode); return;
    }
  }catch(e){}
  try{
    var v = getComputedStyle(document.documentElement).getPropertyValue("--fm-chrome-mode");
    if (v) noteChromeMode(v);
  }catch(e){}
}
/* env() 没法直接读。塞个探针，高度就写 CSS 那条原始表达式，量出来多少就是多少 ——
   浏览器不认 max()/env() 时声明会被丢掉，量到 0，这时再退回宿主变量的数值。 */
function probeSafeTopPx(){
  if (_safeTopBase != null) return _safeTopBase;
  var h = 0;
  try{
    var el = document.createElement("div");
    el.style.cssText = "position:fixed;top:0;left:0;width:0;visibility:hidden;pointer-events:none;height:0";
    el.style.height = SAFE_TOP_BASE;
    (document.body || document.documentElement).appendChild(el);
    h = el.getBoundingClientRect().height || 0;
    el.parentNode.removeChild(el);
  }catch(e){}
  if (!h){
    try{
      var n = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fm-safe-top"));
      if (isFinite(n) && n > 0) h = n;
    }catch(e){}
  }
  _safeTopBase = h;
  return h;
}
function webviewTopPx(){
  try{
    var y = (window.screenY == null) ? window.screenTop : window.screenY;
    y = Number(y);
    return (isFinite(y) && y > 0) ? y : 0;
  }catch(e){}
  return 0;
}
function syncSafeTop(){
  var eff;
  if (_chromeMode && _chromeMode !== "edge") eff = 0;
  else eff = Math.max(0, probeSafeTopPx() - webviewTopPx());
  eff = Math.round(eff * 10) / 10;
  if (eff === _safeTopApplied) return;
  _safeTopApplied = eff;
  try{ document.documentElement.style.setProperty("--safe-t-eff", eff + "px"); }catch(e){}
}
function invalidateSafeTop(){
  _safeTopBase = null; _safeTopApplied = null;
  readChromeMode(); syncSafeTop();
}
try{
  window.addEventListener("fmviewport", function(e){
    var d = e && e.detail;
    if (d && d.chromeMode) noteChromeMode(d.chromeMode);
    invalidateSafeTop();
  });
  window.addEventListener("resize", invalidateSafeTop);
  window.addEventListener("orientationchange", invalidateSafeTop);
  window.addEventListener("pageshow", invalidateSafeTop);
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) invalidateSafeTop();
  });
  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", invalidateSafeTop);
  } else invalidateSafeTop();
  setInterval(function(){ readChromeMode(); syncSafeTop(); }, 1000);
}catch(e){}
})();
</script>
